invasivo de su intimidad.", "pagina": 1, "offset": 645, "id": "MM-3129-2022#10", "materias": {"Protección de datos personales": {"peso": 3, "por": ["frase: números telefónicos", "término: intimidad"]}}, "normas": [], "refs": [], "principal": true}, {"doc": "MM-4187-2026", "orden": 1, "etiqueta": "1", "texto": "La Ley N° 21.719, publicada el 13 de diciembre de 2024, sustituyó íntegramente el contenido de la Ley N° 19.628 y entra en vigencia el 1 de diciembre de 2026 conforme a su artículo primero transitorio. Aun cuando a esta fecha rige el texto anterior, la puesta en marcha del sistema será posterior o coetánea a dicha vigencia, de modo que el diseño debe concebirse desde su origen conforme al nuevo estatuto, en aplicación del deber de protección desde el diseño y por defecto del artículo 14 quáter. Un desarrollo ajustado únicamente al régimen actual nacerá disconforme. Concurren, además, el artículo 19 N°4 de la Constitución Política; los artículos 5°, 152 quáter L, 154 y 154 bis del Código del Trabajo, así como la doctrina reiterada de la Dirección del Trabajo sobre medidas de control del empleador; y la Ley N° 16.744", "pagina": 1, "offset": 2053, "id": "MM-4187-2026#1", "materias": {"Protección de datos personales": {"peso": 2, "por": ["frase: protección desde el diseño"]}}, "normas": ["Constitución", "Código del Trabajo", "Ley 16.744", "Ley 19.628", "Ley 21.719"], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 2, "etiqueta": "2", "texto": "Cuestión previa: la ley contempla dos regímenes, el general de los artículos 12, 13 y 16, y el especial del Título IV, cuyo artículo 20 declara lícito el tratamiento que los órganos públicos efectúan para el cumplimiento de sus funciones legales, sin necesidad de consentimiento. Siendo la Corporación una corporación de derecho privado, su encuadre en la noción de \"órgano público\" para estos efectos es discutible y no existe todavía posición institucional formalizada ni criterio de la Agencia de Protección de Datos Personales. Por prudencia jurídica, este pronunciamiento adopta un anclaje dual: la licitud se funda en primer término en el artículo 13 letras b) y c) y sólo subsidiariamente en el artículo 20 (SERNAFOR), de modo que la validez del sistema no quede supeditada al resultado de una discusión aún abierta", "pagina": 1, "offset": 3029, "id": "MM-4187-2026#2", "materias": {"Protección de datos personales": {"peso": 6, "por": ["frase: Protección de datos personales", "frase: datos personales", "frase: protección de datos"]}, "Naturaleza jurídica de CONAF": {"peso": 5, "por": ["frase: corporación de derecho privado", "frase: derecho privado", "término: sernafor"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 3, "etiqueta": "1", "texto": "La respuesta es afirmativa. La ley no prohíbe el tratamiento de datos del personal; lo somete a condiciones de licitud, finalidad, proporcionalidad y seguridad. Más aún, esta Fiscalía estima que la iniciativa cuenta con un fundamento particularmente sólido: la finalidad declarada, asignar personal según sus competencias y acreditaciones efectivas, es instrumental al cumplimiento del deber de protección eficaz de la vida y salud de los trabajadores del artículo 184 del Código del Trabajo y de las obligaciones de la Ley N° 16.744. Destinar personal a la línea de fuego sin conocimiento cierto de su formación, acreditación y aptitud constituye, precisamente, una infracción a ese deber. Correctamente diseñada, la herramienta no es un riesgo en materia de datos personales, sino un instrumento de cumplimiento", "pagina": 2, "offset": 4304, "id": "MM-4187-2026#3", "materias": {"Protección de datos personales": {"peso": 2, "por": ["frase: datos personales"]}}, "normas": ["Código del Trabajo", "Ley 16.744"], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 4, "etiqueta": "2", "texto": "La viabilidad es, con todo, condicionada: el sistema será lícito en la medida en que cada categoría de dato cuente con base de licitud idónea y acreditable; se respeten los principios del artículo 3°; se cumplan los deberes de los artículos 14 y siguientes; se practique la evaluación de impacto del artículo 15 ter antes de la puesta en marcha; y se excluyan o sometan a régimen especial los datos sensibles. La modalidad de aplicación móvil sobre dispositivos personales agrega condiciones adicionales, que se examinan en el apartado C. B. Datos que pueden incorporarse, fundamento legal y consentimiento", "pagina": 2, "offset": 5267, "id": "MM-4187-2026#4", "materias": {"Protección de datos personales": {"peso": 4, "por": ["frase: datos sensibles", "frase: base de licitud"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 5, "etiqueta": "1", "texto": "El consentimiento no es la base idónea. El artículo 12 exige que sea libre, informado, específico, previo e inequívoco, y lo declara esencialmente revocable. En la relación laboral existe una asimetría estructural que compromete la libertad de la manifestación de voluntad: difícilmente puede sostenerse que un trabajador consiente libremente cuando quien lo requiere es su empleador", "pagina": 2, "offset": 5991, "id": "MM-4187-2026#5", "materias": {"Gestión de personas": {"peso": 2, "por": ["frase: relación laboral"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 6, "etiqueta": "2", "texto": "La base idónea es la del artículo 13 letra b): cumplimiento de una obligación legal, en relación con el artículo 184 del Código del Trabajo y la Ley N° 16.744; y la del artículo 13 letra c) ejecución del contrato de trabajo, con el artículo 20 como fundamento subsidiario y el artículo 13 letra d) como base residual para hipótesis acotadas, previa ponderación documentada. El consentimiento queda reservado a un ámbito estrictamente voluntario: aquellos campos que el funcionario desee aportar en su propio beneficio, caso en el cual deberá ser expreso, separado del contrato, revocable, y dejarse constancia de que la negativa no acarrea consecuencia laboral alguna", "pagina": 2, "offset": 6460, "id": "MM-4187-2026#6", "materias": {}, "normas": ["Código del Trabajo", "Ley 16.744"], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 7, "etiqueta": "3", "texto": "En cuanto a los campos, aplicando los principios de finalidad y proporcionalidad, el criterio rector debe ser restrictivo: la ficha no es un expediente del funcionario, sino un instrumento operativo. En concreto", "pagina": 2, "offset": 7261, "id": "MM-4187-2026#7", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 8, "etiqueta": "a", "texto": "Proceden sin dificultad, y constituyen el núcleo legítimo del sistema: identificación; cargo, función y dependencia; contacto institucional; formación, cursos, certificaciones y acreditaciones SCI, con su respectiva vigencia; y experiencia operativa y competencias técnicas, registradas sobre hechos objetivos y verificables -incidentes, rol desempeñado, horas- y no sobre apreciaciones subjetivas", "pagina": 2, "offset": 7529, "id": "MM-4187-2026#8", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 9, "etiqueta": "b", "texto": "Proceden con restricciones los datos de contacto personal, en cuanto sean necesarios para la convocatoria fuera de jornada, limitados a lo indispensable y visibles sólo para los perfiles de coordinación", "pagina": 2, "offset": 8027, "id": "MM-4187-2026#9", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 10, "etiqueta": "c", "texto": "Requiere tratamiento diferenciado el contacto para casos de emergencia. Debe advertirse que estos datos no pertenecen al funcionario sino a un tercero tales como el cónyuge, conviviente o un familiar, quien es su titular y respecto de quien la Corporación pasa a ser responsable. Su tratamiento debe fundarse en el artículo 13 letra d) y cumplirse a su respecto el deber de información del artículo 14 ter, sea comunicando al tercero, sea recabando del funcionario declaración de contar con su autorización. Se recomienda limitar el registro a nombre, parentesco y un número de contacto", "pagina": 2, "offset": 8292, "id": "MM-4187-2026#10", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 11, "etiqueta": "e", "texto": "Deben excluirse los antecedentes disciplinarios o relativos a infracciones, sometidos al régimen especial del artículo 25, que prohíbe su comunicación una vez extinguida la responsabilidad respectiva. Su incorporación a una ficha operativa consultable por múltiples perfiles resulta desproporcionada y jurídicamente riesgosa", "pagina": 3, "offset": 9966, "id": "MM-4187-2026#11", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 12, "etiqueta": "4", "texto": "Datos sensibles. El artículo 2° letra g) califica como tales, entre otros, los datos relativos a la salud, al perfil biológico, los datos biométricos, el origen étnico, la afiliación sindical, la situación socioeconómica, las convicciones y la información sobre vida sexual, orientación sexual e identidad de género; conforme al artículo 16, su tratamiento requiere consentimiento expreso, salvo hipótesis excepcionales. La categoría crítica en este caso es la de salud: es previsible que el sistema tienda a incorporar aptitud física, exámenes ocupacionales o licencias médicas, todos ellos sujetos al régimen especialmente restrictivo del artículo 16 bis, que limita expresamente su tratamiento en el ámbito laboral. Esta Fiscalía es de parecer que tales antecedentes no deben alojarse en la ficha", "pagina": 3, "offset": 10369, "id": "MM-4187-2026#12", "materias": {"Protección de datos personales": {"peso": 7, "por": ["frase: datos sensibles", "frase: consentimiento expreso", "frase: datos biométricos", "término: biométricos"]}, "Gestión de personas": {"peso": 2, "por": ["término: sindical", "término: sindicales"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 13, "etiqueta": "5", "texto": "La solución correcta consiste en disociar el dato de salud del atributo operativo. La ficha no debe registrar diagnósticos, resultados de exámenes ni condiciones médicas, sino únicamente un atributo binario \"apto\" o \"no apto\" para funciones operativas, con su fecha de vigencia, generado y actualizado por la unidad de medicina del trabajo o por el organismo administrador de la Ley N° 16.744. De este modo el Comandante de Incidente dispone de la información que necesita para decidir sin acceder a dato sensible alguno, satisfaciéndose simultáneamente el artículo 184 del Código del Trabajo y las restricciones del artículo 16 bis. Tratándose de grupo sanguíneo, alergias o medicación crítica, su registro puede justificarse en la salvaguarda de la vida e integridad del titular, con consentimiento expreso, carácter voluntario, alojamiento en un módulo de emergencia segregado y registro de acceso. Los datos biométricos, regidos por el artículo 16 ter, no deben incorporarse; se advierte que el uso de fotografía para identificación en terreno es admisible, pero su empleo para reconocimiento facial la convertiría en dato biométrico. Los restantes datos sensibles deben excluirse derechamente por carecer de relación con la finalidad declarada. C. La implementación como aplicación instalada en el teléfono de cada trabajador", "pagina": 3, "offset": 11318, "id": "MM-4187-2026#13", "materias": {"Protección de datos personales": {"peso": 7, "por": ["frase: datos sensibles", "frase: consentimiento expreso", "frase: datos biométricos", "término: biométricos"]}}, "normas": ["Código del Trabajo art. 16 bis", "Ley 16.744"], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 14, "etiqueta": "1", "texto": "La definición de materializar la ficha en una aplicación residente en el teléfono personal de cada trabajador desplaza el tratamiento desde un entorno institucional controlado hacia un dispositivo de propiedad del trabajador, en el que conviven su vida privada y su actividad laboral. Ello plantea tres cuestiones que el memorándum de la referencia no contemplaba: si es lícito exigir el uso de un bien propio del trabajador; qué datos captura la aplicación del dispositivo, adicionales a los campos de la ficha; y cómo se resguarda la información que queda residente en un terminal ajeno al control de la Corporación. Se examinan en ese orden", "pagina": 3, "offset": 12894, "id": "MM-4187-2026#14", "materias": {"Protección de datos personales": {"peso": 2, "por": ["frase: vida privada"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 15, "etiqueta": "2", "texto": "El uso del dispositivo personal no puede imponerse unilateralmente. El artículo 5° del Código del Trabajo somete las facultades del empleador al respeto de las garantías constitucionales del trabajador. A su turno, el artículo 152 quáter L, si bien referido al trabajo a distancia, expresa un principio de alcance general en cuanto dispone que los equipos, herramientas y materiales para el trabajo deben ser proporcionados por el empleador, que el trabajador \"no podrá ser obligado a utilizar elementos de su propiedad\", y que los costos de operación, funcionamiento, mantenimiento y reparación son siempre de cargo del empleador", "pagina": 3, "offset": 13655, "id": "MM-4187-2026#15", "materias": {"Gestión de personas": {"peso": 2, "por": ["frase: trabajo a distancia"]}}, "normas": ["Código del Trabajo"], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 16, "etiqueta": "3", "texto": "Conviene distinguir con precisión dos cuestiones que suelen confundirse. La base de licitud del tratamiento de los datos contenidos en la ficha es la ya señalada: artículo 13 letras b) y c); y no requiere consentimiento del trabajador. Cosa distinta es el empleo de su teléfono como soporte material de la herramienta, que sí requiere su acuerdo, no por razones de protección de datos, sino porque recae sobre un bien de su propiedad. La primera cuestión es de derecho de datos; la segunda, de derecho del trabajo", "pagina": 3, "offset": 14403, "id": "MM-4187-2026#16", "materias": {"Protección de datos personales": {"peso": 4, "por": ["frase: protección de datos", "frase: base de licitud"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 17, "etiqueta": "4", "texto": "En consecuencia, esta Fiscalía recomienda el siguiente criterio sobre equipamiento: (i) los perfiles con acceso ampliado -Comandante de Incidente, Centrales de Coordinación y jefaturas-, por ser quienes acceden a datos de terceros, deben operar sobre dispositivos institucionales provistos y administrados por la Corporación; (ii) respecto del personal en general, la instalación en el equipo propio debe ser voluntaria, formalizada en un acuerdo escrito de uso, con provisión de una asignación que cubra el costo de operación; y (iii) debe existir siempre una vía alternativa de acceso -a través de la jefatura directa o de la Central de Coordinación- para quien no disponga de un equipo compatible o no desee instalar la aplicación. La tenencia de un teléfono inteligente no puede convertirse en condición de asignación operativa ni incidir, directa o indirectamente, en la evaluación del trabajador", "pagina": 4, "offset": 15261, "id": "MM-4187-2026#17", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 18, "etiqueta": "5", "texto": "Permisos de la aplicación. Cada permiso que la aplicación solicite al sistema operativo constituye un tratamiento adicional, que exige base de licitud propia y debe superar el examen de proporcionalidad del artículo 3°. Se recomienda: (i) no solicitar acceso a la agenda de contactos, mensajería, galería ni archivos del dispositivo, pues ello importaría tratar datos de terceros enteramente ajenos a la relación laboral, sin base de licitud posible; (ii) habilitar cámara y micrófono sólo por activación puntual del usuario para una función determinada, sin operación en segundo plano; y (iii) limitar las notificaciones y los identificadores del dispositivo a lo indispensable para la convocatoria, excluyendo componentes de analítica publicitaria o de terceros que extraigan telemetría", "pagina": 4, "offset": 16328, "id": "MM-4187-2026#18", "materias": {"Protección de datos personales": {"peso": 2, "por": ["frase: base de licitud"]}, "Gestión de personas": {"peso": 2, "por": ["frase: relación laboral"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 19, "etiqueta": "6", "texto": "Geolocalización. Es el punto de mayor riesgo jurídico de esta modalidad. Un seguimiento continuo de la ubicación constituiría una medida de control del trabajador y quedaría sujeto a los artículos 154 y 154 bis del Código del Trabajo y a la doctrina reiterada de la Dirección del Trabajo, conforme a la cual las medidas de control deben responder a requerimientos técnicos del proceso o a razones de seguridad, ser idóneas, necesarias y proporcionadas, aplicarse de manera general e impersonal, respetar la dignidad del trabajador e incorporarse previamente al Reglamento Interno, no pudiendo tener por finalidad principal la vigilancia de la actividad laboral. La seguridad del personal desplegado en la línea de fuego justifica sobradamente esta funcionalidad, pero sólo en los siguientes términos: que la ubicación se comparta únicamente durante la operación asignada, mediante acción afirmativa del trabajador; que exista un indicador visible mientras el envío esté activo; que no haya captura en segundo plano ni fuera de la jornada; y que la conservación se acote a la duración del incidente y a su análisis posterior", "pagina": 4, "offset": 17266, "id": "MM-4187-2026#19", "materias": {}, "normas": ["Código del Trabajo"], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 20, "etiqueta": "7", "texto": "Extravío del terminal como vulneración de seguridad. El acuerdo de uso y el Reglamento Interno deberán imponer al trabajador el deber de comunicar de inmediato la pérdida o sustracción del equipo, y a la Corporación el de evaluar si el hecho configura una vulneración notificable en los términos del artículo 14 sexies, activando el borrado selectivo y la revocación de credenciales", "pagina": 4, "offset": 18603, "id": "MM-4187-2026#20", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 21, "etiqueta": "50", "texto": "Exposición sancionatoria y diálogo interno. La ley califica como gravísimo el tratamiento de datos sensibles sin base de licitud, con multas de hasta 20.000 unidades tributarias mensuales, y como grave el incumplimiento de los deberes de información, seguridad y reporte de brechas, con multas de hasta 10.000 unidades tributarias mensuales, sin perjuicio de la responsabilidad laboral o civil. A ello se agrega, en esta modalidad, la eventual acción de tutela de derechos fundamentales de los artículos 485 y siguientes del Código del Trabajo si las medidas de control asociadas a la aplicación se estimaren lesivas de la vida privada del trabajador. Ello refuerza la conveniencia de adoptar estas definiciones en la etapa de diseño. Finalmente, sin constituir requisito legal, se estima recomendable informar y escuchar a las organizaciones sindicales antes de la implementación, lo que mitiga la litigiosidad propia de los sistemas de registro de desempeño y de control mediante dispositivos, y facilita la modificación del Reglamento Interno", "pagina": 6, "offset": 27717, "id": "MM-4187-2026#21", "materias": {"Protección de datos personales": {"peso": 6, "por": ["frase: datos sensibles", "frase: vida privada", "frase: base de licitud"]}, "Gestión de personas": {"peso": 4, "por": ["frase: organizaciones sindicales", "término: sindical", "término: sindicales"]}}, "normas": ["Código del Trabajo"], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 22, "etiqueta": "PRIMERO", "texto": "Que es jurídicamente viable implementar un sistema institucional de fichas digitales del personal operativo conforme a la Ley N° 21.719, en la medida en que se cumplan las condiciones señaladas en los numerales siguientes", "pagina": 6, "offset": 29093, "id": "MM-4187-2026#22", "materias": {}, "normas": ["Ley 21.719"], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 23, "etiqueta": "SEGUNDO", "texto": "Que el tratamiento debe fundarse en el artículo 13 letras b) y c) de la ley, esto es, cumplimiento de una obligación legal y ejecución del contrato de trabajo, en relación con el artículo 184 del Código del Trabajo y la Ley N° 16.744, y sólo subsidiariamente en el artículo 20, atendida la naturaleza jurídica de la Corporación, sobre todo cuando se produzca el traspaso a SERNAFOR", "pagina": 6, "offset": 29374, "id": "MM-4187-2026#23", "materias": {}, "normas": ["Código del Trabajo", "Ley 16.744 art. 20"], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 24, "etiqueta": "TERCERO", "texto": "Que el consentimiento del trabajador no constituye base de licitud idónea para el núcleo del sistema, por comprometer la libertad de la manifestación de voluntad y ser esencialmente revocable, quedando reservado a los campos voluntarios indicados en el apartado II.B.2", "pagina": 6, "offset": 29847, "id": "MM-4187-2026#24", "materias": {"Protección de datos personales": {"peso": 2, "por": ["frase: base de licitud"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 25, "etiqueta": "CUARTO", "texto": "Que pueden incorporarse los datos de identificación, cargo, función y dependencia, contacto institucional, formación, certificaciones y acreditaciones SCI y experiencia operativa; con restricciones, los datos de contacto personal; y con las prevenciones señaladas, el contacto de emergencia y las evaluaciones de desempeño operativo", "pagina": 6, "offset": 30191, "id": "MM-4187-2026#25", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 26, "etiqueta": "QUINTO", "texto": "Que no deben incorporarse a la ficha los datos relativos a la salud, los datos biométricos, los antecedentes disciplinarios ni los restantes datos sensibles del artículo 2° letra g). Respecto de la aptitud para funciones operativas deberá registrarse únicamente un atributo binario \"apto / no apto\" con su vigencia, sin diagnóstico ni antecedente clínico alguno", "pagina": 6, "offset": 30598, "id": "MM-4187-2026#26", "materias": {"Protección de datos personales": {"peso": 5, "por": ["frase: datos sensibles", "frase: datos biométricos", "término: biométricos"]}}, "normas": [], "refs": [], "principal": true}, {"doc": "MM-4187-2026", "orden": 27, "etiqueta": "SEXTO", "texto": "Que el sistema deberá contemplar control de acceso por perfiles, autenticación robusta, cifrado, trazabilidad íntegra de accesos y modificaciones, deber de secreto formalizado, procedimiento de gestión de brechas y contratos de encargo conforme al artículo 15 bis", "pagina": 6, "offset": 31034, "id": "MM-4187-2026#27", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 28, "etiqueta": "SÉPTIMO", "texto": "Que todo campo deberá tener plazo de conservación determinado, quedando prohibida la conservación indefinida, y deberán establecerse procedimientos formales de actualización periódica y de eliminación documentada, comprensivos de los datos residentes en los dispositivos", "pagina": 6, "offset": 31355, "id": "MM-4187-2026#28", "materias": {"Protección de datos personales": {"peso": 2, "por": ["frase: plazo de conservación"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 29, "etiqueta": "OCTAVO", "texto": "Que, con carácter previo a la puesta en marcha, deberá practicarse la evaluación de impacto en protección de datos del artículo 15 ter que abordará específicamente los permisos de la aplicación, la geolocalización, el almacenamiento local y los flujos hacia terceros; e informarse a los funcionarios en los términos del artículo 14 ter", "pagina": 7, "offset": 31937, "id": "MM-4187-2026#29", "materias": {"Protección de datos personales": {"peso": 5, "por": ["frase: protección de datos", "frase: evaluación de impacto en protección", "término: geolocalización"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 30, "etiqueta": "NOVENO", "texto": "Que la asignación de personal deberá permanecer siempre radicada en una decisión humana, configurándose el sistema como herramienta de apoyo y no como mecanismo de decisión automatizada, para los efectos del artículo 8° bis", "pagina": 7, "offset": 32347, "id": "MM-4187-2026#30", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 31, "etiqueta": "DÉCIMO", "texto": "Que la instalación de la aplicación en dispositivos de propiedad del trabajador no puede imponerse unilateralmente, conforme al artículo 5° del Código del Trabajo y al principio que informa su artículo 152 quáter L. Los perfiles con acceso ampliado deberán operar sobre equipos institucionales; respecto del personal en general, la instalación será voluntaria, formalizada en un acuerdo escrito de uso y con compensación del costo de operación, debiendo mantenerse una vía alternativa de acceso", "pagina": 7, "offset": 32629, "id": "MM-4187-2026#31", "materias": {}, "normas": ["Código del Trabajo art. 152 quáter"], "refs": [], "principal": false}, {"doc": "MM-4187-2026", "orden": 32, "etiqueta": "UNDÉCIMO", "texto": "Que la aplicación deberá limitarse a los permisos indispensables, sin acceso a la agenda de contactos, mensajería, galería ni archivos del dispositivo, y que la geolocalización sólo podrá activarse durante la operación asignada, por acción afirmativa del trabajador y con indicador visible, sin captura en segundo plano ni fuera de la jornada, quedando sujeta a los artículos 154 y 154 bis del Código del Trabajo y a su previa incorporación al Reglamento Interno de Orden, Higiene y Seguridad", "pagina": 7, "offset": 33230, "id": "MM-4187-2026#32", "materias": {}, "normas": ["Código del Trabajo"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 1, "etiqueta": "¶", "texto": "MEMORANDUM N° 5532/2020 A : GERENTA-GERENCIA DE FISCALIZACIÓN Y EVALUACIÓN AMBIENTAL DE : FERNANDO LLONA MÁRQUEZ - FISCAL FISCALIA MATERIA: SE PRONUNCIA POR CORTA DE INDIVIDUOS DE LA ESPECIE BELLOTO DEL NORTE. FECHA : 02/12/2020", "pagina": 1, "offset": 223, "id": "MM-5532-2020#1", "materias": {"Monumentos naturales": {"peso": 3, "por": ["frase: belloto del norte", "término: belloto"]}}, "normas": [], "refs": ["MM-5532-2020"], "principal": false}, {"doc": "MM-5532-2020", "orden": 2, "etiqueta": "¶", "texto": "En respuesta a su Memorándum N° 5440, de 26 de noviembre de 2020, a través del cual se requiere dilucidar lo indicado por el Jefe del Departamento de Fiscalización y Evaluación Ambiental de Valparaíso, respecto de la aplicación del artículo 8° del Decreto Ley N° 701, de 1974, sobre Fomento Forestal, en el caso de la corta de cuatro individuos de Belloto del Norte en estado juvenil emplazados de manera aislada, considerando que la especie se encuentra declarada Monumento Natural, en virtud del Decreto Supremo N° 13, de 14 de marzo de 1995, del Ministerio de Agricultura, esta Fiscalía señala lo siguiente", "pagina": 1, "offset": 576, "id": "MM-5532-2020#2", "materias": {"Monumentos naturales": {"peso": 5, "por": ["frase: monumento natural", "frase: belloto del norte", "término: belloto"]}}, "normas": ["Ley 701"], "refs": ["MM-5440-2020"], "principal": false}, {"doc": "MM-5532-2020", "orden": 3, "etiqueta": "¶", "texto": "En primer término, esta asesoría jurídica hace presente que la Dirección Regional de Valparaíso consulta directamente al nivel central, sobre temas jurídico-administrativos, sin la validación de la Unidad Jurídica Regional, cuestión ampliamente conversada con el Departamento de Normas y Procedimientos, para casos de la misma especie levantados por otras Direcciones Regionales de CONAF. Ello, toda vez que el Memorándum N° 1090, de 24 de noviembre de 2020, de la referida jefatura no cuenta con la visación de la asesoría jurídica regional", "pagina": 1, "offset": 1279, "id": "MM-5532-2020#3", "materias": {}, "normas": [], "refs": ["MM-1090-2020"], "principal": false}, {"doc": "MM-5532-2020", "orden": 4, "etiqueta": "¶", "texto": "En segundo término, esta Fiscalía reitera lo dispuesto en Memorándum N° 1548, de 18 de abril de 2011, respecto a las especies declaradas Monumentos Naturales, en lo siguiente", "pagina": 1, "offset": 1901, "id": "MM-5532-2020#4", "materias": {"Monumentos naturales": {"peso": 4, "por": ["frase: Monumentos naturales", "frase: monumentos naturales"]}}, "normas": [], "refs": ["MM-1548-2011"], "principal": false}, {"doc": "MM-5532-2020", "orden": 5, "etiqueta": "¶", "texto": "La Convención para la Protección de la Flora, la Fauna y las Bellezas Escénicas Naturales de América, conocida como \"Convención de Washington\", de 1940, es ley de la República desde 1967, a través del Decreto Supremo N° 531, de 23 de agosto de ese año, del Ministerio de Relaciones Exteriores, siendo su fundamento general el deseo de proteger y conservar las especies de flora y fauna en sus ambientes naturales con el objeto de evitar su extinción, como asimismo proteger y conservar los paisajes y lugares naturales", "pagina": 1, "offset": 2274, "id": "MM-5532-2020#5", "materias": {}, "normas": ["Convención de Washington"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 6, "etiqueta": "¶", "texto": "De esta manera, para dar cumplimiento a sus objetivos esa Convención creó varias categorías de protección. A saber, Parques Nacionales; Reservas Nacionales, Monumentos Naturales y Reservas de Regiones Vírgenes", "pagina": 1, "offset": 2873, "id": "MM-5532-2020#6", "materias": {"Monumentos naturales": {"peso": 4, "por": ["frase: Monumentos naturales", "frase: monumentos naturales"]}, "Áreas silvestres protegidas": {"peso": 2, "por": ["frase: parques nacionales"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 7, "etiqueta": "¶", "texto": "A su turno, define a los Monumentos Naturales como \"Las regiones, los objetos o las especies vivas de animales o plantas de interés estético o valor histórico o científico, a los cuales se les da protección absoluta. Los Monumentos Naturales se crean con el fin de conservar un objeto específico o una especie determinada de flora o fauna declarando una región, un objeto o una www.ceropapel.conaf.cl/documentos/documento.php?idDocumento=152917994 1/5 3/12/2020 www.ceropapel.conaf.cl/documentos/documento.php?idDocumento=152917994", "pagina": 1, "offset": 3124, "id": "MM-5532-2020#7", "materias": {"Monumentos naturales": {"peso": 6, "por": ["frase: Monumentos naturales", "frase: monumentos naturales", "frase: protección absoluta"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 8, "etiqueta": "¶", "texto": "especie aislada, monumento natural inviolable, excepto para realizar investigaciones científicas debidamente autorizadas, o inspecciones gubernamentales.\"", "pagina": 2, "offset": 3786, "id": "MM-5532-2020#8", "materias": {"Monumentos naturales": {"peso": 2, "por": ["frase: monumento natural"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 9, "etiqueta": "¶", "texto": "Aplicando tal definición a las especies arbóreas, ésta quedaría así \"Las especies vivas de plantas de interés estético o valor histórico o científico, a las cuales se les da protección absoluta. Los Monumentos Naturales se crean con el fin de conservar una especie determinada de flora declarando una especie aislada, monumento natural inviolable, excepto para realizar investigaciones científicas debidamente autorizadas, o inspecciones gubernamentales.\"", "pagina": 2, "offset": 3966, "id": "MM-5532-2020#9", "materias": {"Monumentos naturales": {"peso": 8, "por": ["frase: Monumentos naturales", "frase: monumento natural", "frase: monumentos naturales", "frase: protección absoluta"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 10, "etiqueta": "¶", "texto": "En consecuencia, al declarar la protección absoluta y la inviolabilidad para una especie declarada Monumento Natural, la Convención estableció la conservación en un sentido estricto, por cuanto el concepto de absoluto se refiere a que es ilimitado, sin restricción alguna. A su vez, la inviolabilidad dice relación con que debe conservarse inviolado, vale decir, en toda su integridad. La integridad es la calidad de íntegro, o sea, aquello a que no falta ninguna de sus partes", "pagina": 2, "offset": 4483, "id": "MM-5532-2020#10", "materias": {"Monumentos naturales": {"peso": 5, "por": ["frase: monumento natural", "frase: protección absoluta", "término: inviolabilidad"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 11, "etiqueta": "¶", "texto": "Esta protección total e inviolabilidad, debe entenderse que afecta a cada uno de los individuos vivos de la especie, cualquiera sea su estado o edad, que se encuentren dentro de su medio ambiente natural, por cuanto el preámbulo de la Convención al señalar que \"Los Gobiernos Americanos deseosos de proteger y conservar en su medio ambiente natural, ejemplares de todas las especies y géneros de su flora y su fauna indígenas\", fijó su ámbito de aplicación, esto es el medio ambiente natural, que en terminología moderna, corresponde o se identifica al concepto de ecosistema, o sea, una zona determinada donde las condiciones ambientales permiten el desarrollo de unos organismos concretos, comprendiendo el medio físico en el que está establecido (biotopo) y el conjunto de seres vivos que habitan en el biotopo (biocenosis)", "pagina": 2, "offset": 5035, "id": "MM-5532-2020#11", "materias": {"Monumentos naturales": {"peso": 3, "por": ["frase: medio ambiente natural", "término: inviolabilidad"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 12, "etiqueta": "¶", "texto": "A su turno, la definición de medio ambiente que da la Ley N° 19.300, sobre Bases Generales del Medio Ambiente, en su segundo artículo, letra ll) que al aplicarse a especies forestales debe entenderse como \"el sistema global constituido por elementos de naturaleza biológica, y sus interacciones, en permanente modificación por la acción humana o natural y que rige y condiciona la existencia y desarrollo de la vida en sus múltiples manifestaciones\". Si a tal definición le adicionamos la expresión \"natural\" nos remite a un conjunto de elementos del medio natural como la vegetación, la fauna, la tierra, el clima, el agua, y su interrelación. Lo que necesariamente revela su estrecha relación o identificación con los conceptos de ecosistema y hábitat", "pagina": 2, "offset": 5984, "id": "MM-5532-2020#12", "materias": {}, "normas": ["Ley 19.300"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 13, "etiqueta": "¶", "texto": "Esta Convención celebrada en Río de Janeiro, Brasil, en el año 1992, e incorporada al ordenamiento jurídico chileno por Decreto Supremo N° 1.963, de 28 de diciembre 1994, del Ministerio de Relaciones Exteriores, reviste importancia para la institución de los monumentos naturales por cuanto promueve la protección de ecosistemas y hábitats naturales y el mantenimiento de poblaciones viables de especies en entornos naturales.(artículo 8°, letra d) y la recuperación de especies amenazadas. (artículo 8°, letra f)", "pagina": 2, "offset": 6903, "id": "MM-5532-2020#13", "materias": {"Monumentos naturales": {"peso": 4, "por": ["frase: Monumentos naturales", "frase: monumentos naturales"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 14, "etiqueta": "¶", "texto": "Sus objetivos son \"la conservación de la biodiversidad, el uso sostenible de sus componentes y la participación justa y equitativa de los beneficios resultantes de la utilización de los recursos genéticos\". De esta manera, para la protección de la diversidad biológica ese Convenio promueve la protección de ecosistemas y hábitats donde se desarrolla plenamente la flora y la fauna. Tales lugares destinados a la preservación son -especialmente- los Parques Nacionales y los Monumentos Naturales", "pagina": 2, "offset": 7491, "id": "MM-5532-2020#14", "materias": {"Monumentos naturales": {"peso": 4, "por": ["frase: Monumentos naturales", "frase: monumentos naturales"]}, "Áreas silvestres protegidas": {"peso": 4, "por": ["frase: parques nacionales", "frase: diversidad biológica"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 15, "etiqueta": "¶", "texto": "La Carta Fundamental del año 1980, contempló, por primera vez, a la naturaleza y al medio ambiente en cuanto bienes jurídicos protegidos. Así, su artículo 19° en su numeral 8° aseguró a todas las personas \"El derecho a vivir en un medio ambiente libre de contaminación\". Acto seguido estableció que \"Es deber del Estado velar para que este derecho no sea afectado y tutelar la preservación de la naturaleza\". www.ceropapel.conaf.cl/documentos/documento.php?idDocumento=152917994 2/5 3/12/2020 www.ceropapel.conaf.cl/documentos/documento.php?idDocumento=152917994", "pagina": 2, "offset": 8219, "id": "MM-5532-2020#15", "materias": {}, "normas": ["Constitución"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 16, "etiqueta": "¶", "texto": "La jurisprudencia de la Excma. Corte Suprema ha señalado que esta garantía constitucional \"...impone al Estado la obligación de velar para que este derecho no se vea afectado; y, al mismo tiempo, tutelar la preservación de la naturaleza y esto último se refiere al mantenimiento de las condiciones originales de los recursos naturales...\". De esta interpretación, se colige que es obligación del Estado preservar la naturaleza en su medio ambiente originario o natural, lo que es concordante con lo dispuesto en la Convención de Washington", "pagina": 3, "offset": 8920, "id": "MM-5532-2020#16", "materias": {}, "normas": ["Convención de Washington"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 17, "etiqueta": "¶", "texto": "La ley N° 19.300, sólo se limitó a señalar en su artículo 34 que \"El Estado administrará un sistema nacional de áreas silvestres protegidas, que incluirá los parques y reservas marinas, con objeto de asegurar la diversidad biológica, tutelar la preservación de la naturaleza y conservar el patrimonio ambiental.\"", "pagina": 3, "offset": 9566, "id": "MM-5532-2020#17", "materias": {"Áreas silvestres protegidas": {"peso": 4, "por": ["frase: Áreas silvestres protegidas", "frase: diversidad biológica"]}}, "normas": ["Ley 19.300 art. 34"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 18, "etiqueta": "¶", "texto": "Por su parte, el art. 10 letra p) de la Ley N° 19.300, sólo indicó, entre las actividades que deben someterse al Sistema de Evaluación de Impacto Ambiental, se encuentran las consistentes en la \"Ejecución de obras, programas o actividades en parques nacionales, reservas nacionales, monumentos naturales, reservas de zonas vírgenes, santuarios de la naturaleza, parques marinos, reservas marinas o en cualesquiera otras áreas colocadas bajo protección oficial, en los casos en que la legislación respectiva lo permita\"", "pagina": 3, "offset": 9930, "id": "MM-5532-2020#18", "materias": {"Monumentos naturales": {"peso": 4, "por": ["frase: Monumentos naturales", "frase: monumentos naturales"]}, "Áreas silvestres protegidas": {"peso": 2, "por": ["frase: parques nacionales"]}, "SEIA / RCA / PAS": {"peso": 2, "por": ["frase: evaluación de impacto ambiental"]}}, "normas": ["Ley 19.300"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 19, "etiqueta": "¶", "texto": "Asimismo, es necesario considerar además en este análisis, que el artículo 37 de la Ley N° 19.300, señaló que un reglamento fijará el procedimiento para clasificar las especies de flora y fauna silvestres, sobre la base de antecedentes científico-técnicos, y según su estado de conservación, en las siguientes categorías: extinguidas, en peligro de extinción, vulnerables, raras, insuficientemente conocidas y fuera de peligro", "pagina": 3, "offset": 10523, "id": "MM-5532-2020#19", "materias": {}, "normas": ["Ley 19.300"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 20, "etiqueta": "¶", "texto": "Es del caso señalar que por Decreto Supremo N° 50, de 24 de abril de 2008, del Ministerio Secretaría General de la Presidencia, que aprobó y oficializó el segundo período de clasificación de especies, se determinó al Belloto del Norte como vulnerable", "pagina": 3, "offset": 11012, "id": "MM-5532-2020#20", "materias": {"Monumentos naturales": {"peso": 3, "por": ["frase: belloto del norte", "término: belloto"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 21, "etiqueta": "¶", "texto": "De lo anterior, se infiere que especies forestales como el Belloto del Norte están afectas, tanto a las regulaciones de la Convención para la Protección de la Flora, la Fauna y las Bellezas Escénicas Naturales de América, señaladas en los respectivos Decretos Supremos que le dan la calidad de Monumento Natural, como en la normativa de la Ley N° 19.300 y sus Reglamentos, como también en el artículo 19° de la Ley N° 20.283, sobre Recuperación del Bosque Nativo y Fomento Forestal, en este último caso, por estar calificado en categoría de conservación", "pagina": 3, "offset": 11301, "id": "MM-5532-2020#21", "materias": {"Monumentos naturales": {"peso": 5, "por": ["frase: monumento natural", "frase: belloto del norte", "término: belloto"]}}, "normas": ["Ley 19.300 art. 19", "Ley 20.283"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 22, "etiqueta": "¶", "texto": "Entonces, gozan, en consecuencia, los Monumentos Naturales de un doble estatus jurídico de protección, por una parte, la Convención de Washington; y por la otra, la Ley N° 20.283, teniendo presente, en todo caso, que son cuerpos legales que se refieren a distintas materias. Exceptuándose, por cierto, de la prohibición del citado artículo 19° las especies plantadas", "pagina": 3, "offset": 11941, "id": "MM-5532-2020#22", "materias": {"Monumentos naturales": {"peso": 5, "por": ["frase: Monumentos naturales", "frase: monumentos naturales", "término: plantada"]}}, "normas": ["Convención de Washington", "Ley 20.283"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 23, "etiqueta": "¶", "texto": "Por Decreto Supremo N° 13, de 14 de marzo de 1995, del Ministerio de Agricultura, se declaró Monumento Natural a diversas especies forestales (Belloto del Sur, Belloto del Norte, Ruil, Queule, Pitao). Esta normativa afecta a cada uno de los pies o individuos vivos de la citada especie, cualquiera sea su estado o edad, que habiten dentro del territorio nacional, permitiéndose su corta o explotación, sólo cuando estas acciones tengan por objeto llevar a cabo las actividades autorizadas, vale decir, investigación científica, habilitación de terrenos para la construcción de obras públicas o de defensa nacional y el desarrollo de planes de manejo forestal por parte de organismos oficiales del Estado, con el sólo propósito de conservar y mejorar la especie protegida", "pagina": 3, "offset": 12398, "id": "MM-5532-2020#23", "materias": {"Monumentos naturales": {"peso": 12, "por": ["frase: monumento natural", "frase: belloto del norte", "frase: belloto del sur", "frase: especie protegida", "término: belloto", "término: queule", "término: pitao", "término: ruil"]}, "Planes de manejo": {"peso": 4, "por": ["frase: Planes de manejo", "frase: planes de manejo"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 24, "etiqueta": "¶", "texto": "Por su parte, CONAF queda facultada para que, en forma excepcional, autorice la intervención, vale decir, la corta, destrucción, descepado o eliminación de especies declaradas Monumentos Naturales, cuando dichos monumentos naturales formen parte de un bosque nativo y las referidas intervenciones se realicen en las circunstancias previstas en el artículo 7°, en relación al artículo 19° de la Ley N° 20.283", "pagina": 3, "offset": 13279, "id": "MM-5532-2020#24", "materias": {"Monumentos naturales": {"peso": 5, "por": ["frase: Monumentos naturales", "frase: monumentos naturales", "término: descepado"]}}, "normas": ["Ley 20.283"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 25, "etiqueta": "¶", "texto": "En otros términos, si las especies declaradas monumentos naturales se encuentran ubicadas en aquellos lugares donde se van a construir caminos, o donde se ejercerán concesiones o servidumbres mineras, servicios eléctricos, ductos u otras reguladas por ley (oleoductos, gasoductos, acueductos, tendidos eléctricos, etc.) y tales obras o actividades son de interés nacional, no amenazan la continuidad de la especie y son imprescindibles, los Monumentos Naturales pueden ser cortados, descepados, destruidos o eliminados, generando una contradicción al estatus jurídico de protección total que les otorga su calidad de Monumentos Naturales, dado que la declaración de Monumento Natural, según lo estipulan sus decretos supremos de creación \"afectará a cada uno de los pies o individuos vivos de la citada especie, cualquiera sea su estado o edad, que habiten dentro del territorio nacional\"", "pagina": 4, "offset": 13980, "id": "MM-5532-2020#25", "materias": {"Monumentos naturales": {"peso": 7, "por": ["frase: Monumentos naturales", "frase: monumento natural", "frase: monumentos naturales", "término: descepado"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 26, "etiqueta": "¶", "texto": "Ello, significa que una especie declarada Monumento Natural, pasa a tener un estatus jurídico especial (inviolabilidad) y su corta o destrucción queda prohibida, salvo que cuente con la autorización expresa, calificada y fundamentada de CONAF, la que procederá -solamente-cuando las acciones de corta o explotación tengan por objeto el desarrollar investigaciones científicas debidamente autorizadas; habilitar terrenos para la construcción de obras públicas o defensa nacional y desarrollar planes de manejo forestal por organismos del Estado, con el objeto exclusivo de conservar y mejorar el estado de conservación de la especie", "pagina": 4, "offset": 14991, "id": "MM-5532-2020#26", "materias": {"Monumentos naturales": {"peso": 3, "por": ["frase: monumento natural", "término: inviolabilidad"]}, "Planes de manejo": {"peso": 4, "por": ["frase: Planes de manejo", "frase: planes de manejo"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 27, "etiqueta": "¶", "texto": "No obstante, esta inviolabilidad sólo opera para especies insertas en su medio ambiente natural, por cuanto al citarse la Convención de Washington en el artículo 1° de cada uno de los decretos supremos que declaran monumentos naturales a ciertas especies forestales, hacen presente que dicha declaración es conforme a la definición y espíritu de la Convención citada, el que claramente comprende, solamente, la protección de especies en su medio ambiente natural", "pagina": 4, "offset": 15710, "id": "MM-5532-2020#27", "materias": {"Monumentos naturales": {"peso": 7, "por": ["frase: Monumentos naturales", "frase: monumentos naturales", "frase: medio ambiente natural", "término: inviolabilidad"]}}, "normas": ["Convención de Washington art. 1"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 28, "etiqueta": "¶", "texto": "En conclusión, declarada una especie como Monumento Natural, goza de protección total e inviolabilidad, protección que afecta a cada uno de los individuos vivos de la especie, cualquiera sea su estado o edad, protegiéndose no sólo a los árboles que forman parte del bosque, sino también a aquellos que se encuentran fuera de éste", "pagina": 4, "offset": 16235, "id": "MM-5532-2020#28", "materias": {"Monumentos naturales": {"peso": 3, "por": ["frase: monumento natural", "término: inviolabilidad"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 29, "etiqueta": "¶", "texto": "Asimismo, conforme a lo señalado en el preámbulo de la Convención de Washington, la protección de tales especies, esto es aquellas declaradas Monumentos Naturales, debe entenderse para aquellas ubicadas en su medio natural y generadas sin intervención humana. El concepto de territorio nacional como porción de superficie perteneciente a un país y sobre el cual el Estado ejerce soberanía. A contrario sensu, no cabe duda alguna de que el derecho de propiedad de un particular, consagrado en el artículo 19° N° 24 de la Carta Magna, se vería afectado, en su esencia, si en mérito de un simple decreto supremo, se le impide cortar un Belloto u otra especie declarada monumento natural que plantó, por ejemplo, en el patio de su casa", "pagina": 4, "offset": 16615, "id": "MM-5532-2020#29", "materias": {"Monumentos naturales": {"peso": 9, "por": ["frase: Monumentos naturales", "frase: monumento natural", "frase: monumentos naturales", "frase: intervención humana", "término: belloto"]}}, "normas": ["Convención de Washington"], "refs": [], "principal": true}, {"doc": "MM-5532-2020", "orden": 30, "etiqueta": "¶", "texto": "En tercer término, en vista de lo expuesto, esta Fiscalía no comparte el análisis de esa Gerencia, respecto del reenvío del numeral cuatro del Decreto Supremo N° 13, de 14 de marzo de 1995, del Ministerio de Agricultura, que declaró monumento natural las especies forestales Queule, Pitao, Belloto del Sur, Belloto del Norte y Ruil, al artículo 21° del Decreto Ley N° 701, de 1974, sobre Fomento Forestal, dado que, el citado numeral del Decreto Supremo N° 13/1995, señala -expresamente- que \"Las infracciones al presente decreto se sancionarán con las penas y conforme al procedimiento establecido en el decreto ley N° 701, de 1974 y sus reglamentos complementarios, y por las demás disposiciones legales vigentes en estas materias\"", "pagina": 4, "offset": 17457, "id": "MM-5532-2020#30", "materias": {"Monumentos naturales": {"peso": 10, "por": ["frase: monumento natural", "frase: belloto del norte", "frase: belloto del sur", "término: belloto", "término: queule", "término: pitao", "término: ruil"]}}, "normas": ["Ley 701"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 31, "etiqueta": "¶", "texto": "En este sentido, la tercera acepción que la Real Academia de la Lengua Española otorga a la acepción \"Procedimiento\" dice relación con \"Actuación por trámites judiciales o administrativos\"", "pagina": 4, "offset": 18289, "id": "MM-5532-2020#31", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 32, "etiqueta": "¶", "texto": "A mayor abundamiento, el artículo 19, inciso segundo del Código Civil estableció que \"Pero bien se puede, para interpretar una expresión obscura de la ley, recurrir a su intención o espíritu, claramente manifestados en ella misma, o en la historia fidedigna de su establecimiento\". Precisamente, la intención o espíritu del Decreto Supremo N° 13/1995, es que la declaración como Monumento Natural de la especie Belloto del Norte, lo hace gozar de protección total e inviolabilidad, no sólo para aquellos individuos que forman parte de un bosque, sino también para aquellos que se encuentran fuera de éste", "pagina": 4, "offset": 18504, "id": "MM-5532-2020#32", "materias": {"Monumentos naturales": {"peso": 6, "por": ["frase: monumento natural", "frase: belloto del norte", "término: belloto", "término: inviolabilidad"]}}, "normas": ["Código Civil"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 33, "etiqueta": "¶", "texto": "Además, la primera parte del artículo 20° del Código Civil, sobre reglas de interpretación de la ley, señaló que \"Las palabras de la ley se entenderán en su sentido natural y obvio, según el uso general de las mismas palabras…\". Por consiguiente, el \"procedimiento\" a que se refiere el numeral cuarto del Decreto Supremo N° 13/1995, es aquel establecido en el artículo 24 del Decreto Ley N° 701, de 1974, sobre Fomento Forestal", "pagina": 5, "offset": 19429, "id": "MM-5532-2020#33", "materias": {}, "normas": ["Código Civil", "Ley 701"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 34, "etiqueta": "¶", "texto": "En síntesis, ante la corta de un individuo vivo declarado Monumento Natural, que esté en su ambiente natural, aun cuando no forme parte de un bosque, procede su denuncia ante el Juzgado de Policía Local competente, acorde a las reglas del ya citado artículo 24, en base a las normas legales expuestas, y, por el ilícito contemplado en el artículo 52 de la Ley N° 20.283, sobre Bosque Nativo y Fomento Forestal", "pagina": 5, "offset": 19924, "id": "MM-5532-2020#34", "materias": {"Monumentos naturales": {"peso": 2, "por": ["frase: monumento natural"]}, "Fiscalización forestal": {"peso": 2, "por": ["frase: juzgado de policía local"]}}, "normas": ["Ley 20.283"], "refs": [], "principal": false}, {"doc": "MM-5532-2020", "orden": 35, "etiqueta": "¶", "texto": "Finalmente, se reitera a esa Gerencia que, antes de solicitar un pronunciamiento jurídico-administrativo- a esa asesoría jurídica, derivado a una consulta regional, esta última debe contar con la visación de la Unidad Jurídica respectiva, a objeto de darle curso en el nivel central", "pagina": 5, "offset": 20401, "id": "MM-5532-2020#35", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 1, "etiqueta": "I", "texto": "ASPECTOS GENERALES. Conforme a lo requerido, para contestar esta solicitud de pronunciamiento jurídico, se ha tenido especialmente presente lo siguiente", "pagina": 1, "offset": 1438, "id": "MM-5939-2025#1", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 2, "etiqueta": "1", "texto": "Esta Fiscalía se abocó a estudiar la temática, para lo cual elaboró una consulta a las unidades jurídicas regionales a objeto de saber el criterio de cada abogado/a en caso de someter a análisis una solicitud que presenta diferencias entre la superficie del estudio y la superficie predial indicada en los títulos de dominio, y si, en caso de aprobarse, utilizaban algún criterio para la aprobación", "pagina": 1, "offset": 1636, "id": "MM-5939-2025#2", "materias": {"Cabida predial": {"peso": 4, "por": ["frase: superficie predial", "frase: títulos de dominio"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 3, "etiqueta": "2", "texto": "Luego de recibir la información se observaron diversos criterios y modos de hacer en relación a la materia, lo anterior debido a las múltiples situaciones a las que -día a día - se enfrentan los abogados/as de CONAF con ocasión de la revisión presentada en las solicitudes. 2.1. De este modo, en primer término se ha establecido que el análisis parte en determinar si la superficie del predio está consignada de modo suficiente en los títulos de dominio, por cuanto la Corporación Nacional Forestal debe analizar si el titular ostenta la calidad de dueño del predio objeto de la solicitud u ostenta alguno de los derechos o calidades que habilitan para la presentación de solicitudes en el marco de la legislación forestal vigente. En efecto, con ocasión de la aprobación de Planes de Manejo, se examinan los títulos de dominio para determinar la \"Superficie predial según títulos\", así como la solicitud efectuada que consigna la \"Superficie afecta a la solicitud (ha)\". 2.2.", "pagina": 1, "offset": 2105, "id": "MM-5939-2025#3", "materias": {"Planes de manejo": {"peso": 4, "por": ["frase: Planes de manejo", "frase: planes de manejo"]}, "Cabida predial": {"peso": 4, "por": ["frase: superficie predial", "frase: títulos de dominio"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 4, "etiqueta": "3", "texto": "El título de dominio expresa cabida, pero el título indica que esta es \"más o menos\" o \"aproximadamente\". Por otra parte, se tiene en consideración si", "pagina": 2, "offset": 3920, "id": "MM-5939-2025#4", "materias": {"Cabida predial": {"peso": 3, "por": ["frase: título de dominio", "término: cabida"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 5, "etiqueta": "a", "texto": "Del examen de los títulos, se detecta que existe una diferencia entre lo consignado en el título y la superficie predial, respecto de lo consignado en la solicitud y estudio técnico presentada por el usuario, sea mayor o menor", "pagina": 2, "offset": 4132, "id": "MM-5939-2025#5", "materias": {"Planes de manejo": {"peso": 2, "por": ["frase: estudio técnico"]}, "Cabida predial": {"peso": 2, "por": ["frase: superficie predial"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 6, "etiqueta": "b", "texto": "Además, se analiza si la propiedad tiene antecedentes previos (carpeta predial) en CONAF . 2.3. En los casos expresados, considerando diversos factores, se han aplicado criterios dispares, pero que, por sobre todo, obedecen al estudio que efectúan los abogados de las unidades jurídicas de CONAF, tomando en consideración el apego al marco jurídico, y examinando la situación de un predio, caso a caso", "pagina": 2, "offset": 4427, "id": "MM-5939-2025#6", "materias": {"Cabida predial": {"peso": 2, "por": ["frase: carpeta predial"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 7, "etiqueta": "1", "texto": "En primer término, esta Fiscalía ha considerado necesario recordar que la transferencia de los bienes inmuebles rurales o predios rústicos, que -por cierto- son el objeto de análisis por parte de CONAF, puede efectuarse de dos maneras, \"como especie o cuerpo cierto\" o en \"relación a la cabida\" del predio. En efecto, el artículo 1831 del Código Civil señala: \"Un predio rústico puede venderse con relación a su cabida o como una especie o cuerpo cierto. Se vende con relación a su cabida, siempre que ésta se expresa de cualquier modo en el contrato, salvo que las partes declaren que no entienden hacer diferencia en el precio, aunque la cabida real resulte mayor o menor que la cabida que reza el contrato. Es indiferente que se fije directamente un precio total, o que éste se deduzca de la cabida o número de medidas que se expresa, y del precio de cada medida. Es asimismo indiferente que se exprese una cabida total o las cabidas de las varias porciones de diferentes calidades y precios que contenga el predio, con tal que de estos datos resulte el precio total y la cabida total. Lo mismo se aplica a la enajenación de dos o más predios por una sola venta. En todos los demás casos se entenderá venderse el predio o predios como un cuerpo cierto\"", "pagina": 2, "offset": 4982, "id": "MM-5939-2025#7", "materias": {"Cabida predial": {"peso": 5, "por": ["frase: cuerpo cierto", "frase: predio rústico", "término: cabida"]}}, "normas": ["Código Civil"], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 8, "etiqueta": "2", "texto": "La diferencia entre ambas formas de efectuar la compraventa ha generado que podamos encontrar predios de antigua data, que - siendo vendidos como especie o cuerpo cierto- no señalaron superficie. Asimismo, predios que vendidos en atención a su cabida ésta se ha ido modificando porque los límites ya no existen o por el transcurso del tiempo debido a que, por ejemplo, un camino dejó de existir, o ha habido alteración de los cursos de un río, una quebrada, disminución de un bosque, etc", "pagina": 2, "offset": 6561, "id": "MM-5939-2025#8", "materias": {"Cabida predial": {"peso": 3, "por": ["frase: cuerpo cierto", "término: cabida"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 9, "etiqueta": "4", "texto": "Luego, se hace presente que la diferencia entre la forma de vender un inmueble rústico conforme lo señala nuestra legislación, acorde a la norma citada, trae como consecuencia -conforme al artículo 1832 del Código Civil- la posibilidad de accionar en el evento que la cabida", "pagina": 2, "offset": 7274, "id": "MM-5939-2025#9", "materias": {}, "normas": ["Código Civil"], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 10, "etiqueta": "5", "texto": "Nuestra legislación, en consecuencia, no contempla algún tratamiento u otra consecuencia respecto de la diferencia o ausencia de cabida expresada en un contrato de compraventa de inmuebles, sino solamente regula los efectos de las distorsiones de ésta cuando se vende un [1] inmueble en atención a su cabida, requisito que conforme señala Alessandri \"La base para distinguir ambas ventas es ésta: si las partes atribuyen importancia a la cabida, si el precio del predio se fija en atención a ella y si se toma en cuenta esa cabida para celebrar el contrato, la venta es con relación a cabida; pero si las partes aprecian el valor del predio por otras consideraciones, por su calidad, por su situación, etc., y lo señalan por sus deslindes o por su nombre, aunque la cabida se exprese, la venta es de cuerpo cierto, porque no se da como determinante del contrato, sino por la vía de ejemplo y no influye en el precio que las partes no han señalado en atención a la cabida sino a otras circunstancias\"", "pagina": 3, "offset": 8241, "id": "MM-5939-2025#10", "materias": {"Cabida predial": {"peso": 4, "por": ["frase: cuerpo cierto", "término: cabida", "término: deslindes"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 11, "etiqueta": "6", "texto": "En suma, un predio rural puede ser adquirido como especie o cuerpo cierto o en atención a su cabida. Luego, un predio que exprese su cabida puede ser también vendido como especie o cuerpo cierto, siempre que la cabida conste, pero no sea el elemento que sirva para determinar el precio", "pagina": 3, "offset": 9495, "id": "MM-5939-2025#11", "materias": {"Cabida predial": {"peso": 3, "por": ["frase: cuerpo cierto", "término: cabida"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 12, "etiqueta": "7", "texto": "Por otra parte, se debe hacer presente que el artículo 78 del Reglamento del Conservador de Bienes Raíces, entre otros requisitos, establece que en las inscripciones de dominio de inmuebles se debe señalar \"el nombre y linderos del fundo\", no haciendo mención a la superficie. Luego, los Conservadores de Bienes Raíces defieren a los tribunales de justicia los problemas relacionados con diferencias de superficie y cabidas por exceder de sus facultades. Al respecto, alguna jurisprudencia ha señalado que los Conservadores de Bienes Raíces, en su calidad de funcionarios no están facultados para intervenir en dilucidar si la expresión \"más o [2] menos\" o \"aproximadamente\" pueda comprender una determinada diferencia de superficie", "pagina": 3, "offset": 9838, "id": "MM-5939-2025#12", "materias": {"Cabida predial": {"peso": 3, "por": ["frase: conservador de bienes raíces", "término: cabida"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 13, "etiqueta": "1", "texto": "Atendido la jurisprudencia judicial tanto de los Tribunales de Justicia como del Tribunal Constitucional, así como la jurisprudencia administrativa de la Contraloría General de la República, los funcionarios de CONAF, cumplen fines públicos y -al amparo de esas funciones-son considerados como funcionarios públicos", "pagina": 3, "offset": 10913, "id": "MM-5939-2025#13", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 14, "etiqueta": "2", "texto": "Asimismo, habida cuenta de la pronta transformación de la institución en un Servicio Público, por la Ley N° 21.744 que crea el Servicio Nacional Forestal, resulta un imperativo dar cumplimiento a lo establecido en el Artículo 6° de la Constitución Política de la República que obliga a los órganos del Estado a someter su acción a la Constitución y a las normas dictadas conforme a ella, y garantizar el orden institucional de la República. Esto además, en relación al artículo 2° de la Ley N°18.575, de Bases Generales de la Administración del Estado, que dispone que los órganos de la Administración del Estado deberán actuar dentro de su competencia y no tendrán más atribuciones que las que expresamente les haya conferido el ordenamiento jurídico. Todo abuso o exceso en el ejercicio de sus potestades dará lugar a las acciones y recursos correspondientes", "pagina": 3, "offset": 11287, "id": "MM-5939-2025#14", "materias": {"Límites de competencia": {"peso": 4, "por": ["frase: dentro de su competencia", "frase: no tendrán más atribuciones"]}}, "normas": ["Constitución", "Ley 18.575", "Ley 21.744"], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 15, "etiqueta": "3", "texto": "Conforme al dictamen de la Contraloría General de la República N° 33.624 del año 2020, a los procedimientos administrativos seguidos ante la CONAF en el marco de la Ley N° 20.283 sobre recuperación de bosque nativo y fomento forestal y el D.L. 701, de 1974, se aplica la ley 19.880 sobre bases de los procedimientos administrativos, que entre otros principios, contempla el de legalidad y el de imparcialidad", "pagina": 3, "offset": 12283, "id": "MM-5939-2025#15", "materias": {}, "normas": ["DL 701", "Ley 19.880", "Ley 20.283"], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 16, "etiqueta": "4", "texto": "Lo expresado, tiene especial relevancia en la materia que nos ocupa, habida consideración que, la superficie de un predio es una materia que, de no estar expresamente señalada, no admitiría posibilidad de calcular o aproximar por parte de una entidad pública, en caso de no existir la absoluta certeza de lo que establecen los títulos de dominio", "pagina": 3, "offset": 12762, "id": "MM-5939-2025#16", "materias": {"Cabida predial": {"peso": 2, "por": ["frase: títulos de dominio"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 17, "etiqueta": "5", "texto": "Con todo, en casos debidamente justificados por los antecedentes complementarios estudiados y por tratarse de títulos de dominio que contemplen una superficie que indique a continuación del guarismo la frase \"más o menos\" o \"aproximadamente\", se estima que -a lo sumo- la solicitud podría contemplar una superficie que no supere la unidad de medida siguiente, esto es, por ejemplo si el título señala 300 ha. \"más o menos\", la resolución que apruebe no podría reconocer una superficie mayor a 300,99 ha. por cuanto de tener una superficie mayor el título habría señalado 301 ha. \"o más\". En efecto, este sería el único rango de aproximación posible que no afecte la seguridad jurídica", "pagina": 4, "offset": 13414, "id": "MM-5939-2025#17", "materias": {"Cabida predial": {"peso": 2, "por": ["frase: títulos de dominio"]}, "Procedimiento administrativo": {"peso": 2, "por": ["frase: antecedentes complementarios"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 18, "etiqueta": "6", "texto": "A mayor abundamiento, lo que se pretende es que un funcionario de CONAF a través de los medios disponibles, especialmente aquellos aportados por el interesado, pueda dar certeza que la presentación sujeta a análisis, tiene el menor riesgo de afectar el derecho de propiedad de los dueños de inmuebles colindantes. Lo anterior, precisamente, porque la labor de CONAF no implica, en caso alguno, la capacidad de resolución de materias que no están en nuestra competencia, sino que requieren de una sentencia judicial que resuelva un conflicto entre privados", "pagina": 4, "offset": 14208, "id": "MM-5939-2025#18", "materias": {"Límites de competencia": {"peso": 2, "por": ["frase: sentencia judicial"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 19, "etiqueta": "7", "texto": "En este mismo sentido, cabe recordar lo resuelto por la Excelentísima Corte Suprema[3], que al referirse a los traslapes de predios ha señalado respecto de CONAF que: \"Por consiguiente, no se trata de exigir a dicha Corporación analizar la validez de los títulos de dominio ya que de acuerdo a la normativa atingente excedería con creces su labor, sino que en cumplimiento de las normas aplicables, controle a través de los medios que tenga a su disposición, que la cartografía que en esta materia adjunte el respectivo solicitante de plan de manejo forestal, se corresponda con la real ubicación del predio respectivo, para evitar precisamente superposiciones como la que ha ocurrido en la especie\". En efecto, la superficie como parte del título de dominio no es susceptible de análisis por parte de CONAF, por cuanto excede sus facultades", "pagina": 4, "offset": 14860, "id": "MM-5939-2025#19", "materias": {"Planes de manejo": {"peso": 2, "por": ["frase: plan de manejo"]}, "Cabida predial": {"peso": 6, "por": ["frase: título de dominio", "frase: títulos de dominio", "término: traslape", "término: traslapes"]}, "Límites de competencia": {"peso": 2, "por": ["frase: excede sus facultades"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 20, "etiqueta": "8", "texto": "Además, y entendiendo la situación expresada por muchas unidades jurídicas en orden al examen de las carpetas prediales, con situaciones inamovibles por décadas, y donde se pudiera aprobar una solicitud dentro de la superficie que conste en la carpeta informada, cabe hacer presente que conforme a lo que se ha venido expresando en este memorándum se estima que no es factible establecer un margen de tolerancia o aproximación por sobre la superficie que consta en los títulos En este orden de ideas, se debe tener presente que en Derecho Administrativo la costumbre no constituye derecho, y la administración siempre está obligada a enmendar o ajustar situaciones a la legalidad vigente, por lo que no es posible extender las facultades institucionales en razón de haber resuelto en el pasado de determinada manera", "pagina": 4, "offset": 15837, "id": "MM-5939-2025#20", "materias": {"Cabida predial": {"peso": 2, "por": ["frase: margen de tolerancia"]}, "Límites de competencia": {"peso": 2, "por": ["frase: costumbre no constituye derecho"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 21, "etiqueta": "V", "texto": "RECOMENDACIONES. Conforme a lo señalado, se pueden mencionar -a modo ejemplar- las siguientes respuestas a situaciones que podrían darse", "pagina": 5, "offset": 21624, "id": "MM-5939-2025#21", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 22, "etiqueta": "1", "texto": "En el caso que un predio no tenga asignada una superficie, no se puede consignar como superficie de los títulos ninguna, es decir, queda ese aspecto como \"superficie indeterminada\". Luego, se debe revisar la carpeta predial a objeto de descartar reclamos sobre la cabida del predio y determinar en base a estos antecedentes la aprobación o rechazo. Se hace presente la posibilidad de solicitar antecedentes complementarios de conformidad a la Ley. 19.880, sobre bases de los procedimientos administrativos, y tener a la vista antecedentes como la superficie que indica el certificado de avalúo fiscal", "pagina": 5, "offset": 21812, "id": "MM-5939-2025#22", "materias": {"Cabida predial": {"peso": 5, "por": ["frase: avalúo fiscal", "frase: carpeta predial", "término: cabida"]}, "Procedimiento administrativo": {"peso": 2, "por": ["frase: antecedentes complementarios"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 23, "etiqueta": "2", "texto": "En caso que el título de dominio de un predio consigne superficie exacta o determinada y el estudio técnico establezca una superficie mayor a aquella, CONAF no está facultada para aprobar la solicitud", "pagina": 6, "offset": 22815, "id": "MM-5939-2025#23", "materias": {"Planes de manejo": {"peso": 2, "por": ["frase: estudio técnico"]}, "Cabida predial": {"peso": 2, "por": ["frase: título de dominio"]}, "Límites de competencia": {"peso": 2, "por": ["frase: no está facultada"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 24, "etiqueta": "3", "texto": "En caso que el título de dominio de un predio consigne superficie y el estudio técnico establezca una superficie menor a lo establecido en los títulos de dominio, se debe aprobar legalmente la solicitud, dejando constancia de la diferencia de superficies. Ello, por cuanto no se afectarían derechos de terceros", "pagina": 6, "offset": 23078, "id": "MM-5939-2025#24", "materias": {"Planes de manejo": {"peso": 2, "por": ["frase: estudio técnico"]}, "Cabida predial": {"peso": 4, "por": ["frase: título de dominio", "frase: títulos de dominio"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 25, "etiqueta": "4", "texto": "En caso que el título indique una cabida \"aproximada\" o \"más o menos\" y la solicitud le atribuya una superficie mayor, estimamos que CONAF no se encuentra facultada para aproximar la superficie y ajustarla a lo indicado a la solicitud, salvo mínimos ajustes conforme se señaló. Si por el contrario se indica una superficie menor a la señalada en el título, se debe aprobar legalmente la solicitud, dejando constancia de la diferencia de superficies. Ello, por cuanto no se afectarían derechos de terceros", "pagina": 6, "offset": 23470, "id": "MM-5939-2025#25", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 26, "etiqueta": "5", "texto": "En caso de que el título corresponda a un \"resto de\" un predio que presenta transferencias al margen, se sugiere analizar las anotaciones marginales a objeto de comprobar que la superficie considere lo debidamente restado del título y que los rodales de corta están en las áreas no enajenadas. Así como chequear el cumplimiento de las instrucciones dadas en el Oficio N° 521/2020 de la Dirección Ejecutiva, que en su parte pertinente señala \"Asimismo, se establece de manera general para todos los estudios técnicos, la exigencia de presentar los planos de subdivisión, en el evento que de la inscripción aparezcan anotaciones marginales de transferencias de dominio, por cuanto es fundamental para determinar si el área afecta se encuentra o no transferida, así como la superficie actual del predio. De igual modo, se establece la obligación de indicar claramente en la cartografía la superficie actual del predio, así como si el inmueble ha sido objeto de subdivisiones y transferencias de dominio, procediendo a indicarlas y señalizarlas en el plano .\"", "pagina": 6, "offset": 24094, "id": "MM-5939-2025#26", "materias": {"Cabida predial": {"peso": 3, "por": ["frase: anotaciones marginales", "término: subdivisión"]}}, "normas": [], "refs": ["OF-521-2020"], "principal": false}, {"doc": "MM-5939-2025", "orden": 27, "etiqueta": "6", "texto": "Se hace presente la posibilidad de solicitar antecedentes complementarios de conformidad a la Ley. 19.880, sobre bases de los procedimientos administrativos. Luego, si es imposible determinar dicha cabida por múltiples enajenaciones y falta de antecedentes se sugiere no aprobar", "pagina": 6, "offset": 25401, "id": "MM-5939-2025#27", "materias": {"Procedimiento administrativo": {"peso": 2, "por": ["frase: antecedentes complementarios"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-5939-2025", "orden": 28, "etiqueta": "7", "texto": "Si del estudio de los antecedentes, se determina rechazar una solicitud por las razones examinadas precedentemente, se deberá justificar el rechazo en que no es posible determinar si el área afecta se encuentra o no amparada en los títulos, y se deberá consignar en el respectivo informe que cualquier diferencia entre la cabida real y la cabida indicada en los títulos, deberá ser resuelta ante el Conservador de Bienes Raíces respectivo o ante los Tribunales de Justicia. En consecuencia, a la luz de la consulta efectuada por la Gerencia de Fiscalización y Evaluación Ambiental y teniendo en especial consideración el apego a la normativa vigente, esta Fiscalía es de la opinión que no hay posibilidad de aplicar márgenes de tolerancia cuando una solicitud excede la superficie consignada en los títulos, dejando estas materias a la resolución de los particulares a través de las vías que nuestro ordenamiento jurídico ha establecido para ello. Sin perjuicio de lo indicado, y a la luz de las múltiples situaciones que pueden darse en este vasto tema, se indica que los abogados de CONAF están facultados para aplicar los criterios jurídicos necesarios en el examen caso a caso. [1] Alessandri Rodríguez, Arturo, De la compraventa y de la promesa de venta. Tomo 1. Vol", "pagina": 6, "offset": 25761, "id": "MM-5939-2025#28", "materias": {"Cabida predial": {"peso": 5, "por": ["frase: conservador de bienes raíces", "frase: márgenes de tolerancia", "término: cabida"]}}, "normas": [], "refs": [], "principal": true}, {"doc": "MM-751-2021", "orden": 1, "etiqueta": "¶", "texto": "MEMORANDUM N° 751/2021 A : JEFE (I)-DEPARTAMENTO ABASTECIMIENTO DE : FERNANDO LLONA MÁRQUEZ - FISCAL FISCALIA MATERIA: OTORGA ORIENTACIÓN JURÍDICA FECHA : 16/02/2021", "pagina": 1, "offset": 228, "id": "MM-751-2021#1", "materias": {}, "normas": [], "refs": ["MM-751-2021"], "principal": false}, {"doc": "MM-751-2021", "orden": 2, "etiqueta": "¶", "texto": "Mediante Memorándum N° 696, de 15 de febrero de 2020, el Jefe del Departamento de Abastecimiento solicita orientación jurídica ya que en nuevo Convenio Marco Desarrollo de Software ID 2239-4-LR20, obliga a que los organismos públicos deban completar un formulario electrónico con la finalidad de enviar automáticamente a los proveedores adjudicados, los requerimientos de servicios a contratar a través de una cotización publicada en el sistema de información. Por su parte, los proveedores adjudicados en la categoría correspondiente al servicio a contratar tendrán la opción de ingresar una cotización en respuesta del requerimiento efectuado por la entidad, cuyo contenido se entenderá, para todos los efectos, parte de las condiciones pactadas en caso de ser seleccionado", "pagina": 1, "offset": 499, "id": "MM-751-2021#2", "materias": {"Contratación pública": {"peso": 3, "por": ["frase: convenio marco", "término: cotización"]}}, "normas": [], "refs": ["MM-696-2020"], "principal": false}, {"doc": "MM-751-2021", "orden": 3, "etiqueta": "¶", "texto": "Las entidades, posterior a la recepción de las ofertas, deberán evaluar éstas de conformidad con lo dispuesto en el requerimiento (cotización) y las Bases de la Licitación 2239-4-LR20, para seleccionar la oferta más conveniente. Una vez seleccionado el proveedor, se debe adjuntar un acto administrativo para aprobar evaluación técnica y otro acto administrativo para autorizar la evaluación económica conjunto con la adjudicación, pero ni la legislación ni la directiva indican que tipo de documento corresponde al acto administrativo. Finalmente se suscribe un acuerdo complementario que recoge información de la cotización, los requerimientos y la oferta del adjudicatario, previa recepción conforme de la garantía de fiel cumplimiento para emitir la Orden de Compra", "pagina": 1, "offset": 1407, "id": "MM-751-2021#3", "materias": {"Contratación pública": {"
