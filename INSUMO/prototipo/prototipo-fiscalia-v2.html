<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repositorio de Criterios — Fiscalía CONAF · Prototipo v2</title>
<style>
:root{
  color-scheme:light;
  --paper:#faf9f6; --surface:#ffffff; --surface-2:#f5f4f0;
  --ink:#14140f; --ink-2:#54534d; --ink-3:#8a887f;
  --rule:#e3e1d9; --rule-2:#d3d0c6;
  --accent:#1d5c3f; --accent-2:#0f3d28; --accent-soft:#eef4f0;
  --good:#0ca30c; --good-ink:#00630 0; --good-ink:#006300;
  --warn:#fab219; --warn-ink:#7d5800;
  --serious:#ec835a; --serious-ink:#9c4318;
  --critical:#d03b3b; --critical-ink:#9c1f1f;
  --series-1:#2a78d6;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.011em}

/* ── Cabecera ─────────────────────────────────────────── */
.top{background:var(--surface);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding:18px 28px 0}
.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
.brand{display:flex;gap:13px;align-items:center}
.mark{width:34px;height:34px;border-radius:7px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em;flex:none}
.brand h1{font-size:16.5px}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--ink-3)}
.protobadge{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--warn-ink);background:#fdf3dd;border:1px solid #f3e0ae;
  padding:4px 9px;border-radius:5px;align-self:center}
nav{display:flex;gap:2px;margin-top:16px;flex-wrap:wrap}
nav button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  font:inherit;font-size:13.5px;color:var(--ink-2);padding:9px 13px;cursor:pointer;
  border-radius:5px 5px 0 0}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button[aria-selected=true]{color:var(--accent-2);border-bottom-color:var(--accent);font-weight:600}

main{max-width:1180px;margin:0 auto;padding:26px 28px 80px}
.view{display:none}.view.on{display:block}

/* ── Piezas ───────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:9px}
.pad{padding:20px 22px}
.vh{font-size:19px;margin-bottom:5px}
.vsub{color:var(--ink-2);font-size:13.5px;max-width:76ch;margin:0 0 20px}
.sect{margin-top:34px}
.sect>h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  margin-bottom:11px;font-weight:650}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px;margin-bottom:24px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:14px 16px}
.tile .lab{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em;margin-bottom:5px}
.tile .val{font-size:27px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.tile .foot{font-size:11.5px;color:var(--ink-2);margin-top:4px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:2.5px 8px;border-radius:20px;border:1px solid var(--rule-2);
  background:var(--surface-2);color:var(--ink-2);white-space:nowrap;letter-spacing:.01em}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.st-good .dot{background:var(--good)} .st-good{color:var(--good-ink);border-color:#bfe4bf;background:#f0f8f0}
.st-warning .dot{background:var(--warn)} .st-warning{color:var(--warn-ink);border-color:#f0dfae;background:#fdf6e6}
.st-serious .dot{background:var(--serious)} .st-serious{color:var(--serious-ink);border-color:#f3ceba;background:#fdf1eb}
.st-critical .dot{background:var(--critical)} .st-critical{color:var(--critical-ink);border-color:#eec4c4;background:#fcf0f0}
.st-neutral .dot{background:var(--ink-3)}
.jer{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-2);border:1px solid var(--rule-2);padding:2px 7px;border-radius:4px;background:var(--surface-2)}
.jer.j1{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft);font-weight:700}

/* ── Consulta ─────────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.chip{appearance:none;font:inherit;font-size:12.5px;background:var(--surface);
  border:1px solid var(--rule-2);color:var(--ink-2);padding:5px 12px;border-radius:20px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent-2)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip .n{opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true] .n{opacity:.75}

.resumen{border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:13px 16px;border-radius:0 7px 7px 0;margin:18px 0 20px;font-size:13.5px;color:var(--ink-2)}
.resumen b{color:var(--ink)}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1.5px;background:var(--rule-2)}
.node{position:relative;margin-bottom:14px}
.node::before{content:"";position:absolute;left:-24px;top:15px;width:11px;height:11px;
  border-radius:50%;background:var(--surface);border:2.5px solid var(--accent)}
.node.ext::before{border-color:var(--rule-2);background:var(--surface-2)}
.node.falta::before{border-color:var(--serious);border-style:dashed}

.doc{background:var(--surface);border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.doc-h{padding:13px 17px;display:flex;gap:11px;align-items:baseline;flex-wrap:wrap;
  border-bottom:1px solid var(--rule);background:linear-gradient(var(--surface),var(--surface-2))}
.doc-id{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent-2)}
.doc-f{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-2)}
.doc-t{flex:1 1 260px;font-size:14px;font-weight:600;min-width:200px}
.doc-b{padding:15px 17px}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;align-items:center}
.crit{font-size:14px;margin:0 0 13px}
.fuerza{font-style:italic;color:var(--ink-2)}

blockquote{margin:0 0 12px;padding:12px 15px;background:var(--surface-2);
  border-left:3px solid var(--rule-2);border-radius:0 6px 6px 0;
  font-family:var(--serif);font-size:14.5px;line-height:1.5;color:var(--ink)}
.qsrc{display:flex;gap:9px;flex-wrap:wrap;align-items:center;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:9px}
.qsrc .ok{color:var(--good-ink);font-weight:600}
.ruta{font-family:var(--mono);font-size:11px;color:var(--ink-3);word-break:break-all;
  padding-top:9px;border-top:1px dashed var(--rule);margin-top:11px}
.norms{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.norm{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);background:var(--surface-2);
  border:1px solid var(--rule);padding:2px 7px;border-radius:4px}
.rel{font-size:12.5px;color:var(--ink-2);margin-top:9px;padding-left:13px;border-left:2px solid var(--rule-2)}
.rel b{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-2)}
.warnbox{margin-top:11px;padding:10px 13px;border-radius:6px;font-size:12.5px;
  background:#fdf6e6;border:1px solid #f0dfae;color:var(--warn-ink)}
.warnbox.s{background:#fdf1eb;border-color:#f3ceba;color:var(--serious-ink)}
.desest{margin-top:11px;padding:10px 13px;border-radius:6px;font-size:12.5px;
  background:var(--surface-2);border:1px dashed var(--rule-2);color:var(--ink-2)}

/* ── Tablas ───────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  font-weight:650;padding:9px 11px;border-bottom:1.5px solid var(--rule-2);white-space:nowrap}
td{padding:10px 11px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
td.m{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.scroll{overflow-x:auto}

/* ── Gráfico ──────────────────────────────────────────── */
.chart{display:flex;align-items:flex-end;gap:12px;height:120px;padding:0 4px;margin-top:6px}
.bar-w{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:52px;background:var(--series-1);border-radius:4px 4px 0 0;min-height:3px}
.bar-n{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.bar-x{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  padding-top:6px;border-top:1px solid var(--rule-2);width:100%;text-align:center}

/* ── Anexo técnico ────────────────────────────────────── */
pre{background:#12140f;color:#e8e6dc;border-radius:9px;padding:18px 20px;overflow-x:auto;
  font-family:var(--mono);font-size:11.5px;line-height:1.62;margin:0}
pre .c{color:#7f9c72} pre .k{color:#9ec8f0} pre .t{color:#e6c07b} pre .s{color:#c8a2c8}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px}
.meth{border:1px solid var(--rule);border-radius:9px;padding:15px 17px;background:var(--surface)}
.meth h4{font-size:13.5px;margin-bottom:5px}
.meth p{margin:0;font-size:12.5px;color:var(--ink-2)}
.verb{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:4px;
  background:var(--accent-soft);color:var(--accent-2);border:1px solid #cfe0d6;margin-bottom:7px}
.verb.t{background:#fdf1eb;color:var(--serious-ink);border-color:#f3ceba}
.flow{display:flex;gap:9px;flex-wrap:wrap;align-items:stretch;margin-top:6px}
.step{flex:1 1 152px;border:1px solid var(--rule);border-radius:8px;padding:12px 13px;background:var(--surface)}
.step .n{font-family:var(--mono);font-size:10.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
.step h5{margin:4px 0 4px;font-size:12.5px;font-weight:600}
.step p{margin:0;font-size:11.5px;color:var(--ink-2);line-height:1.45}
.gate{border-color:var(--accent);background:var(--accent-soft)}
.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.chk{color:var(--good-ink);font-weight:700}
.xmk{color:var(--critical-ink);font-weight:700}
@media (max-width:640px){
  .top-in,main{padding-left:16px;padding-right:16px}
  .doc-h{gap:7px}
}

/* ═══ v2 ═══════════════════════════════════════════════════ */
.buscador{display:flex;gap:9px;align-items:stretch;margin-bottom:13px;flex-wrap:wrap}
.buscador input{flex:1 1 320px;font:inherit;font-size:15px;padding:11px 15px;
  border:1.5px solid var(--rule-2);border-radius:8px;background:var(--surface);color:var(--ink)}
.buscador input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.sugs .lab{font-size:11.5px;color:var(--ink-3);margin-right:2px}
.sug{appearance:none;font:inherit;font-size:11.5px;background:var(--surface-2);
  border:1px solid var(--rule);color:var(--ink-2);padding:3px 9px;border-radius:5px;cursor:pointer}
.sug:hover{border-color:var(--accent);color:var(--accent-2)}

.vias{display:flex;gap:5px;flex-wrap:wrap}
.via{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;border:1px solid;white-space:nowrap}
.via-descriptor{background:#eef4f0;border-color:#cfe0d6;color:var(--accent-2)}
.via-tesauro{background:#eef2fb;border-color:#ccd9f2;color:#1c4b91}
.via-texto{background:#f6f1e8;border-color:#e6dcc6;color:#7a5a1e}
.via-norma{background:#f4eef6;border-color:#e0d2e6;color:#5d3a6b}
.via-cita{background:#fdf0ec;border-color:#f2d4c8;color:var(--serious-ink)}
.conv{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.conv b{color:var(--accent-2)}

.pasaje{border-left:2px solid var(--rule-2);padding:9px 0 9px 13px;margin:9px 0}
.pasaje-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.pasaje-t{font-family:var(--serif);font-size:13.5px;line-height:1.5;color:var(--ink)}
.pasaje mark{background:#fdf2c8;padding:0 1px;border-radius:2px}
.etq{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;
  padding:1.5px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--rule-2);color:var(--ink-2)}
.etq.pri{background:var(--accent-soft);border-color:#cfe0d6;color:var(--accent-2)}
.mas{appearance:none;font:inherit;font-size:12px;background:none;border:0;color:var(--accent);
  cursor:pointer;padding:5px 0;text-decoration:underline;text-underline-offset:3px}

.chk-row{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:baseline;
  padding:10px 14px;border-bottom:1px solid var(--rule);font-size:13px}
.chk-row:last-child{border-bottom:0}
.chk-cod{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.chk-est{font-family:var(--mono);font-size:11px;font-weight:700;white-space:nowrap}
.chk-ok{color:var(--good-ink)} .chk-av{color:var(--warn-ink)} .chk-no{color:var(--critical-ink)}
.chk-n{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chk-g{font-size:12px;color:var(--ink-2)}
.detalle{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--ink-3);
  padding-left:2px;margin-top:2px}

.clase-doctrina{color:var(--critical-ink);font-weight:600}
.clase-instrucción{color:var(--serious-ink);font-weight:600}
.clase-documento{color:var(--ink-2)}
.clase-solicitud{color:var(--ink-3)}
.crit-star{color:var(--critical-ink);font-weight:700}
.via-ampl{background:var(--surface-2);border-color:var(--rule-2);color:var(--ink-3)}
.node.ext .doc{opacity:.92}
.norm-ambas{border-color:#bfe4bf;background:#f4faf4;color:var(--good-ink)}
.norm-texto{border-style:dashed}
</style></head><body>

<header class="top"><div class="top-in">
  <div class="brandrow">
    <div class="brand">
      <div class="mark">FC</div>
      <div><h1>Repositorio de Criterios · Fiscalía</h1>
      <p>Corporación Nacional Forestal — biblioteca de criterio trazado</p></div>
    </div>
    <span class="protobadge" id="sello"></span>
  </div>
  <nav id="nav"></nav>
</div></header>

<main>
  <section class="view on" id="v-consulta"></section>
  <section class="view" id="v-lineas"></section>
  <section class="view" id="v-vacios"></section>
  <section class="view" id="v-corpus"></section>
  <section class="view" id="v-normas"></section>
  <section class="view" id="v-confianza"></section>
  <section class="view" id="v-arq"></section>
</main>

<div style="max-width:1180px;margin:0 auto;padding:0 28px 40px">
  <div class="foot">
    <span id="pie"></span>
    <span>Fiscalía · Corporación Nacional Forestal</span>
  </div>
</div>

ales", "normas": ["Ley 19.880 art. 7", "Ley 19.880 art. 8", "Ley 19.880 art. 14", "Ley 18.575 art. 3", "Ley 18.575 art. 8"], "relaciones": [{"tipo": "aplica", "ref": "Dictamen CGR E125384/2021", "nota": "Aplica jurisprudencia previa"}], "descriptores_originales": ["Procedimiento administrativo", "Plazos", "Principio conclusivo"], "ruta": "DE CONTRALORÍA/Los plazos de la administración NO SON FATALES.pdf", "pagina": 2, "sha": "b6c7242a5de45dd1", "paginas": 4, "n_pasajes": 11, "refs": ["CGR-125384", "CGR-284318"], "materias_texto": ["Procedimiento administrativo"], "normas_idx": [{"n": "Ley 18.575", "origen": "texto", "pagina": 2}, {"n": "Ley 18.575 art. 3", "origen": "ficha", "pagina": null}, {"n": "Ley 18.575 art. 8", "origen": "ficha", "pagina": null}, {"n": "Ley 19.880", "origen": "texto", "pagina": 2}, {"n": "Ley 19.880 art. 14", "origen": "ficha", "pagina": null}, {"n": "Ley 19.880 art. 7", "origen": "ficha", "pagina": null}, {"n": "Ley 19.880 art. 8", "origen": "ficha", "pagina": null}]}, {"id": "MM-5939-2025", "tipo": "Memorándum", "numero": "5939", "anio": 2025, "fecha": "2025-11-19", "organo": "CONAF — Fiscalía", "emisor": "Fiscalía, Oficina Central", "firmante": "Daniela Andrea Prokurica Núñez, Fiscal", "destinatario": "Gerencia de Fiscalización Forestal y Evaluación Ambiental", "jerarquia": "asesor", "fuerza": "estima", "alcance": "general", "estado": "vigente", "materia": "Diferencias de cabida predial entre estudio técnico y títulos de dominio", "descriptores": ["Cabida predial", "Límites de competencia", "Planes de manejo"], "criterio": "No se pueden aplicar márgenes de tolerancia (la práctica previa era 7% y 5%) cuando la solicitud excede la superficie de los títulos. Único margen: si el título dice 'más o menos', hasta la unidad de medida siguiente. La costumbre no constituye derecho en Derecho Administrativo.", "cita": "no hay posibilidad de aplicar márgenes de tolerancia cuando una solicitud excede la superficie consignada en los títulos", "normas": "origen": "texto", "pagina": 1}, {"n": "Ley de Presupuestos", "origen": "texto", "pagina": 1}]}, {"id": "RES-884-2026", "tipo": "Resolución", "numero": "884", "anio": 2026, "fecha": "2026-08-04", "organo": "CONAF — Dirección Ejecutiva", "emisor": "Dirección Ejecutiva", "firmante": "Aida Baldini Urrutia, Directora Ejecutiva (I)", "destinatario": "Gerencias y Direcciones Regionales", "jerarquia": "instruccional", "fuerza": "concluye", "alcance": "general", "estado": "vigente", "materia": "Protocolo de Asignación, Uso y Restitución de Viviendas Fiscales", "descriptores": ["Actos administrativos", "Bienes institucionales", "Gestión de personas"], "criterio": "Aprueba el protocolo en cumplimiento del Dictamen CGR D263/2026. Toda asignación se formaliza por resolución; plazo máximo de 3 años fuera de Áreas Protegidas; descuento del 10% del sueldo base; consumos de cargo del ocupante con comprobantes mensuales; silvicultura preventiva; causales tasadas de restitución.", "cita": "Las viviendas situadas fuera de Áreas Protegidas (AP) se asignarán por un plazo máximo de 3 años", "normas": ["DFL 29 art. 91", "DS 25/2026 MINAGRI", "Estatutos CONAF art. 18"], "relaciones": [{"tipo": "cumple", "ref": "Dictamen CGR D263/2026", "nota": "Plazo de 60 días hábiles para dictar la normativa interna"}], "descriptores_originales": ["Bienes institucionales", "Gestión de personas", "Actos administrativos"], "ruta": "DE LA DIRECCIÓN EJECUTIVA CONAF/Res. 884-2026 (Protocolo asignacion y uso viviendas fiscales).pdf", "pagina": 2, "sha": "914171f85b79ac81", "paginas": 5, "n_pasajes": 17, "refs": ["CGR-263", "MM-2914-2026"], "materias_texto": ["Actos administrativos", "Bienes institucionales", "Gestión de personas", "Naturaleza jurídica de CONAF", "Remuneraciones", "Áreas silvestres protegidas"], "normas_idx": [{"n": "DFL 29 art. 91", "origen": "ficha", "pagina": null}, {"n": "DS 25/2026 MINAGRI", "origen": "ficha", "pagina": null}, {"n": "Estatutos CONAF art. 18", "origen": "ficha", "pagina": null}]}, {"id": "MM-4187-2026", "tipo": "Memorándum", "numero": "4187", "anio": 2026, "fecha": "2026-08-06", "organo": "CONAF — Fiscalía", "emisor": "Fiscalía, Oficina Central", "firmante": "Daniel Correa Díaz, Fiscal (I)", "destinatario": "Gerencia de Protección contra Incendios Forestales", "jerarquia": "asesor", "fuerza": "concluye", "alcance": "general", "estado": "vigencia_diferida", "materia": "Ley 21.719 aplicada a un sistema de fichas digitales del personal operativo", "descriptores": ["Gestión de personas", "Protección de datos personales"], "criterio": "El sistema es viable, condicionado. La base de licitud es el art. 13 b) y c), no el consentimiento. Se excluyen salud, biométricos y antecedentes disciplinarios: la aptitud se registra como atributo binario apto/no apto. La app en dispositivo propio no puede imponerse. Evaluación de impacto previa y obligatoria.", "cita": "no deben incorporarse a la ficha los datos relativos a la salud, los datos biométricos, los antecedentes disciplinarios ni los restantes datos sensibles", "normas": ["Ley 21.719 art. 13", "Ley 21.719 art. 15 ter", "Ley 21.719 art. 16", "Ley 21.719 art. 16 bis", "Ley 21.719 art. 20", "Código del Trabajo art. 5", "Código del Trabajo art. 152 quáter L", "Código del Trabajo art. 154 bis", "Código del Trabajo art. 184", "Ley 16.744"], "relaciones": [{"tipo": "restringe", "ref": "MM-3129-2022", "nota": "Eleva el estándar bajo el nuevo estatuto"}], "alerta": "Razona sobre la Ley 21.719, cuya vigencia comienza el 01-12-2026. El criterio es prospectivo por diseño.", "descriptores_originales": ["Protección de datos personales", "Gestión de personas", "Datos sensibles"], "ruta": "DE FISCALÍA CONAF/MM. 4187-2026 (Pronunc. Ley de Datos Personales Gerencia de Incendios).pdf", "pagina": 6, "sha": "4bb2974c8c450ac1", "paginas": 8, "n_pasajes": 32, "refs": ["MM-4035-2026", "MM-4187-2026"], "materias_texto": ["Gestión de personas", "Naturaleza jurídica de CONAF", "Protección de datos personales"], "normas_idx": [{"n": "Constitución", "origen": "texto", "pagina": 1}, {"n": "Código del Trabajo", "origen": "texto", "pagina": 1}, {"n": "Código del Trabajo art. 152 quáter", "origen": "texto", "pagina": 7}, {"n": "Código del Trabajo art. 152 quáter L", "origen": "ficha", "pagina": null}, {"n": "Código del Trabajo art. 154 bis", "origen": "ficha", "pagina": null}, {"n": "Código del Trabajo art. 16 bis", "origen": "texto", "pagina": 3}, {"n": "Código del Trabajo art. 184", "origen": "ficha", "pagina": null}, {"n": "Código del Trabajo art. 5", "origen": "ficha", "pagina": null}, {"n": "Ley 16.744", "origen": "ambas", "pagina": 1}, {"n": "Ley 16.744 art. 20", "origen": "texto", "pagina": 6}, {"n": "Ley 19.628", "origen": "texto", "pagina": 1}, {"n": "Ley 21.719", "origen": "texto", "pagina": 1}, {"n": "Ley 21.719 art. 13", "origen": "ficha", "pagina": null}, {"n": "Ley 21.719 art. 15 ter", "origen": "ficha", "pagina": null}, {"n": "Ley 21.719 art. 16", "origen": "ficha", "pagina": null}, {"n": "Ley 21.719 art. 16 bis", "origen": "ficha", "pagina": null}, {"n": "Ley 21.719 art. 20", "origen": "ficha", "pagina": null}]}], "pasajes": [{"doc": "CGR-E337332-2023", "orden": 1, "etiqueta": "¶", "texto": "DIGA, derechos de aprovechamiento de aguas subterráneas, recurso de consideración, demora resolución, respuesta oportuna, principios de eficiencia, eficacia y de accionar por propia iniciativa, agilidad procedimientos administrativos", "pagina": 1, "offset": 20, "id": "CGR-E337332-2023#1", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "CGR-E337332-2023", "orden": 2, "etiqueta": "¶", "texto": "NÚMERO DICTAMEN FECHA DOCUMENTO E337332N23 25-04-2023 NUEVO: REACTIVADO: NO SI RECONSIDERADO RECONSIDERADO: PARCIAL: NO NO ACLARADO: ALTERADO: NO NO APLICADO: CONFIRMADO: SI NO COMPLEMENTADO: CARÁCTER: NO NNN ORIGEN: DIVISIÓN DE INFRAESTRUCTURA Y REGULACIÓN CRITERIO: APLICA JURISPRUDENCIA", "pagina": 1, "offset": 256, "id": "CGR-E337332-2023#2", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "CGR-E337332-2023", "orden": 3, "etiqueta": "¶", "texto": "La Dirección General de Aguas debe adoptar las medidas tendientes a resolver, a la mayor brevedad, el recurso de reconsideración que se indica", "pagina": 2, "offset": 1270, "id": "CGR-E337332-2023#3", "materias": {"Procedimiento administrativo": {"peso": 3, "por": ["frase: recurso de reconsideración", "término: reconsideración"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "CGR-E337332-2023", "orden": 4, "etiqueta": "¶", "texto": "A través del dictamen E284318, de 2022, esta Contraloría General remitió a la Dirección General de Aguas (DGA) una presentación a través de la cual don Marcial León González reclamaba por la demora de ese servicio en resolver el recurso de reconsideración interpuesto en contra de la resolución \"DGA VI número 393 exenta del 25 de mayo del año 2021\"", "pagina": 2, "offset": 1466, "id": "CGR-E337332-2023#4", "materias": {"Procedimiento administrativo": {"peso": 3, "por": ["frase: recurso de reconsideración", "término: reconsideración"]}}, "normas": [], "refs": ["CGR-284318"], "principal": false}, {"doc": "CGR-E337332-2023", "orden": 5, "etiqueta": "¶", "texto": "Lo anterior, de conformidad con lo dispuesto en el artículo 14, inciso segundo, de la ley N° 19.880, que Establece Bases de los Procedimientos Administrativos que Rigen los Actos de los Órganos de la Administración del Estado, a fin de que esa repartición procediera a dar respuesta directa al interesado a la mayor brevedad", "pagina": 2, "offset": 1818, "id": "CGR-E337332-2023#5", "materias": {}, "normas": ["Ley 19.880"], "refs": [], "principal": false}, {"doc": "CGR-E337332-2023", "orden": 6, "etiqueta": "¶", "texto": "Pues bien, en relación con lo expuesto, por el documento de la referencia la DGA hace presente, en lo medular, \"la enorme carga laboral, traducida en la presentación (y tramitación consecutiva) de diversas acciones relacionadas a procedimientos de fiscalización al interior de la Dirección General de Aguas\". Añade que ello \"sumado a la limitada cantidad de personal, hace procedente, en primer lugar, darle el debido orden de prelación a la tramitación de cada caso, y a su vez intentar dar la mayor celeridad posible para la finalización de todos los procesos puestos bajo nuestro conocimiento\"", "pagina": 2, "offset": 2144, "id": "CGR-E337332-2023#6", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "CGR-E337332-2023", "orden": 7, "etiqueta": "¶", "texto": "Precisa, luego, que el recurso a que se refiere el recurrente contenía la petición de suspensión de los efectos de la resolución recurrida, lo que hace necesario pronunciarse al respecto, para luego efectuar las diligencias propias del recurso de reconsideración", "pagina": 2, "offset": 2741, "id": "CGR-E337332-2023#7", "materias": {"Procedimiento administrativo": {"peso": 3, "por": ["frase: recurso de reconsideración", "término: reconsideración"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "CGR-E337332-2023", "orden": 8, "etiqueta": "¶", "texto": "Finaliza, consignando que \"es efectivo que la Administración cuenta con plazos para dar respuesta a las solicitudes, pero que dichos plazos se estiman razonables ante la presentación de cada recurso\"; que \"dichos plazos no pueden desconocer la realidad de los diversos órganos de la Administración\", y que los mismos \"no son fatales, toda vez que tienen por finalidad el logro de un buen orden administrativo\"", "pagina": 2, "offset": 3005, "id": "CGR-E337332-2023#8", "materias": {"Procedimiento administrativo": {"peso": 3, "por": ["frase: no son fatales", "término: fatales"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "CGR-E337332-2023", "orden": 9, "etiqueta": "¶", "texto": "Sobre el particular, cumple con puntualizar que si bien los plazos contemplados en la ley para las actuaciones de la Administración, por regla general, no son fatales, la ley N° 18.575, en sus artículos 3°, inciso segundo, y 8° impone a los órganos de la Administración el deber de observar los principios de eficiencia, eficacia y de accionar por propia iniciativa en el cumplimiento de sus funciones, procurando la simplificación y rapidez de los trámites, como también la agilidad y expedición de los procedimientos administrativos (aplica, entre otros, el dictamen E125384, de 2021, de este origen). 2021, de este origen)", "pagina": 2, "offset": 3416, "id": "CGR-E337332-2023#9", "materias": {"Procedimiento administrativo": {"peso": 3, "por": ["frase: no son fatales", "término: fatales"]}}, "normas": ["Ley 18.575"], "refs": ["CGR-125384"], "principal": true}, {"doc": "CGR-E337332-2023", "orden": 10, "etiqueta": "¶", "texto": "Asimismo, que el artículo 7° de la antedicha ley N° 19.880 reitera el principio de celeridad de los actos de las autoridades y funcionarios públicos, y que el artículo 8° de ese ordenamiento consagra el principio conclusivo, en cuya virtud el procedimiento administrativo debe terminar con la dictación de un acto decisorio que se pronuncie sobre la cuestión de fondo y en el cual se exprese la voluntad del órgano administrativo", "pagina": 3, "offset": 4042, "id": "CGR-E337332-2023#10", "materias": {"Procedimiento administrativo": {"peso": 9, "por": ["frase: Procedimiento administrativo", "frase: procedimiento administrativo", "frase: principio conclusivo", "frase: principio de celeridad", "término: celeridad"]}}, "normas": ["Ley 19.880"], "refs": [], "principal": false}, {"doc": "CGR-E337332-2023", "orden": 11, "etiqueta": "¶", "texto": "En consecuencia, atendido el tiempo transcurrido, y considerando que el recurso de que se trata fue deducido, según informa la misma DGA, el 11 de junio de 2021, sin que a la fecha haya sido resuelto, procede que esa Dirección adopte las medidas tendientes a su pronta resolución, de lo que deberá informar a la Coordinación Nacional de Seguimiento y Apoyo al Cumplimiento de la División de Auditoría de esta Contraloría General en el plazo de 10 días contado desde la recepción del presente oficio", "pagina": 3, "offset": 4474, "id": "CGR-E337332-2023#11", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1683-2026", "orden": 1, "etiqueta": "-", "texto": "Principios generales de la contratación pública, en especial los de legalidad, igualdad entre oferentes y estricta sujeción a las bases. En relación con la normativa aplicable, corresponde precisar que la Ley N° 19.886 fue modificada por la Ley N° 21.634, que moderniza el sistema de compras públicas, publicada en el Diario Oficial el 11 de diciembre de 2023, la cual entró en vigencia, como regla general, el 11 de diciembre de 2024, contemplando una aplicación anticipada del Capítulo de Probidad y Transparencia desde la fecha de su publicación. Ahora bien, el artículo tercero transitorio de la Ley N° 19.886, en su texto vigente, establece expresamente que: \"Los contratos administrativos que se regulan en esta ley, cuyas bases hayan sido aprobadas antes de su entrada en vigencia, se regularán por la normativa legal vigente a la fecha de aprobación de dichas bases de licitación.\" Atendido que los procesos licitatorios objeto del presente análisis cuentan con bases de licitación aprobadas en septiembre de 2023, resulta jurídicamente aplicable el régimen legal y reglamentario vigente a la fecha de dicha aprobación, y no aquel introducido con posterioridad por la Ley N° 21.634. En consecuencia, no resulta aplicable a estos procesos ni a los contratos que de ellos derivan el Decreto N° 661, de 12 de diciembre de 2024, que contiene el actual Reglamento de la Ley de Compras Públicas, debiendo regirse íntegramente por la normativa anterior, tanto legal como reglamentaria, vigente al momento de la aprobación de las respectivas bases", "pagina": 2, "offset": 3579, "id": "MM-1683-2026#1", "materias": {"Contratación pública": {"peso": 10, "por": ["frase: Contratación pública", "frase: bases de licitación", "frase: sujeción a las bases", "frase: compras públicas", "término: oferente", "término: oferentes"]}}, "normas": ["Decreto 661", "Ley 19.886", "Ley 21.634"], "refs": [], "principal": false}, {"doc": "MM-1683-2026", "orden": 2, "etiqueta": "-", "texto": "El precio acordado es fijo, cierto y determinado, no sujeto a variación, salvo por los mecanismos operativos expresamente previstos (horas extra, días extra, canjes), los que no alteran el valor unitario pactado", "pagina": 3, "offset": 7905, "id": "MM-1683-2026#2", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1683-2026", "orden": 3, "etiqueta": "-", "texto": "La expresión del precio en USD constituye un mecanismo de mitigación del riesgo cambiario, más no una habilitación para reajustes adicionales", "pagina": 3, "offset": 8168, "id": "MM-1683-2026#3", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1683-2026", "orden": 4, "etiqueta": "2", "texto": "Principio de estricta sujeción a las Bases Conforme a los artículos 9 y 10 de la Ley N° 19.886, los contratos administrativos: se rigen estrictamente por las bases de licitación; y obligan tanto a la entidad licitante como al adjudicatario al exacto cumplimiento de lo allí previsto. En este contexto, la ausencia de una cláusula de reajuste en las Bases impide jurídicamente introducirla con posterioridad a la adjudicación, por cuanto ello vulneraría los principios de: igualdad entre los oferentes; transparencia; libre concurrencia; juridicidad y legalidad administrativa. En este sentido, la Contraloría General de la República ha señalado reiteradamente que el principio de estricta sujeción a las bases rige tanto la etapa licitatoria como la ejecución del contrato, constituyendo las bases y la oferta del adjudicatario el marco jurídico vinculante de derechos y obligaciones para las partes, en resguardo de la legalidad y transparencia que deben primar en la contratación administrativa (aplica, entre otros, dictamen N° E149544, de 2025)", "pagina": 3, "offset": 8345, "id": "MM-1683-2026#4", "materias": {"Contratación pública": {"peso": 11, "por": ["frase: bases de licitación", "frase: sujeción a las bases", "frase: cláusula de reajuste", "término: oferente", "término: oferentes", "término: adjudicación", "término: adjudicatario", "término: reajuste"]}}, "normas": ["Ley 19.886"], "refs": ["CGR-149544"], "principal": false}, {"doc": "MM-1683-2026", "orden": 5, "etiqueta": "3", "texto": "Régimen contractual del combustible El tratamiento contractual del combustible en los instrumentos que rigen las licitaciones analizadas es claro, expreso y sistemático, en particular", "pagina": 3, "offset": 9626, "id": "MM-1683-2026#5", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1683-2026", "orden": 6, "etiqueta": "-", "texto": "Las Especificaciones Técnicas disponen que la provisión, disponibilidad y calidad del combustible es de responsabilidad exclusiva del adjudicatario", "pagina": 3, "offset": 9864, "id": "MM-1683-2026#6", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1683-2026", "orden": 7, "etiqueta": "-", "texto": "Las interrupciones del servicio por falta de combustible, atribuibles a responsabilidades del proveedor, faculta a CONAF a dejar inoperativa la aeronave y aplicar la multa de carácter muy grave por inoperatividad", "pagina": 3, "offset": 10210, "id": "MM-1683-2026#7", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1683-2026", "orden": 8, "etiqueta": "-", "texto": "El capítulo relativo al Componente del Precio establece que el precio ofertado debe comprender todo lo necesario para la operación, incluyendo explícitamente combustible y lubricantes, junto a cualquier otro costo operacional propio de la aeronave. Este conjunto normativo permite concluir que conforme a las bases de la licitación el riesgo económico asociado al combustible fue asignado al proveedor, debiendo ser razonablemente internalizado al momento de formular la oferta económica", "pagina": 3, "offset": 10474, "id": "MM-1683-2026#8", "materias": {"Contratación pública": {"peso": 2, "por": ["frase: oferta económica"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1683-2026", "orden": 9, "etiqueta": "4", "texto": "Inexistencia de cláusulas de reajuste o revisión de precios Del examen íntegro de las Bases Administrativas, Especificaciones Técnicas y Anexos contractuales, se constata que", "pagina": 3, "offset": 11062, "id": "MM-1683-2026#9", "materias": {"Contratación pública": {"peso": 3, "por": ["frase: bases administrativas", "término: reajuste"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1683-2026", "orden": 10, "etiqueta": "5", "texto": "Renovación contractual y precios Si bien las Bases contemplan la posibilidad de renovación por temporada, dicha renovación se encuentra sujeta a disponibilidad presupuestaria, buen desempeño y acuerdo de las partes. Tal renovación no constituye un nuevo contrato autónomo, ni habilita, por sí sola, la modificación de los precios originalmente pactados. En mérito de lo expuesto, esta Fiscalía concluye que", "pagina": 4, "offset": 11995, "id": "MM-1683-2026#10", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1683-2026", "orden": 11, "etiqueta": "-", "texto": "Los contratos fueron estructurados como contratos de precio fijo, a riesgo del proveedor, sin cláusulas de reajuste o revisión de precios. En consecuencia, no resulta jurídicamente procedente acceder a solicitudes de aumento de precios fundadas en dicha causal. Se recomienda", "pagina": 4, "offset": 12835, "id": "MM-1683-2026#11", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1683-2026", "orden": 12, "etiqueta": "cita", "texto": "En mérito de lo expuesto, esta Fiscalía concluye que: -No existe base legal ni contractual que habilite la modificación de los precios del contrato por alza del combustible aeronáutico.", "pagina": 2, "offset": 7568, "id": "MM-1683-2026#12", "materias": {"Contratación pública": {"peso": 2, "por": ["frase: combustible aeronáutico"]}}, "normas": [], "refs": [], "principal": true}, {"doc": "MM-1688-2026", "orden": 1, "etiqueta": "1", "texto": "Ley N° 19.880, que establece las Bases de los Procedimientos Administrativos que rigen los actos de los órganos de la Administración del Estado, en particular su artículo 3°, conforme al cual las decisiones escritas de la Administración deben expresarse mediante actos administrativos", "pagina": 1, "offset": 1844, "id": "MM-1688-2026#1", "materias": {"Actos administrativos": {"peso": 4, "por": ["frase: Actos administrativos", "frase: actos administrativos"]}}, "normas": ["Ley 19.880"], "refs": [], "principal": false}, {"doc": "MM-1688-2026", "orden": 2, "etiqueta": "2", "texto": "Ley N° 10.336, de Organización y Atribuciones de la Contraloría General de la República, que en su artículo 16, somete a CONAF a la fiscalización de legalidad del referido órgano de control", "pagina": 1, "offset": 2198, "id": "MM-1688-2026#2", "materias": {}, "normas": ["Ley 10.336"], "refs": [], "principal": false}, {"doc": "MM-1688-2026", "orden": 3, "etiqueta": "3", "texto": "Dictamen N° E33624, de 2020, de la Contraloría General de la República, que fija doctrina vigente en cuanto a que la Corporación Nacional Forestal, aun siendo una entidad constituida bajo el derecho privado, se enmarca en el concepto de órgano creado por el Estado para el cumplimiento de la función administrativa, resultándole aplicables la Ley N° 19.880 y los principios de transparencia, probidad y publicidad", "pagina": 1, "offset": 2425, "id": "MM-1688-2026#3", "materias": {"Naturaleza jurídica de CONAF": {"peso": 4, "por": ["frase: derecho privado", "frase: función administrativa"]}}, "normas": ["Ley 19.880"], "refs": ["CGR-33624"], "principal": false}, {"doc": "MM-1688-2026", "orden": 4, "etiqueta": "4", "texto": "Informe Final de Investigación Especial N° 555/2025, de la Contraloría Regional de La Araucanía, que representa la omisión de sanción administrativa de determinados convenios de colaboración y ordena su regularización mediante el correspondiente acto administrativo", "pagina": 1, "offset": 2924, "id": "MM-1688-2026#4", "materias": {"Actos administrativos": {"peso": 7, "por": ["frase: acto administrativo", "frase: convenios de colaboración", "frase: sanción administrativa", "término: regularización"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1688-2026", "orden": 5, "etiqueta": "2", "texto": "Obligatoriedad de sancionar los convenios mediante acto administrativo: Los convenios de colaboración observados por la Contraloría -suscritos con SENAPRED (ex ONEMI), el Ejército de Chile (BRIFE) y la Fuerza Aérea de Chile- constituyen manifestaciones formales de voluntad institucional adoptadas en el ejercicio de funciones públicas, orientadas a la prevención y combate de incendios forestales, materia que se encuentra directamente vinculada a la función administrativa encomendada a CONAF por el ordenamiento jurídico. En tal contexto, se ha señalado que dichos convenios revisten el carácter de decisiones administrativas y, en consecuencia, debieron ser formalizados mediante el correspondiente acto administrativo aprobatorio, conforme a lo dispuesto en el artículo 3° de la Ley N° 19.880. La Contraloría General fue expresa en señalar que ni la naturaleza jurídica de la Corporación, ni la sola suscripción de los convenios por la autoridad competente, ni su archivo o comunicación interna, resultan suficientes para tener por cumplida la exigencia legal de formalización administrativa, motivo por el cual desestimó los argumentos institucionales y mantuvo íntegramente la observación", "pagina": 2, "offset": 4622, "id": "MM-1688-2026#5", "materias": {"Actos administrativos": {"peso": 6, "por": ["frase: acto administrativo", "frase: convenios de colaboración", "término: formalización", "término: aprobatorio"]}, "Naturaleza jurídica de CONAF": {"peso": 2, "por": ["frase: función administrativa"]}}, "normas": ["Ley 19.880"], "refs": [], "principal": false}, {"doc": "MM-1688-2026", "orden": 6, "etiqueta": "3", "texto": "Procedimiento de regularización: La regularización ordenada por la Contraloría debe materializarse mediante la dictación de actos administrativos exentos (resoluciones), emitidos por la autoridad competente de CONAF, que: Identifiquen de manera expresa el convenio respectivo, su fecha, partes y objeto; Dispongan formalmente su aprobación administrativa; Se encuentren debidamente fundados en las competencias estatutarias de la Corporación; Hagan referencia expresa al cumplimiento de lo instruido por la Contraloría General de la República. Dichos actos deberán ser registrados institucionalmente y cargados en el Sistema de Seguimiento y Apoyo al Cumplimiento de la CGR, dentro de los plazos fijados por el órgano contralor", "pagina": 2, "offset": 6050, "id": "MM-1688-2026#6", "materias": {"Actos administrativos": {"peso": 5, "por": ["frase: Actos administrativos", "frase: actos administrativos", "término: regularización"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1688-2026", "orden": 7, "etiqueta": "4", "texto": "Alcance temporal de la exigencia: La exigencia de la aprobación administrativa no tiene un carácter meramente prospectivo. Por el contrario, la Contraloría ha ordenado expresamente la regularización de convenios ya suscritos y ejecutados, en la medida que estos hayan sido observados en el proceso de fiscalización. En consecuencia: Los convenios deben ser aprobados mediante acto administrativo respectivo. Los convenios ya ejecutados, pero observados por la CGR, deben igualmente ser formalizados, a fin de subsanar la infracción y dar cumplimiento a lo ordenado por el órgano de control.", "pagina": 2, "offset": 7030, "id": "MM-1688-2026#7", "materias": {"Actos administrativos": {"peso": 3, "por": ["frase: acto administrativo", "término: regularización"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1688-2026", "orden": 8, "etiqueta": "1", "texto": "La Corporación Nacional Forestal se encuentra jurídicamente obligada a aprobar mediante acto administrativo los convenios de colaboración suscritos en el ejercicio de funciones públicas, conforme a la Ley N° 19.880 y a la jurisprudencia vigente de la Contraloría General de la República", "pagina": 3, "offset": 8289, "id": "MM-1688-2026#8", "materias": {"Actos administrativos": {"peso": 4, "por": ["frase: acto administrativo", "frase: convenios de colaboración"]}}, "normas": ["Ley 19.880"], "refs": [], "principal": true}, {"doc": "MM-1688-2026", "orden": 9, "etiqueta": "2", "texto": "Dicha obligación resulta plenamente aplicable a los convenios individualizados en el Informe Final de Investigación Especial N° 555/2025, debiendo procederse a su regularización formal", "pagina": 3, "offset": 8645, "id": "MM-1688-2026#9", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1688-2026", "orden": 10, "etiqueta": "3", "texto": "El mecanismo idóneo para dar cumplimiento a lo anterior consiste en la dictación de resolución de aprobación, debidamente fundada y registrada, los cuales deberán ser informados a la Contraloría por los canales institucionales correspondientes", "pagina": 3, "offset": 8867, "id": "MM-1688-2026#10", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-1688-2026", "orden": 11, "etiqueta": "4", "texto": "En adelante, la aprobación administrativa de los convenios deberá entenderse como un requisito esencial de validez y juridicidad del actuar institucional, en resguardo de los principios de legalidad, control, transparencia y probidad administrativa", "pagina": 3, "offset": 9164, "id": "MM-1688-2026#11", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 1, "etiqueta": "¶", "texto": "MEMORANDUM N° 2061/2026 A : JEFE-DEPARTAMENTO DE CONSERVACIÓN ECOSISTEMA BOSCOSOS Y XEROFÍTICOS OR.LRÍOS DE : DANIEL CORREA DÍAZ-FISCAL (I) FISCALÍA MATERIA: PRONUNCIAMIENTO PARA LICITACIÓN FECHA : 28/04/2026", "pagina": 1, "offset": 64, "id": "MM-2061-2026#1", "materias": {}, "normas": [], "refs": ["MM-2061-2026"], "principal": false}, {"doc": "MM-2061-2026", "orden": 2, "etiqueta": "¶", "texto": "Mediante el presente y conforme a lo solicitado mediante Memorándum N° 81/2026 por el Jefe del Departamento de Conservación de Ecosistemas Boscosos y Xerofíticos de la Región de Los Ríos, esta Fiscalía estima necesario hacer presente lo siguiente", "pagina": 1, "offset": 322, "id": "MM-2061-2026#2", "materias": {}, "normas": [], "refs": ["MM-81-2026"], "principal": false}, {"doc": "MM-2061-2026", "orden": 3, "etiqueta": "¶", "texto": "La Corporación Nacional Forestal (CONAF) se encuentra actualmente desarrollando un procedimiento de contratación pública, el cual se rige por las disposiciones de la Ley N° 19.886", "pagina": 1, "offset": 574, "id": "MM-2061-2026#3", "materias": {"Contratación pública": {"peso": 2, "por": ["frase: Contratación pública"]}}, "normas": ["Ley 19.886"], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 4, "etiqueta": "¶", "texto": "En el marco de dicho procedimiento, uno de los oferentes ha obtenido el mayor puntaje, de acuerdo con los criterios y ponderaciones establecidos en las bases administrativas y técnicas previamente aprobadas", "pagina": 1, "offset": 759, "id": "MM-2061-2026#4", "materias": {"Contratación pública": {"peso": 4, "por": ["frase: bases administrativas", "término: oferente", "término: oferentes"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 5, "etiqueta": "¶", "texto": "Ahora bien, respecto de dicho oferente, se ha constatado la existencia de un vínculo de parentesco en segundo grado de consanguinidad -específicamente, la calidad de hermano - con una funcionaria que presta servicios en la Corporación Nacional Forestal", "pagina": 1, "offset": 971, "id": "MM-2061-2026#5", "materias": {"Probidad y conflictos de interés": {"peso": 6, "por": ["frase: grado de consanguinidad", "frase: vínculo de parentesco", "término: parentesco", "término: consanguinidad"]}, "Contratación pública": {"peso": 2, "por": ["término: oferente", "término: oferentes"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 6, "etiqueta": "¶", "texto": "Cabe precisar, desde ya, que la funcionaria aludida no participa ni ha participado, ni directa ni indirectamente, en el procedimiento de contratación en análisis. No integra la comisión evaluadora, no pertenece a la unidad de compras, ni ha intervenido de modo alguno en las decisiones asociadas al proceso", "pagina": 1, "offset": 1229, "id": "MM-2061-2026#6", "materias": {"Contratación pública": {"peso": 2, "por": ["frase: comisión evaluadora"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 7, "etiqueta": "¶", "texto": "En atención a estos antecedentes, se ha solicitado a esta Fiscalía emitir un pronunciamiento en orden a determinar la procedencia jurídica de adjudicar el contrato, a la luz de lo dispuesto en el artículo 35 quáter de la Ley N.° 19.886 y de la jurisprudencia administrativa actualmente vigente", "pagina": 1, "offset": 1542, "id": "MM-2061-2026#7", "materias": {"Probidad y conflictos de interés": {"peso": 2, "por": ["frase: 35 quáter"]}}, "normas": ["Ley N"], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 8, "etiqueta": "¶", "texto": "Ley N° 19.886, de Bases sobre Contratos Administrativos de Suministro y Prestación de Servicios, en especial su Capítulo VII y, particularmente, los artículos 35 quáter y 35 sexies", "pagina": 1, "offset": 1949, "id": "MM-2061-2026#8", "materias": {"Probidad y conflictos de interés": {"peso": 4, "por": ["frase: 35 quáter", "frase: 35 sexies"]}}, "normas": ["Ley 19.886"], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 9, "etiqueta": "¶", "texto": "Oficio N° E69939/2025, de 28 de abril de 2025, de la Contraloría General de la República, que imparte instrucciones obligatorias sobre la correcta aplicación del artículo 35 quáter. La Contraloría General de la República, mediante el Dictamen N° E69939/2025, ha efectuado precisiones relevantes para el caso en análisis", "pagina": 1, "offset": 2248, "id": "MM-2061-2026#9", "materias": {"Probidad y conflictos de interés": {"peso": 2, "por": ["frase: 35 quáter"]}}, "normas": [], "refs": ["CGR-69939"], "principal": false}, {"doc": "MM-2061-2026", "orden": 10, "etiqueta": "¶", "texto": "En particular, ha señalado que la prohibición establecida en el artículo 35 quáter posee un carácter preventivo, amplio y objetivo, cuya finalidad es evitar, desde una perspectiva estructural, situaciones de conflicto de interés en los procedimientos de contratación pública", "pagina": 2, "offset": 2576, "id": "MM-2061-2026#10", "materias": {"Contratación pública": {"peso": 2, "por": ["frase: Contratación pública"]}, "Probidad y conflictos de interés": {"peso": 6, "por": ["frase: conflicto de interés", "frase: 35 quáter", "frase: prohibición establecida"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 11, "etiqueta": "¶", "texto": "Asimismo, ha precisado que la referencia a la \"misma autoridad o jefatura superior\" contenida en el inciso segundo de la norma debe entenderse referida al organismo o servicio público considerado en su conjunto. En consecuencia, no resulta jurídicamente procedente efectuar distinciones basadas en unidades internas, direcciones regionales, reparticiones específicas ni dependencias funcionales", "pagina": 2, "offset": 2853, "id": "MM-2061-2026#11", "materias": {"Probidad y conflictos de interés": {"peso": 2, "por": ["frase: jefatura superior"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 12, "etiqueta": "¶", "texto": "Finalmente, la Contraloría ha sido clara en establecer que la prohibición opera con independencia de que el funcionario o funcionaria respectiva haya participado, o no, en el procedimiento de contratación", "pagina": 2, "offset": 3250, "id": "MM-2061-2026#12", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 13, "etiqueta": "¶", "texto": "Este criterio constituye doctrina administrativa obligatoria para los órganos de la Administración del Estado, dentro de los cuales se incluye expresamente la Corporación Nacional Forestal", "pagina": 2, "offset": 3457, "id": "MM-2061-2026#13", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 14, "etiqueta": "¶", "texto": "Así, el inciso primero del artículo 35 quáter prohíbe que los organismos del Estado celebren contratos administrativos con personas que mantengan vínculos de parentesco hasta el segundo grado de consanguinidad o afinidad con funcionarios del mismo organismo", "pagina": 2, "offset": 3648, "id": "MM-2061-2026#14", "materias": {"Probidad y conflictos de interés": {"peso": 7, "por": ["frase: grado de consanguinidad", "frase: 35 quáter", "término: parentesco", "término: consanguinidad", "término: afinidad"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 15, "etiqueta": "¶", "texto": "Por su parte, el inciso segundo establece que dicha prohibición debe entenderse referida al personal que depende de la misma autoridad o jefatura superior del organismo que interviene en el procedimiento. Esta expresión, conforme a la jurisprudencia reiterada de la Contraloría General de la República, alude al servicio u organismo considerado como una unidad institucional completa", "pagina": 2, "offset": 3908, "id": "MM-2061-2026#15", "materias": {"Probidad y conflictos de interés": {"peso": 2, "por": ["frase: jefatura superior"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 16, "etiqueta": "¶", "texto": "En el caso que se analiza, el vínculo de parentesco en segundo grado de consanguinidad entre el oferente y la funcionaria se encuentra plenamente acreditado. Asimismo, ambos pertenecen al mismo organismo público, esto es, la Corporación Nacional Forestal", "pagina": 2, "offset": 4294, "id": "MM-2061-2026#16", "materias": {"Probidad y conflictos de interés": {"peso": 6, "por": ["frase: grado de consanguinidad", "frase: vínculo de parentesco", "término: parentesco", "término: consanguinidad"]}, "Contratación pública": {"peso": 2, "por": ["término: oferente", "término: oferentes"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 17, "etiqueta": "¶", "texto": "Desde esta perspectiva, resulta jurídicamente irrelevante -para efectos de la configuración de la prohibición- que la funcionaria no participe en el procedimiento de contratación, que se desempeñe en una región distinta o que no mantenga vínculo funcional alguno con la unidad de compras o con la comisión evaluadora", "pagina": 2, "offset": 4551, "id": "MM-2061-2026#17", "materias": {"Contratación pública": {"peso": 2, "por": ["frase: comisión evaluadora"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 18, "etiqueta": "¶", "texto": "De acuerdo con el criterio obligatorio fijado por la Contraloría General de la República, la concurrencia de estas circunstancias basta para que opere la prohibición establecida en el artículo 35 quáter de la Ley N.° 19.886", "pagina": 2, "offset": 4870, "id": "MM-2061-2026#18", "materias": {"Probidad y conflictos de interés": {"peso": 4, "por": ["frase: 35 quáter", "frase: prohibición establecida"]}}, "normas": ["Ley N"], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 19, "etiqueta": "¶", "texto": "Por su parte, la eventual adjudicación y posterior celebración del contrato, de realizarse en contravención a la prohibición legal señalada, expondría a la Corporación a la nulidad del contrato, conforme a lo dispuesto en el artículo 35 sexies de la Ley N.° 19.886", "pagina": 2, "offset": 5096, "id": "MM-2061-2026#19", "materias": {"Probidad y conflictos de interés": {"peso": 2, "por": ["frase: 35 sexies"]}}, "normas": ["Ley N"], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 20, "etiqueta": "¶", "texto": "Adicionalmente, dicha situación podría dar lugar a la determinación de responsabilidades administrativas respecto de los funcionarios que intervengan en la tramitación, revisión o aprobación del procedimiento de contratación", "pagina": 2, "offset": 5363, "id": "MM-2061-2026#20", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 21, "etiqueta": "¶", "texto": "El inciso cuarto del artículo 35 quáter contempla una excepción a la prohibición antes descrita, aplicable únicamente cuando concurren circunstancias excepcionales debidamente acreditadas, tales como la existencia de una escasez objetiva de proveedores u otras situaciones análogas", "pagina": 2, "offset": 5590, "id": "MM-2061-2026#21", "materias": {"Probidad y conflictos de interés": {"peso": 4, "por": ["frase: 35 quáter", "frase: escasez objetiva"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 22, "etiqueta": "¶", "texto": "Dictación de una resolución fundada por el Jefe Superior del Servicio. - Acreditación de que el contrato se ajusta a condiciones de equidad similares a las que habitualmente prevalecen en el mercado", "pagina": 2, "offset": 5987, "id": "MM-2061-2026#22", "materias": {"Actos administrativos": {"peso": 2, "por": ["frase: resolución fundada"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2061-2026", "orden": 23, "etiqueta": "¶", "texto": "Por consiguiente, en mérito de lo expuesto, y conforme a la interpretación obligatoria contenida en el Oficio E69939/2025 de la Contraloría General de la República, esta Fiscalía concluye que no resulta jurídicamente procedente adjudicar el contrato en análisis, por configurarse la prohibición establecida en el artículo 35 quáter de la Ley N.° 19.886", "pagina": 3, "offset": 6312, "id": "MM-2061-2026#23", "materias": {"Probidad y conflictos de interés": {"peso": 4, "por": ["frase: 35 quáter", "frase: prohibición establecida"]}}, "normas": ["Ley N"], "refs": [], "principal": true}, {"doc": "MM-2061-2026", "orden": 24, "etiqueta": "¶", "texto": "La única vía jurídicamente habilitante para continuar con la contratación sería la aplicación estricta, excepcional y debidamente fundada de la excepción prevista en el inciso cuarto del citado artículo", "pagina": 3, "offset": 6671, "id": "MM-2061-2026#24", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 1, "etiqueta": "¶", "texto": "MEMORANDUM N° 2665/2026 A : DIRECTOR REGIONAL (I)-DIRECCIÓN REGIONAL LOS LAGOS OR.X DE : DANIEL CORREA DÍAZ-FISCAL (I) FISCALÍA MATERIA: SOLICITA RATIFICACIÓN DEL ORDINARIO N° 237 RESPECTO A OBSERVACIONES DE ABOGADO REGIONAL EN LA MATERIA FECHA : 26/05/2026", "pagina": 1, "offset": 68, "id": "MM-2665-2026#1", "materias": {}, "normas": [], "refs": ["MM-2665-2026"], "principal": false}, {"doc": "MM-2665-2026", "orden": 2, "etiqueta": "¶", "texto": "En respuesta a su Memorándum N° 671 de 12 de mayo de 2026, que solicita a esta Fiscalía indicar si el Oficio N° 237, de fecha 24 de abril de 2026, se encuentra ajustado a derecho y ratificar la pertinencia del cumplimiento de su aplicación de acuerdo a lo instruido, puedo señalar lo siguiente", "pagina": 1, "offset": 376, "id": "MM-2665-2026#2", "materias": {}, "normas": [], "refs": ["MM-671-2026", "OF-237-2026"], "principal": false}, {"doc": "MM-2665-2026", "orden": 3, "etiqueta": "¶", "texto": "1) El Oficio 237, de la Dirección Ejecutiva de la Corporación Nacional Forestal, se dicta con el fin de homogeneizar y determinar los criterios de admisibilidad y documentación legal exigible a los interesados que presentan Planes de Manejo (PM), en el marco del de la Ley N° 20.283, sobre Recuperación del Bosque Nativo y Fomento Forestal", "pagina": 1, "offset": 676, "id": "MM-2665-2026#3", "materias": {"Planes de manejo": {"peso": 10, "por": ["frase: Planes de manejo", "frase: planes de manejo", "frase: criterios de admisibilidad", "frase: documentación legal", "término: admisibilidad", "término: interesado"]}}, "normas": ["Ley 20.283"], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 4, "etiqueta": "¶", "texto": "Distintas administraciones de CONAF, se han referido a la materia, tal como consta en el Oficio N° 464, de fecha 05 de agosto de 2023 y Oficio N° 237, de fecha 24 de abril de 2026, lo que ha seguido una lógica argumentativa respecto del tema de la documentación legal que debe solicitarse a quienes presentan planes de manejo ante la Corporación", "pagina": 1, "offset": 1022, "id": "MM-2665-2026#4", "materias": {"Planes de manejo": {"peso": 6, "por": ["frase: Planes de manejo", "frase: planes de manejo", "frase: documentación legal"]}}, "normas": [], "refs": ["OF-237-2026", "OF-464-2023"], "principal": false}, {"doc": "MM-2665-2026", "orden": 5, "etiqueta": "¶", "texto": "Lo que se hace en concreto mediante el Ord. 237 de 2026, es reiterar la instrucción contenida en el Oficio N° 464, de fecha 05 de septiembre de 2023, con el propósito de evitar la disparidad de criterios y asegurar la correcta interpretación de nuestro marco normativo, en el sentido de indicar que no resulta necesario exigir, a los titulares de las concesiones o servidumbres acreditar la titularidad del dominio del predio", "pagina": 1, "offset": 1373, "id": "MM-2665-2026#5", "materias": {}, "normas": [], "refs": ["OF-464-2023"], "principal": false}, {"doc": "MM-2665-2026", "orden": 6, "etiqueta": "¶", "texto": "Por tanto, las solicitudes de aprobación de planes de manejo deberán cumplir con los requisitos de la Ley y sus reglamentos, debiendo contener la individualización del interesado o su representante legal y la del predio, con indicación de la superficie afecta, tal como lo indica el artículo 22° del Reglamento General de la Ley N° 20.283", "pagina": 1, "offset": 1806, "id": "MM-2665-2026#6", "materias": {"Planes de manejo": {"peso": 5, "por": ["frase: Planes de manejo", "frase: planes de manejo", "término: interesado"]}}, "normas": ["Ley 20.283"], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 7, "etiqueta": "¶", "texto": "El instrumento en comento, habla de una apego estricto a la Ley y a los reglamentos vigentes al indicar que se debe exigir la documentación legal que corresponda a la calidad específica que invoca el interesado, entendiendo que los literales del artículo 22°, se aplican de forma \"alternativa\" y \"no copulativa\", como se detalla en el documento en análisis", "pagina": 1, "offset": 2151, "id": "MM-2665-2026#7", "materias": {"Planes de manejo": {"peso": 3, "por": ["frase: documentación legal", "término: interesado"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 8, "etiqueta": "¶", "texto": "Esto está en la línea de los cambios normativos que se han introducido a la Ley 20.283, al concepto de interesado, mediante la Ley 21.770, que establece una Ley Marco de Autorizaciones Sectoriales e introduce modificaciones a los cuerpos legales que indica", "pagina": 1, "offset": 2514, "id": "MM-2665-2026#8", "materias": {}, "normas": ["Ley 20.283", "Ley 21.770"], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 9, "etiqueta": "¶", "texto": "En efecto la norma modifica el artículo 2° N° 15, indicando que interesado es el propietario o poseedor en proceso de saneamiento de título del predio, titular o solicitante de algunos de los derechos indicados en los incisos cuarto y quinto del artículo 7°. De lo expuesto, queda claro que el legislador quiere distinguir las distintas situaciones jurídicas en que se encuentran los interesados que define la ley", "pagina": 1, "offset": 2776, "id": "MM-2665-2026#9", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 10, "etiqueta": "¶", "texto": "2) En cuanto a las facultades de CONAF, para dictar este tipo de actos, se funda en que como administradores de la legislación forestal, contenidas principalmente en las disposiciones del Decreto Ley N° 701, de 1974, cuyo texto definitivo fue fijado por el Decreto Ley N° 2.565, de 1979, se entrega a la Corporación una activa participación y específicas atribuciones de carácter público, en todo lo relativo al control de la corta o explotación de bosques, al fomento de la forestación y a la administración y fiscalización de la actividad forestal en Chile. A su turno, a través de la Ley N° 20.283, de 2008, otorga a la Corporación facultades públicas en materia de recuperación del bosque nativo y fomento forestal", "pagina": 2, "offset": 3196, "id": "MM-2665-2026#10", "materias": {}, "normas": ["Ley 2.565", "Ley 20.283", "Ley 701"], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 11, "etiqueta": "¶", "texto": "En este sentido, es que el Tribunal Constitucional ha señalado que CONAF es un organismo técnico que ejerce funciones públicas, según lo ha señalado reiteradamente la Contraloría General de la República", "pagina": 2, "offset": 3917, "id": "MM-2665-2026#11", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 12, "etiqueta": "¶", "texto": "A mayor abundamiento el dictamen de la Contraloría General de la República, E33624N20, de 4 de septiembre de 2020, señala que CONAF es una institución que, aunque formada bajo el derecho privado, ha sido creada por el Estado para la satisfacción de necesidades de la comunidad, con un reconocimiento legal que se consagra, precisamente a partir de la dictación del Decreto ley N° 701, de 1974, para cuyo efecto le han sido atribuidas potestades públicas, siendo financiada a través de los recursos que se consultan anualmente en la Ley de Presupuestos del Sector Público. De esta manera, y no desarrollando CONAF actividades económicas que justifiquen la exclusión del Derecho Administrativo, procede concluir que esa entidad se enmarca en el concepto de órganos y servicios públicos creados para el cumplimiento de la función administrativa", "pagina": 2, "offset": 4122, "id": "MM-2665-2026#12", "materias": {"Naturaleza jurídica de CONAF": {"peso": 10, "por": ["frase: derecho privado", "frase: potestades públicas", "frase: función administrativa", "frase: órganos y servicios públicos", "frase: necesidades de la comunidad"]}}, "normas": ["Ley 701", "Ley de Presupuestos"], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 13, "etiqueta": "¶", "texto": "Por las razones antedichas cabe también concluir que los principios constitucionales de transparencia y publicidad, como también el de probidad administrativa, previstos en el artículo 8° de la Constitución Política, resultan aplicables a la Corporación Nacional Forestal", "pagina": 2, "offset": 4966, "id": "MM-2665-2026#13", "materias": {}, "normas": ["Constitución"], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 14, "etiqueta": "¶", "texto": "Derivado de lo anterior, CONAF ha fijado sus lineamientos estratégicos o líneas de acción, bajo el fundamento que actúa bajo los principios de competencia y legalidad, consagrados en los artículos 6° y 7°, de la Carta fundamental, que disponen que los órganos del Estado deben someter su acción a la Constitución y a las normas dictadas conforme a ella, actuando válidamente previa investidura regular de sus integrantes, dentro de su competencia y en la forma que prescriba la ley", "pagina": 2, "offset": 5240, "id": "MM-2665-2026#14", "materias": {"Límites de competencia": {"peso": 2, "por": ["frase: dentro de su competencia"]}}, "normas": ["Constitución"], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 15, "etiqueta": "¶", "texto": "2) En este orden de ideas, la Directora Ejecutiva de CONAF, al dictar el Oficio 237 de 2026, actuó en el marco de las facultades de Dirección, que le otorga el Decreto N° 25, de 12 de marzo de 2026, del Presidente de la República, que la nombra como tal, y las disposiciones del artículo 18 de los Estatutos de la Corporación y 19 de su Reglamento Orgánico, sin perjuicio de las disposiciones legales pertinentes, que le otorgan la Ley N° 20.283, sobre Recuperación del Bosque Nativo y Fomento Forestal, y el Decreto Ley N° 701, de 1974, sobre Fomento Forestal", "pagina": 2, "offset": 5724, "id": "MM-2665-2026#15", "materias": {}, "normas": ["Decreto 25", "Ley 20.283", "Ley 701"], "refs": ["OF-237-2026"], "principal": false}, {"doc": "MM-2665-2026", "orden": 16, "etiqueta": "¶", "texto": "Como ya se indicó el artículo 18 de los Estatutos de CONAF, entrega a la Directora Ejecutiva, atribuciones para emitir las instrucciones antes mencionadas, tal como lo establece el Título Sexto de ese cuerpo normativo, específicamente en su artículo 18, letras p y q, que señalan, corresponderá al Director Ejecutivo", "pagina": 2, "offset": 6287, "id": "MM-2665-2026#16", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 17, "etiqueta": "¶", "texto": "p) Conocer y resolver, en general, todo asunto relacionado con los intereses y fines de la Corporación que no estén entregados al Consejo Directivo o al Presidente", "pagina": 2, "offset": 6606, "id": "MM-2665-2026#17", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 18, "etiqueta": "¶", "texto": "q) Cumplir y hacer cumplir las instrucciones y orientaciones gubernamentales en materia forestal, de conservación del patrimonio silvestre y de prevención y combate de incendios", "pagina": 2, "offset": 6774, "id": "MM-2665-2026#18", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 19, "etiqueta": "¶", "texto": "Por lo expuesto, queda de manifiesto que el Oficio 237, como su denominación lo señala, es una directriz interna que orienta en relación a los criterios de aplicación para solicitudes de Planes De Manejo, según el tipo de Interesado, De conformidad con la Ley N° 20.283 y su Reglamento y la Ley N° 21.770. 3) En cuanto a la representación que hacen el Abogado Francisco Urrutia mediante el memorándum N° 670, de 12 de mayo de 2026 y la Jefa Provincial de Chiloé mediante el Memorándum N° 93, de esa misma fecha, al referirse a un recurso jerárquico, el artículo 61 del D.F.L. N° 29, que fija el texto refundido, coordinado y sistematizado de la Ley N° 18.834, sobre Estatuto Administrativo, dispone que Serán obligaciones de cada funcionario, letra f) Obedecer las órdenes impartidas por el superior jerárquico", "pagina": 2, "offset": 6954, "id": "MM-2665-2026#19", "materias": {"Planes de manejo": {"peso": 7, "por": ["frase: Planes de manejo", "frase: planes de manejo", "frase: tipo de interesado", "término: interesado"]}, "Procedimiento administrativo": {"peso": 2, "por": ["frase: recurso jerárquico"]}}, "normas": ["Ley 18.834", "Ley 20.283", "Ley 21.770"], "refs": ["MM-670-2026"], "principal": false}, {"doc": "MM-2665-2026", "orden": 20, "etiqueta": "¶", "texto": "Por su parte, el artículo 62, del mismo cuerpo normativo señala que en el caso a que se refiere la letra f) del artículo anterior, si el funcionario estimare ilegal una orden deberá representarla por escrito, y si el superior la reitera en igual forma, aquél deberá cumplirla, quedando exento de toda responsabilidad, la cual recaerá por entero en el superior que hubiere insistido en la orden. Tanto el funcionario que representare la orden, como el superior que la reiterare, enviarán copia de las comunicaciones mencionadas a la jefatura superior correspondiente, dentro de los cinco días siguientes contados desde la fecha de la última de estas comunicaciones", "pagina": 3, "offset": 7774, "id": "MM-2665-2026#20", "materias": {"Probidad y conflictos de interés": {"peso": 2, "por": ["frase: jefatura superior"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2665-2026", "orden": 21, "etiqueta": "¶", "texto": "4) En conclusión, esta Fiscalía estima que el Oficio N° 237, de fecha 24 de abril de 2026, se encuentra ajustado a derecho y su contenido se encuentra plenamente vigente para los trabajadores de CONAF, ya que da orientaciones internas de cuáles son los criterios de admisibilidad y documentación legal exigible a los interesados que presentan Planes de Manejo (PM), en el marco del de la Ley N° 20.283, sobre Recuperación del Bosque Nativo y Fomento Forestal", "pagina": 3, "offset": 8447, "id": "MM-2665-2026#21", "materias": {"Planes de manejo": {"peso": 10, "por": ["frase: Planes de manejo", "frase: planes de manejo", "frase: criterios de admisibilidad", "frase: documentación legal", "término: admisibilidad", "término: interesado"]}}, "normas": ["Ley 20.283"], "refs": ["OF-237-2026"], "principal": true}, {"doc": "MM-2665-2026", "orden": 22, "etiqueta": "¶", "texto": "5) En mérito de lo expuesto, se da respuesta a su requerimiento con el objeto de que actúe en consecuencia y de respuesta a los documentos indicados en su comunicación", "pagina": 3, "offset": 8914, "id": "MM-2665-2026#22", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-2698-2026", "orden": 1, "etiqueta": "II", "texto": "CONCLUSIÓN En atención a la normativa señalada anteriormente, esta unidad asesora puede señalar que la intervención de los ejemplares de Araucaria araucana plantados en el predio de Vilcún es legalmente factible, al considerar que, por su origen antrópico, se excluyen del régimen de protección del D.S. N° 43/1990. No obstante, dada la especial protección introducida por la Ley N° 21.600 y la ubicación del predio dentro del Parque Nacional Conguillío, se requiere", "pagina": 2, "offset": 5312, "id": "MM-2698-2026#1", "materias": {"Monumentos naturales": {"peso": 5, "por": ["frase: origen antrópico", "término: araucaria", "término: araucana", "término: plantados"]}, "Áreas silvestres protegidas": {"peso": 3, "por": ["frase: parque nacional", "término: conguillío"]}}, "normas": ["DS 43", "Ley 21.600"], "refs": [], "principal": true}, {"doc": "MM-2698-2026", "orden": 2, "etiqueta": "II", "texto": "La materialización de la intervención (traslado o construcción de obras) mediante la presentación y aprobación de un Plan de Manejo de Plantaciones", "pagina": 2, "offset": 5798, "id": "MM-2698-2026#2", "materias": {"Planes de manejo": {"peso": 4, "por": ["frase: plan de manejo", "frase: plan de manejo de plantaciones"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-3129-2022", "orden": 1, "etiqueta": "¶", "texto": "MEMORANDUM N° 3129/2022 A : JEFE-DEPARTAMENTO PLANIFICACIÓN Y CONTROL DE GESTIÓN DE : CARMEN PAZ MEDINA PARRA - FISCAL FISCALIA MATERIA: PRONUNCIAMIENTO SOBRE PROTECCIÓN DE DATOS DE TERCEROS FECHA : 24/06/2022", "pagina": 1, "offset": 223, "id": "MM-3129-2022#1", "materias": {"Protección de datos personales": {"peso": 2, "por": ["frase: protección de datos"]}}, "normas": [], "refs": ["MM-3129-2022"], "principal": false}, {"doc": "MM-3129-2022", "orden": 2, "etiqueta": "¶", "texto": "En Chile el derecho a la intimidad se encuentra reconocido en el artículo 19 N° 4 de la Constitución que asegura el \"respeto y protección a la vida privada y a la honra de la persona y su familia\" y por la Ley 19.628 sobre protección de la vida privada protección de datos de carácter personal", "pagina": 1, "offset": 1182, "id": "MM-3129-2022#2", "materias": {"Protección de datos personales": {"peso": 5, "por": ["frase: protección de datos", "frase: vida privada", "término: intimidad"]}}, "normas": ["Constitución", "Ley 19.628"], "refs": [], "principal": false}, {"doc": "MM-3129-2022", "orden": 3, "etiqueta": "¶", "texto": "La artículo 2° de la Ley N° 19.628 define datos personales como aquellos relativos a cualquier información concerniente a personas naturales, identificadas o identificables (art. 2° f), a diferencia de los datos estadísticos que son aquellos que, en su origen, o como consecuencia de su tratamiento, no pueden ser asociados a un titular identificado o identificable (art. 2° e). Conforme esta definición, cabe dentro de la definición de datos personales el nombre, teléfono de contacto y correo electrónico de una persona", "pagina": 1, "offset": 1530, "id": "MM-3129-2022#3", "materias": {"Protección de datos personales": {"peso": 2, "por": ["frase: datos personales"]}}, "normas": ["Ley 19.628"], "refs": [], "principal": false}, {"doc": "MM-3129-2022", "orden": 4, "etiqueta": "¶", "texto": "Luego, el Artículo 9° de la Ley N° 19.628, indica que \"los datos personales deben utilizarse sólo para los fines para los cuales hubieren sido recolectados, salvo que provengan o se hayan recolectado de fuentes accesibles al público\", prohibiendo explícitamente su entrega a terceros para otras finalidades", "pagina": 1, "offset": 2132, "id": "MM-3129-2022#4", "materias": {"Protección de datos personales": {"peso": 4, "por": ["frase: datos personales", "frase: fuentes accesibles"]}}, "normas": ["Ley 19.628"], "refs": [], "principal": false}, {"doc": "MM-3129-2022", "orden": 5, "etiqueta": "¶", "texto": "En el mismo orden de ideas, el artículo 20 de la Ley N° 19.628, restringe el tratamiento de datos por parte de entidades públicas a las materias que sean de competencia de cada organismo y \"con sujeción a las reglas precedentes\"", "pagina": 1, "offset": 2493, "id": "MM-3129-2022#5", "materias": {}, "normas": ["Ley 19.628"], "refs": [], "principal": false}, {"doc": "MM-3129-2022", "orden": 6, "etiqueta": "¶", "texto": "Como se puede apreciar la N° 19.628, establece una serie de principios para el tratamiento de datos personales, todos los cuales se aplican a la administración pública. Dentro de los cuales se encuentra", "pagina": 1, "offset": 2763, "id": "MM-3129-2022#6", "materias": {"Protección de datos personales": {"peso": 2, "por": ["frase: datos personales"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-3129-2022", "orden": 7, "etiqueta": "¶", "texto": "a. El principio de licitud que deriva de los artículos 2°, 4° incisos 1° y 6°, y según el cual el tratamiento sólo cabe si existe autorización legal o de parte del titular, debiendo en este último caso tratarse de un consentimiento expreso. b. El principio de finalidad de los datos, que fluye del art. 9°, y conforme al cual debe respetarse la finalidad para la que fueron recogidos los datos, de manera que exista una relación directa entre aquella y el dato recabado", "pagina": 1, "offset": 3007, "id": "MM-3129-2022#7", "materias": {"Protección de datos personales": {"peso": 4, "por": ["frase: consentimiento expreso", "frase: principio de finalidad"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-3129-2022", "orden": 8, "etiqueta": "¶", "texto": "c. El principio de confidencialidad que se aplica cuando se trata de datos obtenidos de fuentes no accesibles al público según el art. 7°", "pagina": 2, "offset": 3839, "id": "MM-3129-2022#8", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-3129-2022", "orden": 9, "etiqueta": "¶", "texto": "En el caso en análisis, el fin para el cual se requiere la información es un estudio de satisfacción usuaria de los servicios que presta CONAF a la ciudadanía, el cual servirá para su evaluación y mejora, por lo que estaríamos en presencia de una última etapa de los servicios otorgados. En razón de aquello, corresponde la entrega de la información idónea para el cumplimiento de dicha finalidad, pero se sugiere aportar solo el nombre y correo electrónico de los usuarios", "pagina": 2, "offset": 4018, "id": "MM-3129-2022#9", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-3129-2022", "orden": 10, "etiqueta": "cita", "texto": "Finalmente, se recomienda no dar acceso a los números telefónicos de los usuarios por resultar
