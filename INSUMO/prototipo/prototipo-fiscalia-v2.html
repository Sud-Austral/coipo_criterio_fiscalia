peso": 5, "por": ["frase: orden de compra", "término: adjudicación", "término: adjudicatario", "término: cotización"]}, "Actos administrativos": {"peso": 2, "por": ["frase: acto administrativo"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-751-2021", "orden": 4, "etiqueta": "¶", "texto": "Dado lo anteriormente mencionado, es que el Departamento de Abastecimiento solicita la orientación de esta Fiscalía para tener claridad sobre qué documento está definido como acto administrativo, en vista que el convenio solicita adjuntar dos actos administrativos", "pagina": 1, "offset": 2296, "id": "MM-751-2021#4", "materias": {"Actos administrativos": {"peso": 6, "por": ["frase: Actos administrativos", "frase: acto administrativo", "frase: actos administrativos"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-751-2021", "orden": 5, "etiqueta": "¶", "texto": "Revisados y analizados los antecedentes, esto es, Bases de Convenio Marco ID 2239-4-LR20, Guía de uso de comprador y su presentación, esta Fiscalía, hace presente que", "pagina": 1, "offset": 2602, "id": "MM-751-2021#5", "materias": {"Contratación pública": {"peso": 2, "por": ["frase: convenio marco"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-751-2021", "orden": 6, "etiqueta": "¶", "texto": "1. El artículo 1 de la Ley 19.886 de Bases sobre contratos administrativos de suministro y prestación de servicios, establece que \"Los contratos que celebre la Administración del Estado, a título oneroso, para el suministro de bienes muebles, y de los servicios que se requieran para el desarrollo de sus funciones, se ajustarán a las normas y principios del presente cuerpo legal y de su reglamentación. Supletoriamente, se les aplicarán las normas de Derecho Público y, en defecto de aquéllas, las normas de Derecho Privado\"", "pagina": 1, "offset": 2798, "id": "MM-751-2021#6", "materias": {"Naturaleza jurídica de CONAF": {"peso": 2, "por": ["frase: derecho privado"]}}, "normas": ["Ley 19.886"], "refs": [], "principal": false}, {"doc": "MM-751-2021", "orden": 7, "etiqueta": "¶", "texto": "2. De esta manera, el artículo 3 de la Ley 19.880 de Bases de los procedimientos administrativos que rigen los actos de los Órganos de la Administración del Estado, se refiere al Concepto de Acto Administrativo, indicando que: \"Las decisiones escritas que adopte la Administración se expresarán por medio de actos administrativos.", "pagina": 1, "offset": 3404, "id": "MM-751-2021#7", "materias": {"Actos administrativos": {"peso": 6, "por": ["frase: Actos administrativos", "frase: acto administrativo", "frase: actos administrativos"]}}, "normas": ["Ley 19.880"], "refs": [], "principal": false}, {"doc": "MM-751-2021", "orden": 8, "etiqueta": "¶", "texto": "Para efectos de esta ley se entenderá por acto administrativo las decisiones formales que emitan los órganos de la Administración del Estado en las cuales se contienen declaraciones de voluntad, realizadas en el ejercicio de una potestad pública\"", "pagina": 2, "offset": 4027, "id": "MM-751-2021#8", "materias": {"Fiscalización forestal": {"peso": 2, "por": ["frase: potestad pública"]}, "Actos administrativos": {"peso": 4, "por": ["frase: acto administrativo", "frase: declaraciones de voluntad"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-751-2021", "orden": 9, "etiqueta": "¶", "texto": "Define el decreto supremo como una orden escrita del Presidente de la República o de un Ministro \"por orden del Presidente\" sobre asuntos de su competencia", "pagina": 2, "offset": 4415, "id": "MM-751-2021#9", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-751-2021", "orden": 10, "etiqueta": "¶", "texto": "Agrega también la norma, que son actos administrativos los dictámenes o declaraciones de juicio, constancia o conocimiento que realicen los órganos de la Administración en el ejercicio de sus competencias", "pagina": 2, "offset": 4747, "id": "MM-751-2021#10", "materias": {"Actos administrativos": {"peso": 4, "por": ["frase: Actos administrativos", "frase: actos administrativos"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-751-2021", "orden": 11, "etiqueta": "¶", "texto": "En su inciso final el artículo 3 de la Ley 19.880 señala que los actos administrativos gozan de una presunción de legalidad, de imperio y exigibilidad frente a sus destinatarios, desde su entrada en vigencia, autorizando su ejecución de oficio de oficio por la autoridad administrativa, salvo que mediare una orden de suspensión dispuesta por la autoridad administrativa dentro del procedimiento impugnatorio o por el juez, conociendo por la vía jurisdiccional", "pagina": 2, "offset": 4993, "id": "MM-751-2021#11", "materias": {"Actos administrativos": {"peso": 6, "por": ["frase: Actos administrativos", "frase: actos administrativos", "frase: presunción de legalidad"]}}, "normas": ["Ley 19.880"], "refs": [], "principal": false}, {"doc": "MM-751-2021", "orden": 12, "etiqueta": "¶", "texto": "En virtud de lo expuesto, esta Fiscalía entiende que en el caso en comento se deben adjuntar dos resoluciones fundadas: una que apruebe la evaluación técnica y otra que apruebe la evaluación económica en conjunto con la adjudicación, la cual se firme por la autoridad que tenga las facultades correspondientes en la Corporación, Gerente de Finanzas y Administración o Jefe de Departamento de Abastecimiento, considerando que el Convenio Marco, materia de esta consulta, tiene por objetivo realizar contrataciones de desarrollos y/o mantención de software y servicios profesionales TI para proyectos tecnológicos de los organismos públicos, cuyos montos sean entre 30 y 500 UTM, a través de una cotización. Lo anterior, mientras no se reciba una instrucción clara en contrario", "pagina": 2, "offset": 5534, "id": "MM-751-2021#12", "materias": {"Contratación pública": {"peso": 4, "por": ["frase: convenio marco", "término: adjudicación", "término: cotización"]}, "Actos administrativos": {"peso": 2, "por": ["frase: resoluciones fundadas"]}}, "normas": [], "refs": [], "principal": true}, {"doc": "MM-751-2021", "orden": 13, "etiqueta": "¶", "texto": "Finalmente, esta Fiscalía adjunta dos propuestas en borrador de las resoluciones que se requerirían, para los comentarios y ajustes que se estimen necesarios", "pagina": 2, "offset": 6429, "id": "MM-751-2021#13", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-751-2021", "orden": 14, "etiqueta": "¶", "texto": "Incl.:Documento Digital: 1. PROPUESTA BORRADOR APRUEBA EVALUACIÓN TÉCNICA Documento Digital: 2. PROPUESTA BORR APRUEBA E ECONOMICA Y ADJUDICA", "pagina": 2, "offset": 6941, "id": "MM-751-2021#14", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-862-2021", "orden": 1, "etiqueta": "¶", "texto": "MEMORANDUM N° 862/2021 A : GERENTE (S)-GERENCIA DE FISCALIZACIÓN Y EVALUACIÓN AMBIENTAL DE : FERNANDO LLONA MÁRQUEZ - FISCAL FISCALIA MATERIA: SE PRONUNCIA SOBRE POSIBILIDAD DE CONTRATAR SERVICIOS PROFESIONALES DE FISCALIZADOR FECHA : 23/02/2021", "pagina": 1, "offset": 228, "id": "MM-862-2021#1", "materias": {"Fiscalización forestal": {"peso": 2, "por": ["término: fiscalizador", "término: fiscalizadores"]}}, "normas": [], "refs": ["MM-862-2021"], "principal": false}, {"doc": "MM-862-2021", "orden": 2, "etiqueta": "¶", "texto": "Mediante Memorándum N°113/2021, de 12 de febrero de 2021, la Jefa (I) del Departamento de Fiscalización y Evaluación Ambiental de la región del Maule, solicitó una autorización a la Gerencia de Fiscalización y Evaluación Ambiental para licitar los servicios profesionales de un Ingeniero Forestal que contribuya al cumplimiento de las diferentes acciones de fiscalización, en el ámbito de la protección y/o conservación de los recursos forestales de la región, señalando la disponibilidad presupuestaria para ello", "pagina": 1, "offset": 600, "id": "MM-862-2021#2", "materias": {"Fiscalización forestal": {"peso": 2, "por": ["frase: acciones de fiscalización"]}}, "normas": [], "refs": ["MM-113-2021"], "principal": false}, {"doc": "MM-862-2021", "orden": 3, "etiqueta": "¶", "texto": "Seguidamente, la Gerenta de Fiscalización y Evaluación Ambiental, mediante Memorándum N°714/2021, de 15 de febrero de 2021, ha consultado a esta Fiscalía acerca de la procedencia de dicha contratación pues se trataría de funciones permanentes que, según indica, sólo pueden desarrollar funcionarios de la institución, los que además poseen el carácter de Ministros de Fe, en el caso de Ley de Bosque Nativo", "pagina": 1, "offset": 1194, "id": "MM-862-2021#3", "materias": {"Fiscalización forestal": {"peso": 2, "por": ["frase: ministros de fe"]}}, "normas": [], "refs": ["MM-714-2021"], "principal": false}, {"doc": "MM-862-2021", "orden": 4, "etiqueta": "¶", "texto": "Sobre el tema consultado y revisados los antecedentes aportados por la Gerencia, esta Fiscalía ha efectuado un análisis desde diversos puntos de vista, asociado a las normativas que aplican al caso en particular", "pagina": 1, "offset": 1668, "id": "MM-862-2021#4", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-862-2021", "orden": 5, "etiqueta": "¶", "texto": "Conforme a los Estatutos de la Corporación Nacional Forestal, su objeto es contribuir a la conservación, incremento, manejo y aprovechamiento de los recursos forestales y áreas silvestres protegidas del país, señalándose que -especialmente- debe cumplir con aquellos mandatos que diversas Leyes y Reglamentos le han entregado (artículo 3 letra i). Asimismo, dentro de sus objetivos está el procurar el adecuado manejo y aprovechamiento de los bosques que se establezcan por acción directa o indirecta de la Corporación, y de aquellos cuya administración le corresponda, velando por la eficiente comercialización de los productos que se obtengan (artículo 3°, letra d)", "pagina": 1, "offset": 1981, "id": "MM-862-2021#5", "materias": {"Áreas silvestres protegidas": {"peso": 2, "por": ["frase: Áreas silvestres protegidas"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-862-2021", "orden": 6, "etiqueta": "¶", "texto": "En consonancia con lo anterior, diversos cuerpos normativos han encomendado a CONAF cumplir funciones de carácter público que hoy desarrolla, entre las cuales se encuentran las normas que le asignan responsabilidades relativas a la administración y protección de las Áreas Silvestres Protegidas del Estado delegada por la Ley de Bosques (Decreto N° 4.363, de 1931, del Ministerio de Tierras y Colonización); a la prevención y combate de incendios forestales, a saber, Decreto Supremo N° 733, de 1982, del Ministerio del Interior; y al desarrollo, protección, control y fiscalización de la forestación, manejo, explotación y reforestación de la masa forestal del país, mediante el DL 701, de 1974, de fomento forestal y la ley N° 20.283, de 2008, sobre recuperación de bosque nativo y fomento forestal", "pagina": 1, "offset": 2755, "id": "MM-862-2021#6", "materias": {"Áreas silvestres protegidas": {"peso": 2, "por": ["frase: Áreas silvestres protegidas"]}}, "normas": ["DL 701", "Decreto 4.363", "Ley 20.283"], "refs": [], "principal": false}, {"doc": "MM-862-2021", "orden": 7, "etiqueta": "¶", "texto": "En atención a lo indicado, cobra especial relevancia para el presente análisis lo establecido en el artículo 47 de la ley 20.283, que señala que los \"funcionarios\" designados por la Corporación para la fiscalización de la ley tiene el carácter de ministros de fe en todas las actuaciones que deban realizar para el cumplimiento de esa labor", "pagina": 2, "offset": 3915, "id": "MM-862-2021#7", "materias": {"Fiscalización forestal": {"peso": 2, "por": ["frase: ministros de fe"]}}, "normas": ["Ley 20.283"], "refs": [], "principal": false}, {"doc": "MM-862-2021", "orden": 8, "etiqueta": "¶", "texto": "Luego, el artículo 45 del Reglamento General de la referida ley (D.S. 93, de 2008, de MINAGRI), señala que la designación de los funcionarios de la Corporación será realizada mediante Resolución del Director Ejecutivo, debiendo remitirse el listado de fiscalizadores a los tribunales competentes. En este sentido, CONAF ha procedido a designar a las personas encargadas de la labor fiscalizadora antes mencionada, a través de sucesivas resoluciones que se envían a los Tribunales de Justicia", "pagina": 2, "offset": 4306, "id": "MM-862-2021#8", "materias": {"Fiscalización forestal": {"peso": 4, "por": ["frase: labor fiscalizadora", "término: fiscalizador", "término: fiscalizadores"]}}, "normas": ["DS 93"], "refs": [], "principal": false}, {"doc": "MM-862-2021", "orden": 9, "etiqueta": "¶", "texto": "Asimismo, es necesario tener presente que la Contraloría General de la República ha señalado en su reciente Dictamen N°33.624/2020, que CONAF no obstante ser una institución formada bajo el derecho privado, ha sido creada por el Estado para la satisfacción de necesidades de la comunidad, concluyendo que la Corporación se enmarca en el concepto de órganos y servicios públicos creados para el cumplimiento de la función administrativa", "pagina": 2, "offset": 4872, "id": "MM-862-2021#9", "materias": {"Naturaleza jurídica de CONAF": {"peso": 8, "por": ["frase: derecho privado", "frase: función administrativa", "frase: órganos y servicios públicos", "frase: necesidades de la comunidad"]}}, "normas": [], "refs": ["CGR-33624"], "principal": false}, {"doc": "MM-862-2021", "orden": 10, "etiqueta": "¶", "texto": "De conformidad con lo anterior, los funcionarios fiscalizadores de CONAF, entendiendo por ello a todos aquellos que, de conformidad a lo indicado han sido designados como tales por la autoridad, ejercen una función pública, la cual los obliga a velar por la eficiente e idónea administración de los medios públicos, por el debido cumplimiento de la función pública que realizan y con respeto al principio de probidad administrativa", "pagina": 2, "offset": 5370, "id": "MM-862-2021#10", "materias": {"Fiscalización forestal": {"peso": 2, "por": ["término: fiscalizador", "término: fiscalizadores"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-862-2021", "orden": 11, "etiqueta": "¶", "texto": "En consecuencia, los funcionarios de CONAF que realizan la labor fiscalizadora lo hacen de conformidad a la ley, y los procedimientos que se utilizan para designar fiscalizadores apuntan a la necesidad de fortalecer el actuar de la Corporación, toda vez que los funcionarios o funcionarias designados como fiscalizadores, gozan de la presunción de veracidad ante los Tribunales de Justicia, obligando al presunto infractor a acreditar sus dichos en el procedimiento infraccional respectivo", "pagina": 2, "offset": 5864, "id": "MM-862-2021#11", "materias": {"Fiscalización forestal": {"peso": 7, "por": ["frase: presunción de veracidad", "frase: labor fiscalizadora", "término: fiscalizador", "término: fiscalizadores", "término: infraccional"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-862-2021", "orden": 12, "etiqueta": "¶", "texto": "El Reglamento de la ley 19.886 de Compras Públicas (D.S. 250/ 2004, del Ministerio de Hacienda) regula la posibilidad de que los servicios de la administración el Estado puedan contratar servicios personales y profesionales. En efecto, en el artículo 105 del referido Reglamento señala que los Servicios Personales son aquellos que en su ejecución demandan un intensivo desarrollo intelectual, y los Servicios Personales Especializados son aquéllos para \"cuya realización se requiere una preparación especial, en una determinada ciencia, arte o actividad, de manera que quien los provea o preste, sea experto, tenga conocimientos, o habilidades muy específicas. Generalmente, son intensivos en desarrollo intelectual, inherente a las personas que prestarán los servicios, siendo particularmente importante la comprobada competencia técnica para la ejecución exitosa del servicio requerido. Es el caso de anteproyectos de Arquitectura o Urbanismo y proyectos de Arquitectura o Urbanismo que consideren especialidades, proyectos de arte o diseño; proyectos tecnológicos o de comunicaciones sin oferta estándar en el mercado; asesorías en estrategia organizacional o comunicacional; asesorías especializadas en ciencias naturales o sociales; asistencia jurídica especializada y la capacitación con especialidades únicas en el mercado, entre otros\"", "pagina": 2, "offset": 6503, "id": "MM-862-2021#12", "materias": {"Contratación pública": {"peso": 2, "por": ["frase: compras públicas"]}}, "normas": ["DS 250", "Ley 19.886"], "refs": [], "principal": false}, {"doc": "MM-862-2021", "orden": 13, "etiqueta": "¶", "texto": "De la lectura se puede inferir que los servicios a los cuales, de manera genérica se refiere el citado artículo, no entregan un amplio abanico de actividades, sino más bien parece referirse a aspectos que no son propios de ser desarrollados por el giro habitual de un determinado servicio. Luego, el propio reglamento, en su artículo 106 precisa y enfatiza que cada entidad será responsable de clasificar los servicios a contratar según sus características en servicios personales y servicios personales especializados, haciendo la siguiente precisión: \"La resolución que apruebe las bases de licitación o autorice el trato directo, según corresponda, deberá expresar los motivos que justifican la clasificación de un servicio como especializado y las razones por las cuales esas funciones no puedan ser realizadas por personal de la propia entidad\"", "pagina": 2, "offset": 8030, "id": "MM-862-2021#13", "materias": {"Contratación pública": {"peso": 4, "por": ["frase: bases de licitación", "frase: trato directo"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-862-2021", "orden": 14, "etiqueta": "¶", "texto": "En razón de esto, no se aprecia en las Bases de la Licitación una adecuada justificación de las razones para contratar a un profesional fiscalizador por esta vía. En opinión de esta Fiscalía, no es suficiente que el objeto de la contratación sea la contribución al desarrollo de actividades de fiscalización en la región, ya que para ello, la Dirección Regional, en el ejercicio de las facultades delegadas por el Director Ejecutivo, puede destinar al cumplimiento de las actividades de fiscalización el recurso profesional y humano existente en la región, a través de una adecuada gestión del personal que tiene a su cargo y bajo su dependencia", "pagina": 3, "offset": 9244, "id": "MM-862-2021#14", "materias": {"Fiscalización forestal": {"peso": 2, "por": ["término: fiscalizador", "término: fiscalizadores"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-862-2021", "orden": 15, "etiqueta": "¶", "texto": "Uno de los aspectos centrales de la función pública, es que los funcionarios que desarrollan la función administrativa la deben ejecutar personalmente, lo que se conoce como dedicación al cargo. Luego, en ciertas ocasiones se permite la delegación de funciones, esto es, entregar ciertas, precisas y determinadas atribuciones jurídicas con que se ha sido habilitado por la Constitución y/o leyes para el ejercicio de las funciones que han sido encomendadas por aquellas al ente o persona jurídica de la cual dicho órgano es parte (SOTO KLOSS, 1989). De esto se puede señalar que la delegación de funciones, si bien es una forma común de operar en la administración pública, se ejerce dentro ciertos límites que el derecho administrativo ha desarrollado, y que ciertamente no propende a externalizar los servicios", "pagina": 3, "offset": 10042, "id": "MM-862-2021#15", "materias": {"Transparencia y acceso a la información": {"peso": 2, "por": ["frase: persona jurídica"]}, "Naturaleza jurídica de CONAF": {"peso": 2, "por": ["frase: función administrativa"]}}, "normas": ["Constitución"], "refs": [], "principal": false}, {"doc": "MM-862-2021", "orden": 16, "etiqueta": "¶", "texto": "En el sentido señalado, la Contraloría General de República se ha referido a esta materia mediante Dictamen N° 9.527/2013, en que señala que resulta improcedente la externalización de la función de inspección (de una municipalidad), ya que según se indica, \"las entidades edilicias deben observar los principios de control y probidad administrativa, que exigen, en lo que interesa, el empleo de medios idóneos de diagnóstico, decisión y control, para concretar, dentro del orden jurídico, una gestión eficiente y eficaz, en relación con el cabal y oportuno cumplimiento de las obligaciones contraídas por quienes prestan servicios a los municipios, que inciden, especialmente, en la satisfacción de las necesidades de la comunidad local\"", "pagina": 3, "offset": 10974, "id": "MM-862-2021#16", "materias": {"Naturaleza jurídica de CONAF": {"peso": 2, "por": ["frase: necesidades de la comunidad"]}}, "normas": [], "refs": ["CGR-9527"], "principal": false}, {"doc": "MM-862-2021", "orden": 17, "etiqueta": "¶", "texto": "Del mismo modo, puede citarse el Dictamen N°12.528/1996 que señala que \"las labores de inspección técnica de las obras deben cumplirse con personal del propio servicio. Ello, porque no procede encomendar a terceros, extraños a la administración, tareas que, como la indicada, son inherentes a la función pública, por relacionarse con el directo resguardo de los intereses del Estado, razón por la cual sólo puede ser ejercida por personas que posean la calidad de funcionarios integrantes de la dotación del órgano público de que se trate.\"", "pagina": 3, "offset": 11818, "id": "MM-862-2021#17", "materias": {}, "normas": [], "refs": ["CGR-12528"], "principal": false}, {"doc": "MM-862-2021", "orden": 18, "etiqueta": "¶", "texto": "En consecuencia, esta Fiscalía se pronuncia en el sentido de que no procede la contratación de servicios profesionales de un Ingeniero Forestal en la región del Maule para efectuar acciones de fiscalización en el ámbito de la protección y/o conservación de los recursos forestales de la región, pues no obstante contar con los recursos presupuestarios, no es factible encomendar un servicio de esta naturaleza a terceros que no están en la dotación, pues la actividad de fiscalización de la legislación forestal es una potestad pública, propia y privativa de la Corporación Nacional Forestal, conforme a los mandatos que las leyes le han encomendado. Ref. 123", "pagina": 3, "offset": 12438, "id": "MM-862-2021#18", "materias": {"Fiscalización forestal": {"peso": 4, "por": ["frase: acciones de fiscalización", "frase: potestad pública"]}}, "normas": [], "refs": [], "principal": true}, {"doc": "MM-3171-2026", "orden": 1, "etiqueta": "¶", "texto": "MEMORANDUM N° 3171/2026 A : SEGÚN DISTRIBUCIÓN DE : AIDA BALDINI URRUTIA-DIRECTORA EJECUTIVA CORPORACIÓN NACIONAL FORESTAL MATERIA: INSTRUCCIONES HORAS EXTRAORDINARIAS PERSONAL CON TELETRABAJO. FECHA : 17/06/2026", "pagina": 1, "offset": 212, "id": "MM-3171-2026#1", "materias": {"Gestión de personas": {"peso": 3, "por": ["frase: horas extraordinarias", "término: teletrabajo"]}}, "normas": [], "refs": ["MM-3171-2026"], "principal": false}, {"doc": "MM-3171-2026", "orden": 2, "etiqueta": "¶", "texto": "En relación con la modalidad de teletrabajo vigente en la Corporación para aquellos/as trabajadores/as que se desempeñan bajo este régimen, se informa que, a partir del mes de julio próximo, las solicitudes de trabajo extraordinario serán autorizadas únicamente para el personal que cumpla funciones en modalidad 100% presencial. Ello, dado que, con anterioridad, estaban asignadas para el personal que mantenía una modalidad mixta en aquellas jornadas que desempeñaban presencialmente", "pagina": 1, "offset": 566, "id": "MM-3171-2026#2", "materias": {"Gestión de personas": {"peso": 4, "por": ["frase: trabajo extraordinario", "término: teletrabajo", "término: presencialidad"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-3171-2026", "orden": 3, "etiqueta": "¶", "texto": "Lo anterior significa que, para efectos de la asignación de horas extraordinarias planificadas, éstas se otorgarán únicamente al personal que asista presencialmente a la Corporación durante toda su jornada laboral. Por consiguiente, no serán consideradas las solicitudes correspondientes a trabajadores/as que mantengan modalidades mixtas de trabajo con uno o más días de teletrabajo", "pagina": 1, "offset": 1132, "id": "MM-3171-2026#3", "materias": {"Gestión de personas": {"peso": 6, "por": ["frase: horas extraordinarias", "frase: jornada laboral", "término: teletrabajo", "término: presencialidad"]}}, "normas": [], "refs": [], "principal": true}, {"doc": "MM-3171-2026", "orden": 4, "etiqueta": "¶", "texto": "Esta medida corresponde a una disposición interna alineada con los ajustes presupuestarios adoptados por la Institución, en consideración al actual escenario fiscal", "pagina": 1, "offset": 1583, "id": "MM-3171-2026#4", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-3171-2026", "orden": 5, "etiqueta": "¶", "texto": "Finalmente, se solicita a todas las Gerencias, Direcciones Regionales y Unidades Asesoras adoptar las medidas necesarias para asegurar el cumplimiento de esta instrucción", "pagina": 1, "offset": 1776, "id": "MM-3171-2026#5", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "OF-440-2026", "orden": 1, "etiqueta": "¶", "texto": "ORD.N°: 440/2026 ANT. : NO HAY. MAT. : SOLICITA SE PRONUNCIE SOBRE LA APLICABILIDAD DE LA LEY N° 21.645, DE CONCILIACIÓN DE LA VIDA PERSONAL, FAMILIAR Y LABORAL, Y SU VARIABLE DE TRABAJO A DISTANCIAL AL PERSONAL DE CONAF FUTURO SERNAFOR", "pagina": 1, "offset": 216, "id": "OF-440-2026#1", "materias": {}, "normas": ["LEY 21.645"], "refs": [], "principal": false}, {"doc": "OF-440-2026", "orden": 2, "etiqueta": "¶", "texto": "Esta Dirección Ejecutiva viene en solicitar a ese Organismo de Control un pronunciamiento relativo a la aplicación de la Ley N° 21.645, de Conciliación de la Vida Personal, Familiar y Laboral, que protege a quienes realizan labores de cuidado no remunerado, otorgando el derecho al teletrabajo, feriado preferente en vacaciones escolares y banda horaria flexible, aplicable tanto para madres y padres como para personas cuidadoras, al personal de esta Corporación en consideración a los antecedentes que a continuación se indican", "pagina": 1, "offset": 1456, "id": "OF-440-2026#2", "materias": {"Gestión de personas": {"peso": 6, "por": ["frase: labores de cuidado", "frase: cuidado no remunerado", "término: teletrabajo", "término: cuidadoras"]}}, "normas": ["Ley 21.645"], "refs": [], "principal": false}, {"doc": "OF-440-2026", "orden": 3, "etiqueta": "¶", "texto": "La Corporación Nacional Forestal, si bien, se trata de una institución formada bajo el derecho privado, ha sido creada por el Estado para la satisfacción de necesidades de la comunidad, con un reconocimiento legal que se consagra, precisamente a partir de la dictación del decreto ley N° 701, de 1974, para cuyo efecto le han sido atribuidas potestades públicas, siendo financiada a través de los recursos que se consultan anualmente en la Ley de Presupuestos del Sector Público. De esta manera, y no desarrollando, CONAF, actividades económicas que justifiquen la exclusión del derecho administrativo, se ha concluido que esta entidad se enmarca en el concepto de órganos y servicios públicos creados para el cumplimiento de la función administrativa (Contraloría General de la República Dictamen N° 33624 de 2020)", "pagina": 1, "offset": 2066, "id": "OF-440-2026#3", "materias": {"Naturaleza jurídica de CONAF": {"peso": 10, "por": ["frase: derecho privado", "frase: potestades públicas", "frase: función administrativa", "frase: órganos y servicios públicos", "frase: necesidades de la comunidad"]}}, "normas": ["Ley 701", "Ley de Presupuestos"], "refs": ["CGR-33624"], "principal": false}, {"doc": "OF-440-2026", "orden": 4, "etiqueta": "¶", "texto": "Asimismo, esta Corporación se encuentra incluida en la nómina de entidades del artículo 1° del Decreto Ley N° 249, de 1974 y, por ende, se encuentra sujeta a la Escala Única de Sueldos y a las además disposiciones que dicho cuerpo legal establece", "pagina": 1, "offset": 3001, "id": "OF-440-2026#4", "materias": {}, "normas": ["Ley 249"], "refs": [], "principal": false}, {"doc": "OF-440-2026", "orden": 5, "etiqueta": "¶", "texto": "En lo que respecta a la condición jurídica del personal, la Corporación Nacional Forestal mantiene -actualmente- trabajadores de dotación permanente cuya jornada ordinaria, jornada extraordinaria, feriado legal y remuneraciones, entre otras materias, están afectos a las normas del Decreto Ley N° 249, de 1974, ya mencionado, y normas complementarias, aplicándoseles", "pagina": 1, "offset": 3289, "id": "OF-440-2026#5", "materias": {}, "normas": ["Ley 249"], "refs": [], "principal": false}, {"doc": "OF-440-2026", "orden": 6, "etiqueta": "¶", "texto": "Ahora bien, la Dirección Ejecutiva de la época respecto de la Ley N° 21.645, instruyó su plena aplicación en aras de entregar derechos a mujeres y hombres que desarrollan responsabilidades de cuidado, con el objetivo de promover la corresponsabilidad y propender el teletrabajo para trabajadores padres, madres o cuidadores de un niño o niña menores de 14 años; trabajadores padres, madres o cuidadores de adolescentes menores de 18 años que estén en situación de discapacidad o dependencia severa o moderada; y, trabajadores que tengan a su cuidado personas con discapacidad o en situación de dependencia severa o moderada, sin ser remunerado por esa labor de cuidado. Todo, debiendo ser acreditado con la documentación pertinente (Dictamen N° 67/01, de 26 de enero de 2024, de la Dirección del Trabajo)", "pagina": 2, "offset": 4247, "id": "OF-440-2026#6", "materias": {}, "normas": ["Ley 21.645"], "refs": [], "principal": false}, {"doc": "OF-440-2026", "orden": 7, "etiqueta": "¶", "texto": "Por su parte, la Dirección del Trabajo en Dictamen N° 1949/032, de 05 de agosto de 2021, se pronunció respecto que el personal de la Corporación Nacional Forestal podrá desempeñar funciones bajo la modalidad de trabajo a distancia o teletrabajo, en cuyo caso se encontrarán afectos, en cuanto a la extensión y distribución de la jornada, a lo dispuesto en el artículo 21 del Decreto Ley N° 249, de 1974, correspondiendo aplicar supletoriamente, en aquello que carezca de una regulación especial en materia de descanso y jornada, las normas establecidas en el Capítulo IV del Libro I del Código del Trabajo. Lo anterior, respecto a la aplicación de la Ley N° 21.220, que modificó el Código del Trabajo en materia de trabajo a distancia, al personal permanente de CONAF", "pagina": 2, "offset": 5184, "id": "OF-440-2026#7", "materias": {"Gestión de personas": {"peso": 3, "por": ["frase: trabajo a distancia", "término: teletrabajo"]}}, "normas": ["Código del Trabajo", "Ley 21.220", "Ley 249"], "refs": ["CGR-1949"], "principal": false}, {"doc": "OF-440-2026", "orden": 8, "etiqueta": "¶", "texto": "En específico, la Dirección del Trabajo a través del Oficio N° 355, de 229 de mayo de 2025, dispuso, entre otros, que los criterios establecidos unilateralmente por la Corporación Nacional Forestal en la pauta de aplicación, para la combinación de tiempos de trabajo presencial y a distancia, no se ajustan a derecho, por cuanto atentan contra la posibilidad de que la persona trabajadora realice una propuesta que se ajuste a sus necesidades, de acuerdo con su responsabilidad de cuidado no remunerado al tenor de lo dispuesto en el artículo 152 quáter O bis del Código del Trabajo, a saber \"El empleador deberá ofrecer a la persona trabajadora que, durante la vigencia de la relación laboral, tenga el cuidado personal de un niño o niña menor de catorce años o que tenga a su cargo el cuidado de una persona con discapacidad o en situación de dependencia severa o moderada, no importando la edad de quien se cuida, sin recibir remuneración por dicha actividad, que todo o parte de su jornada diaria o semanal pueda ser desarrollada bajo modalidad de trabajo a distancia o teletrabajo, en la medida que la naturaleza de sus funciones lo permita\"", "pagina": 2, "offset": 6071, "id": "OF-440-2026#8", "materias": {"Gestión de personas": {"peso": 8, "por": ["frase: trabajo a distancia", "frase: cuidado no remunerado", "frase: relación laboral", "término: teletrabajo", "término: presencialidad"]}}, "normas": ["Código del Trabajo"], "refs": [], "principal": false}, {"doc": "OF-440-2026", "orden": 9, "etiqueta": "¶", "texto": "Lo anterior, ha suscitado, consecuentemente, que la autoridad de la época haya dispuesto el derecho a solicitar el trabajo a distancia o teletrabajo, en base a una modalidad combinada de trabajo presencial y fuera de las instalaciones de la Corporación, por sobre los tres días hábiles a la semana, en contraposición a lo instruido en el Dictamen N° 443357, de 24 de enero de 2024, de ese Órgano de Control que -expresamente- indica que \"quienes se beneficien del aludido teletrabajo deben hacerlo en las condiciones establecidas expresamente en la citada ley N°21.652, lo que significa que deben cumplir al menos tres jornadas diarias presenciales en las dependencias institucionales dentro de la jornada semanal. Ello, toda vez que el legislador no contempló la circunstancia de tener el cuidado de niños o niñas menores de 14 años o de una persona con dependencia severa como una eximente de la apuntada exigencia de presencialidad, sino que, como se ha señalado, solamente ha previsto que constituya un factor de prelación en la selección del personal que se acogerá al régimen de teletrabajo, de acuerdo con lo dispuesto en el artículo 102 de la ley N° 21.647\"", "pagina": 2, "offset": 7389, "id": "OF-440-2026#9", "materias": {"Gestión de personas": {"peso": 4, "por": ["frase: trabajo a distancia", "término: teletrabajo", "término: presencialidad"]}}, "normas": ["Ley 21.647", "Ley 21.652"], "refs": ["CGR-443357"], "principal": false}, {"doc": "OF-440-2026", "orden": 10, "etiqueta": "¶", "texto": "A mayor abundamiento, la Ley N° 21.744, creó el Servicio Nacional Forestal (SERNAFOR), continuador y sucesor legal de la Corporación Nacional Forestal, como un será un servicio público descentralizado, con personalidad jurídica y patrimonio propios, sometido a la supervigilancia del Presidente de la República a través del Ministerio de Agricultura", "pagina": 2, "offset": 8726, "id": "OF-440-2026#10", "materias": {}, "normas": ["Ley 21.744"], "refs": [], "principal": false}, {"doc": "OF-440-2026", "orden": 11, "etiqueta": "¶", "texto": "A su respecto, el artículo 10° de la Ley N° 21.744, señala, en su inciso primero, que \"El personal del Servicio se regirá por las normas del Código del Trabajo, por las disposiciones del decreto ley N° 249, de 1974, que Fija Escala Única de Sueldos para el personal que señala, y por las", "pagina": 2, "offset": 9130, "id": "OF-440-2026#11", "materias": {}, "normas": ["Código del Trabajo", "Ley 21.744", "Ley 249"], "refs": [], "principal": false}, {"doc": "OF-440-2026", "orden": 12, "etiqueta": "¶", "texto": "En base a lo expuesto, esta Corporación solicita a ese Organismo de Control se pronuncie sobre la aplicabilidad de la Ley N° 21.645, de Conciliación de la Vida Personal, Familiar y Laboral, en orden a dictaminar si procede su aplicación íntegra al personal de CONAF futuro SERNAFOR, y por sobre todo, si es procedente otorgar el aludido teletrabajo o trabajo a distancia, por sobre las tres jornadas diarias presenciales que debiese cumplir el personal en las dependencias institucionales dentro de la jornada semanal, es decir, la ausencia del trabajador de la sede institucional por sobre los tres días dentro de la jornada semanal", "pagina": 3, "offset": 10636, "id": "OF-440-2026#12", "materias": {"Gestión de personas": {"peso": 4, "por": ["frase: trabajo a distancia", "término: teletrabajo", "término: presencialidad"]}}, "normas": ["Ley 21.645"], "refs": [], "principal": true}, {"doc": "OF-440-2026", "orden": 13, "etiqueta": "¶", "texto": "Finalmente, a juicio de esta Corporación resulta fundamental destacar que sus actividades se encuentran amparadas por los principios de transparencia y probidad, los que cuentan con la publicidad requerida para los actos administrativos, por lo que esta Dirección Ejecutiva seguirá trabajando para fortalecer dicha gestión, con el objeto de que todas sus actuaciones se enmarquen en los procedimientos administrativos correspondientes, en el marco de la legalidad vigente coherente con una administración del Estado oportuna que hace pública sus actuaciones dentro del marco de sus competencias, como elemento trascendental respecto de las garantías fundamentales", "pagina": 3, "offset": 11363, "id": "OF-440-2026#13", "materias": {"Actos administrativos": {"peso": 4, "por": ["frase: Actos administrativos", "frase: actos administrativos"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "OF-442-2026", "orden": 1, "etiqueta": "¶", "texto": "ORD.N°: 442/2026 ANT. : PARTIDA 13, GLOSA 11 LEY DE PRESUPUESTOS AÑO 2026 MAT. : INFORMA ACCIONES DE LA CORPORACIÓN NACIONAL FORESTAL PARA HACER FRENTE AL ATAQUE DE PERROS ASILVESTRADOS A LA FAUNA SILVESTRE", "pagina": 1, "offset": 216, "id": "OF-442-2026#1", "materias": {"Áreas silvestres protegidas": {"peso": 5, "por": ["frase: fauna silvestre", "frase: perros asilvestrados", "término: asilvestrados"]}}, "normas": ["LEY DE PRESUPUESTOS"], "refs": [], "principal": false}, {"doc": "OF-442-2026", "orden": 2, "etiqueta": "¶", "texto": "En cumplimiento de lo establecido en la Ley de Presupuestos del Sector Público para el año 2026, específicamente en la Partida 13, Glosa N° 11, esta Corporación remite la información relativa a las acciones y coordinaciones desarrolladas para abordar la problemática de los ataques de perros asilvestrados a la fauna silvestre y a ovinos de propiedad de agricultores, a nivel nacional", "pagina": 1, "offset": 1347, "id": "OF-442-2026#2", "materias": {"Áreas silvestres protegidas": {"peso": 5, "por": ["frase: fauna silvestre", "frase: perros asilvestrados", "término: asilvestrados"]}}, "normas": ["Ley de Presupuestos"], "refs": [], "principal": false}, {"doc": "OF-442-2026", "orden": 3, "etiqueta": "¶", "texto": "En este contexto, se ha ordenado y sistematizado la base de datos adjunta, la cual reúne las estrategias de gestión y control que serán implementadas durante el presente año para enfrentar la amenaza que representan los perros dentro de las áreas protegidas. Cabe señalar que las acciones de control ejecutadas durante el año son consolidadas metodológicamente en el mes de abril del año siguiente, razón por la cual los resultados correspondientes al año 2026 estarán disponibles y podrán ser reportados a partir de abril de 2027", "pagina": 1, "offset": 1799, "id": "OF-442-2026#3", "materias": {"Áreas silvestres protegidas": {"peso": 2, "por": ["frase: áreas protegidas"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "OF-442-2026", "orden": 4, "etiqueta": "¶", "texto": "Asimismo, la Corporación Nacional Forestal (CONAF) mantiene un registro sistemático de amenazas, entre ellas la presencia de perros, mediante la plataforma SMART, herramienta que permite el monitoreo y seguimiento estandarizado de estos eventos. En este marco, se adjunta la base de datos de registros correspondiente al período comprendido entre abril y junio de 2026", "pagina": 1, "offset": 2410, "id": "OF-442-2026#4", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "OF-442-2026", "orden": 5, "etiqueta": "¶", "texto": "Finalmente, cabe precisar que los ataques a ovinos de propiedad de agricultores constituyen una materia de competencia del Servicio Agrícola y Ganadero (SAG), por lo que su gestión, seguimiento y reporte se encuentran dentro del ámbito de las atribuciones de dicho servicio", "pagina": 1, "offset": 2846, "id": "OF-442-2026#5", "materias": {}, "normas": [], "refs": [], "principal": true}, {"doc": "OF-444-2026", "orden": 1, "etiqueta": "¶", "texto": "ORD.N°: 444/2026 ANT. : NO HAY. MAT. : SOLICITA SE PRONUNCIE SOBRE LA APLICACIÓN DE LA ASIGNACIÓN DE FUNCIÓN DIRECTIVA DE LA LEY N° 20.300, EN COMPLEMENTO DE LA REMUNERACIÓN DE LA DIRECTORA EJECUTIVA DE LA CORPORACIÓN NACIONAL FORESTAL", "pagina": 1, "offset": 216, "id": "OF-444-2026#1", "materias": {"Remuneraciones": {"peso": 2, "por": ["frase: función directiva"]}}, "normas": ["LEY 20.300"], "refs": [], "principal": false}, {"doc": "OF-444-2026", "orden": 2, "etiqueta": "¶", "texto": "Esta Dirección Ejecutiva viene en solicitar a esa Comisión para la Fijación de Remuneraciones un pronunciamiento relativo a la aplicación de la Ley N° 20.300, que reforzó los estímulos al desempeño del personal de la Corporación Nacional Forestal en la remuneración de la Directora Ejecutiva de ese organismo, en consideración a los antecedentes que a continuación se indican", "pagina": 1, "offset": 1580, "id": "OF-444-2026#2", "materias": {"Remuneraciones": {"peso": 2, "por": ["frase: fijación de remuneraciones"]}}, "normas": ["Ley 20.300"], "refs": [], "principal": false}, {"doc": "OF-444-2026", "orden": 3, "etiqueta": "¶", "texto": "La Corporación Nacional Forestal, si bien, se trata de una institución formada bajo el derecho privado, ha sido creada por el Estado para la satisfacción de necesidades de la comunidad, con un reconocimiento legal que se consagra, precisamente a partir de la dictación del decreto ley N° 701, de 1974, para cuyo efecto le han sido atribuidas potestades públicas, siendo financiada a través de los recursos que se consultan anualmente en la Ley de Presupuestos del Sector Público. De esta manera, y no desarrollando, CONAF, actividades económicas que justifiquen la exclusión del derecho administrativo, se ha concluido que esta entidad se enmarca en el concepto de órganos y servicios públicos creados para el cumplimiento de la función administrativa (Contraloría General de la República Dictamen N° 33624 de 2020)", "pagina": 1, "offset": 2010, "id": "OF-444-2026#3", "materias": {"Naturaleza jurídica de CONAF": {"peso": 10, "por": ["frase: derecho privado", "frase: potestades públicas", "frase: función administrativa", "frase: órganos y servicios públicos", "frase: necesidades de la comunidad"]}}, "normas": ["Ley 701", "Ley de Presupuestos"], "refs": ["CGR-33624"], "principal": false}, {"doc": "OF-444-2026", "orden": 4, "etiqueta": "¶", "texto": "Asimismo, esta Corporación se encuentra incluida en la nómina de entidades del artículo 1° del Decreto Ley N° 249, de 1974 y, por ende, se encuentra sujeta a la Escala Única de Sueldos y a las además disposiciones que dicho cuerpo legal establece", "pagina": 1, "offset": 2945, "id": "OF-444-2026#4", "materias": {}, "normas": ["Ley 249"], "refs": [], "principal": false}, {"doc": "OF-444-2026", "orden": 5, "etiqueta": "¶", "texto": "En lo que respecta a la condición jurídica del personal, la Corporación Nacional Forestal mantiene -actualmente- trabajadores de dotación permanente, como es el caso de la Directora Ejecutiva de CONAF, cuya jornada ordinaria, jornada extraordinaria, feriado legal y remuneraciones, entre otras materias, están afectos a las normas del Decreto Ley N° 249, de 1974, ya mencionado, y normas complementarias, aplicándoseles subsidiariamente las normas", "pagina": 1, "offset": 3233, "id": "OF-444-2026#5", "materias": {}, "normas": ["Ley 249"], "refs": [], "principal": false}, {"doc": "OF-444-2026", "orden": 6, "etiqueta": "¶", "texto": "A este respecto, la Ley N° 20.300, que reforzó los estímulos al desempeño del personal dispuso que, a contar del 1 de enero de 2008, para el personal permanente perteneciente a la dotación máxima de personal que anualmente fije la Ley de Presupuestos a la Corporación Nacional Forestal, una asignación de estímulo a la eficiencia institucional", "pagina": 2, "offset": 4265, "id": "OF-444-2026#6", "materias": {"Remuneraciones": {"peso": 2, "por": ["frase: asignación de estímulo"]}}, "normas": ["Ley 20.300", "Ley de Presupuestos"], "refs": [], "principal": false}, {"doc": "OF-444-2026", "orden": 7, "etiqueta": "¶", "texto": "En específico, el artículo 4° de ese cuerpo legal establece que, a contar del 1 de enero de 2008, para el personal de la Corporación Nacional Forestal que desempeñe la función de Director Ejecutivo, Gerente, Fiscal y Director Regional, una asignación de estímulo a la función directiva, asociada al cumplimiento de metas conforme a lo establecido en los incisos quinto y sexto del presente artículo", "pagina": 2, "offset": 4663, "id": "OF-444-2026#7", "materias": {"Remuneraciones": {"peso": 4, "por": ["frase: asignación de estímulo", "frase: función directiva"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "OF-444-2026", "orden": 8, "etiqueta": "¶", "texto": "Asimismo, agrega que esa asignación será tributable e imponible para efectos de salud y pensiones, se pagará mensualmente y será inherente al desempeño de las funciones mencionadas a los cargos indicados precedentemente e incompatible con la percepción de cualquier emolumento, pago o beneficio económico de origen público o privado, distinto del que contempla el régimen de remuneraciones aplicable a la Corporación Nacional Forestal, exceptuándose de esa incompatibilidad, la percepción de los beneficios de seguridad social de carácter irrenunciable; los emolumentos que provengan de la administración de su patrimonio, del desempeño de la docencia prestada a instituciones educacionales y de la integración de directorios o consejos de empresas o entidades del Estado, con la salvedad de que los mencionados trabajadores no podrán integrar más de un directorio o consejo de empresas o entidades del Estado, con derecho a percibir dieta o remuneración. La asignación se percibirá mientras se ejerza la función específica que la fundamenta", "pagina": 2, "offset": 5129, "id": "OF-444-2026#8", "materias": {"Remuneraciones": {"peso": 4, "por": ["término: imponible", "término: emolumento", "término: emolumentos", "término: dieta"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "OF-444-2026", "orden": 9, "etiqueta": "¶", "texto": "A mayor abundamiento, el monto de la asignación de estímulo a la función directiva se determinará aplicando, para el caso de la Directora Ejecutiva, de un porcentaje del 40% sobre la suma del sueldo base; las asignaciones establecidas los artículos 18 y 19 de la Ley N° 19.185, en las modalidades a que se refieren ambos incisos de estas disposiciones; y la asignación del artículo 6° del decreto Ley N° 1.770, de 1977, cuando proceda", "pagina": 2, "offset": 6329, "id": "OF-444-2026#9", "materias": {"Remuneraciones": {"peso": 6, "por": ["frase: asignación de estímulo", "frase: función directiva", "frase: sueldo base"]}}, "normas": ["Ley 1.770", "Ley 19.185"], "refs": [], "principal": false}, {"doc": "OF-444-2026", "orden": 10, "etiqueta": "¶", "texto": "Ahora bien, la Resolución N° 5, de 11 de septiembre de 2024, estableció un Sistema de Remuneraciones conforme al artículo 38 Bis de la Constitución Política de la República, que materializó la reforma constitucional aprobada por medio de la Ley N° 21.233, que introdujo cambios en la determinación de las remuneraciones de ciertas autoridades y funcionarios, creando, a su vez, una comisión cuyo funcionamiento, organización, funciones y atribuciones mandató a regular a través de una ley orgánica constitucional", "pagina": 2, "offset": 6831, "id": "OF-444-2026#10", "materias": {}, "normas": ["Constitución", "Ley 21.233"], "refs": ["RES-5-2024"], "principal": false}, {"doc": "OF-444-2026", "orden": 11, "etiqueta": "¶", "texto": "Asimismo, esa reforma modificó la forma de fijación de las remuneraciones y dietas de los funcionarios de exclusiva confianza del Presidente de la República, como es el caso de la especie de la Directora Ejecutiva de CONAF, fijando un sistema de remuneraciones que se inició el 11 de marzo de 2026. En particular, la aludida Resolución N° 5/2024, resolvió en su Punto N° 15 \"Director de la Corporación Nacional Forestal: percibirá mensualmente como remuneración bruta única y total $6.268.674\"", "pagina": 2, "offset": 7424, "id": "OF-444-2026#11", "materias": {"Remuneraciones": {"peso": 3, "por": ["frase: remuneración bruta", "término: dieta"]}}, "normas": [], "refs": ["RES-5-2024"], "principal": false}, {"doc": "OF-444-2026", "orden": 12, "etiqueta": "¶", "texto": "En base a lo expuesto, esta Corporación solicita a esa Comisión para la Fijación de Remuneraciones se pronuncie sobre la aplicabilidad de la Ley N° 20.300, en particular, si procede pagar la asignación de función directiva dispuesta en el artículo 4° de ese cuerpo legal a la Directora Ejecutiva de CONAF, en complemento de la remuneración fijada en el Punto N° 15 de la Resolución N° 5, de 2024, de esa Comisión", "pagina": 2, "offset": 7998, "id": "OF-444-2026#12", "materias": {"Remuneraciones": {"peso": 4, "por": ["frase: función directiva", "frase: fijación de remuneraciones"]}}, "normas": ["Ley 20.300"], "refs": ["RES-5-2024"], "principal": true}, {"doc": "OF-444-2026", "orden": 13, "etiqueta": "¶", "texto": "Finalmente, a juicio de esta Corporación resulta fundamental destacar que sus actividades se encuentran amparadas por los principios de transparencia y probidad, los que cuentan con la publicidad requerida para los actos administrativos, por lo que esta Dirección Ejecutiva seguirá trabajando para fortalecer dicha gestión, con el objeto de que todas sus actuaciones se enmarquen en los procedimientos administrativos correspondientes, en el marco de la legalidad vigente coherente con una administración del Estado oportuna que hace pública sus", "pagina": 2, "offset": 8478, "id": "OF-444-2026#13", "materias": {"Actos administrativos": {"peso": 4, "por": ["frase: Actos administrativos", "frase: actos administrativos"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 1, "etiqueta": "1", "texto": "Que la Corporación Nacional Forestal es una corporación de derecho privado que ejerce funciones de naturaleza pública, constituyendo el órgano público de carácter técnico del Estado en materia forestal, cuyo objeto conforme a sus Estatutos es contribuir a la conservación, incremento, manejo y aprovechamiento de los recursos forestales y áreas protegidas del país y cuya a misión es garantizar la conservación, restauración y el manejo sustentable de los ecosistemas boscosos y xerofíticos del país, para satisfacer la demanda actual y futura por bienes y servicios ecosistémicos y contribuir al desarrollo territorial, de los pueblos originarios, las comunidades vulnerables y la valoración de la biodiversidad en un escenario de crisis climática", "pagina": 1, "offset": 1638, "id": "RES-884-2026#1", "materias": {"Áreas silvestres protegidas": {"peso": 2, "por": ["frase: áreas protegidas"]}, "Naturaleza jurídica de CONAF": {"peso": 4, "por": ["frase: corporación de derecho privado", "frase: derecho privado"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 2, "etiqueta": "2", "texto": "Que a la Dirección Ejecutiva le corresponde velar por la dirección superior, organización y correcta administración de los bienes y recursos institucionales, asegurando su debido resguardo, conservación y cuidado", "pagina": 1, "offset": 2452, "id": "RES-884-2026#2", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 3, "etiqueta": "3", "texto": "Que la Contraloría General de la República, mediante el Dictamen N° D263/2026 de fecha 07 de mayo de 2026, procedió a reconsiderar y complementar la jurisprudencia administrativa en torno a la ocupación de viviendas fiscales (artículo 91 del Estatuto Administrativo), instruyendo perentoriamente a las jefaturas de servicio a dictar o actualizar sus normativas, reglamentos o protocolos internos sobre la materia en un plazo no superior a 60 días hábiles", "pagina": 1, "offset": 2688, "id": "RES-884-2026#3", "materias": {"Gestión de personas": {"peso": 2, "por": ["frase: viviendas fiscales"]}, "Bienes institucionales": {"peso": 3, "por": ["frase: viviendas fiscales", "término: viviendas"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 4, "etiqueta": "4", "texto": "Que el citado Órgano Contralor determinó que es indispensable regular de manera interna aspectos tales como las condiciones transversales de mantención y cuidado, plazos máximos de utilización de las viviendas para evitar su perpetuidad, monitoreo del pago de consumos básicos y las causales fundadas para el cese del beneficio, con el objeto de conciliar este derecho con los principios de equidad, transparencia y eficiente gestión de los recursos públicos", "pagina": 2, "offset": 3183, "id": "RES-884-2026#4", "materias": {"Bienes institucionales": {"peso": 3, "por": ["frase: consumos básicos", "término: viviendas"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 5, "etiqueta": "5", "texto": "Que en atención a dicho mandato legal y a las directrices de regularización impartidas por la Dirección Ejecutiva en el Memorándum N° 2914/2026, la Gerencia de Finanzas y Administración efectuó un levantamiento de la asignación de viviendas fiscales de CONAF y procedió a elaborar un instrumento técnico denominado \"Protocolo de Asignación, Uso y Restitución de Viviendas Fiscales\" (Julio 2026)", "pagina": 2, "offset": 3662, "id": "RES-884-2026#5", "materias": {"Gestión de personas": {"peso": 2, "por": ["frase: viviendas fiscales"]}, "Bienes institucionales": {"peso": 6, "por": ["frase: viviendas fiscales", "frase: uso y restitución", "término: viviendas", "término: restitución"]}}, "normas": [], "refs": ["MM-2914-2026"], "principal": false}, {"doc": "RES-884-2026", "orden": 6, "etiqueta": "6", "texto": "Que el mencionado protocolo tiene por finalidad estandarizar y dotar de absoluta transparencia a los procesos de postulación, asignación, deberes de habitabilidad, mecanismos de fiscalización y restitución de las viviendas de propiedad o bajo administración de CONAF utilizadas por su personal, ajustándose íntegramente a las directrices vigentes y al Reglamento Interno de Orden Higiene y Seguridad de CONAF", "pagina": 2, "offset": 4074, "id": "RES-884-2026#6", "materias": {"Bienes institucionales": {"peso": 3, "por": ["término: habitabilidad", "término: viviendas", "término: restitución"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 7, "etiqueta": "7", "texto": "Que se ha establecido como directrices regulatorias obligatorias y transversales para toda asignación, tenencia y entrega de los inmuebles institucionales, las siguientes condiciones recogidas en el protocolo aprobado", "pagina": 2, "offset": 4500, "id": "RES-884-2026#7", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 8, "etiqueta": "a", "texto": "Formalización del Beneficio: Toda asignación o término de uso de viviendas deberá disponerse mediante un acto administrativo fundado (resolución), formalizándose de manera estricta a través de convenios de uso, anexos de contrato y la suscripción de un Acta Formal de Recepción e Inventario Detallado", "pagina": 2, "offset": 4738, "id": "RES-884-2026#8", "materias": {"Actos administrativos": {"peso": 3, "por": ["frase: acto administrativo", "término: formalización"]}, "Bienes institucionales": {"peso": 3, "por": ["frase: inventario detallado", "término: viviendas"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 9, "etiqueta": "b", "texto": "Temporalidad y Renovación: Las viviendas situadas fuera de Áreas Protegidas (AP) se asignarán por un plazo máximo de 3 años, tras los cuales el funcionario deberá someterse a una evaluación interna para su eventual renovación. En Áreas Protegidas, la ocupación subsistirá mientras se mantengan las necesidades operativas de la función asignada", "pagina": 2, "offset": 5080, "id": "RES-884-2026#9", "materias": {"Áreas silvestres protegidas": {"peso": 2, "por": ["frase: áreas protegidas"]}}, "normas": [], "refs": [], "principal": true}, {"doc": "RES-884-2026", "orden": 10, "etiqueta": "c", "texto": "Cobro por Ocupación: El beneficio estará sujeto a un descuento mensual equivalente al 10% del sueldo base del trabajador, lo que deberá registrarse expresamente en el convenio o anexo contractual respectivo", "pagina": 2, "offset": 5474, "id": "RES-884-2026#10", "materias": {"Remuneraciones": {"peso": 2, "por": ["frase: sueldo base"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 11, "etiqueta": "d", "texto": "Consumos y Gastos Básicos: Los gastos derivados de servicios básicos (luz, agua, gas, gastos comunes u otros similares) serán de cargo íntegro del ocupante. Para acreditar su cumplimiento, este deberá presentar de forma mensual ante el Departamento de Finanzas regional los comprobantes de pago debidamente cancelados", "pagina": 2, "offset": 5713, "id": "RES-884-2026#11", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 12, "etiqueta": "e", "texto": "Deberes y Conservación del Entorno: Los beneficiarios quedan obligados a efectuar las mantenciones periódicas del inmueble e incorporar estrictas medidas de silvicultura preventiva en el entorno silvestre para mitigar riesgos de incendios", "pagina": 2, "offset": 6081, "id": "RES-884-2026#12", "materias": {"Bienes institucionales": {"peso": 2, "por": ["frase: silvicultura preventiva"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 13, "etiqueta": "f", "texto": "Causales de Restitución: El beneficio cesará de pleno derecho por desvinculación laboral, traslado de localidad, adquisición de vivienda propia en la zona (por el funcionario o su cónyuge), falta de ocupación efectiva, uso comercial o traspaso no autorizado a terceros, o por vencimiento del plazo máximo establecido sin renovación", "pagina": 2, "offset": 6352, "id": "RES-884-2026#13", "materias": {"Bienes institucionales": {"peso": 2, "por": ["término: viviendas", "término: restitución"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 14, "etiqueta": "8", "texto": "Que el Reglamento Interno de Orden Higiene y Seguridad de CONAF establece en su Título XIX las condiciones para la entrega de una casa fiscal para uso de trabajadores y trabajadoras, señalando la entrega es en comodato o préstamo de uso, de acuerdo a condiciones para el uso exclusivo de los trabajadores y trabajadoras, de su familia directa y estableciendo otras condiciones para este beneficio", "pagina": 2, "offset": 6725, "id": "RES-884-2026#14", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 15, "etiqueta": "1", "texto": "APRUÉBASE el documento interno denominado \"Protocolo de Asignación, Uso y Restitución de Viviendas Fiscales\" 2026, de la Corporación Nacional Forestal, adjunto y que se entiende forma parte integrante de la presente resolución", "pagina": 3, "offset": 7271, "id": "RES-884-2026#15", "materias": {"Gestión de personas": {"peso": 2, "por": ["frase: viviendas fiscales"]}, "Bienes institucionales": {"peso": 6, "por": ["frase: viviendas fiscales", "frase: uso y restitución", "término: viviendas", "término: restitución"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 16, "etiqueta": "2", "texto": "DESÍGNASE a la Gerencia de Finanzas y Administración, y a través de ella a las respectivas Direcciones Regionales, como las contrapartes encargadas del control, fiscalización, monitoreo periódico y seguimiento técnico del cumplimiento de las obligaciones económicas y de conservación contenidas en el presente instrumento", "pagina": 3, "offset": 7524, "id": "RES-884-2026#16", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "RES-884-2026", "orden": 17, "etiqueta": "3", "texto": "INSTRÚYASE a todas las Gerencias y Direcciones Regionales de la Corporación a una estricta observancia y aplicación del protocolo aprobado mediante este acto", "pagina": 3, "offset": 7880, "id": "RES-884-2026#17", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "CPLT-C7949-21", "orden": 1, "etiqueta": "1", "texto": "SOLICITUD DE ACCESO: El 7 de noviembre de 2021, la Agrupación Cultural por los Humedales y Entornos Naturales solicitó a la Corporación Nacional Forestal y de Protección de Recursos Naturales Renovables -en adelante e indistintamente, CONAF-lo siguiente: \"copia solicitud 125/200-7/21 presentado por inmobiliaria alto volcanes SpA, en representación de compañía de seguros de vida consorcio nacional de seguros S.A. y sus copias de las resoluciones por parte de Conaf\"", "pagina": 2, "offset": 3482, "id": "CPLT-C7949-21#1", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "CPLT-C7949-21", "orden": 2, "etiqueta": "2", "texto": "RESPUESTA: Mediante Carta Oficial N°382 de fecha 20 de octubre de 2021, la CONAF respondió el requerimiento e indicó que se remitió los documentos que obra en su poder sobre la materia consultada, esto es; Resolución N°125/200-7/21 de fecha 28 de septiembre de 2021 que resuelve la solicitud consultada, copia de la solicitud N°125/200-7/21 de fecha 3 de agosto de 2021 y plan de manejo - corrección", "pagina": 2, "offset": 3974, "id": "CPLT-C7949-21#2", "materias": {"Planes de manejo": {"peso": 2, "por": ["frase: plan de manejo"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "CPLT-C7949-21", "orden": 3, "etiqueta": "3", "texto": "AMPARO: El 26 de octubre de 2021, don David Hinostroza Águila, en representación de la Agrupación Cultural Por Los Humedales Entornos Naturales, dedujo amparo a su derecho de acceso a la información en contra del referido órgano de la Administración del Estado, fundado en la respuesta incompleta a su solicitud. El reclamante hizo presente que la información se encuentra tarjada, y se oculta información que no permite corroborar lo solicitado", "pagina": 2, "offset": 4391, "id": "CPLT-C7949-21#3", "materias": {"Transparencia y acceso a la información": {"peso": 6, "por": ["frase: acceso a la información", "frase: derecho de acceso", "término: amparo", "término: reclamante"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "CPLT-C7949-21", "orden": 4, "etiqueta": "1", "texto": "Que, el presente amparo se funda en la disconformidad del reclamante con la respuesta entregada por el órgano, toda vez que fue tarjada información en los antecedentes remitidos, en conformidad, según lo señalado por el órgano, a lo señalado por este Consejo y lo dispuesto en la Ley N°19.628 sobre Protección de la Vida Privada", "pagina": 3, "offset": 7594, "id": "CPLT-C7949-21#4", "materias": {"Protección de datos personales": {"peso": 2, "por": ["frase: vida privada"]}, "Transparencia y acceso a la información": {"peso": 2, "por": ["término: amparo", "término: reclamante"]}}, "normas": ["Ley 19.628"], "refs": [], "principal": false}, {"doc": "CPLT-C7949-21", "orden": 5, "etiqueta": "3", "texto": "Que, luego, cabe tener presente que el nombre, RUN, domicilio y firma de las personas naturales consignadas en los antecedentes consultados, constituyen datos personales en conformidad a lo dispuesto en el artículo 2 letra f) de la Ley N°19.628 sobre Protección de la Vida Privada, referidos a una persona natural identificada o inidentificable, respecto de los cuales, no concurre en la especie ninguna de las hipótesis que habilitan a su tratamiento, en conformidad a lo dispuesto en el artículo 4° de la citada ley, esto es, el consentimiento del titular o la autorización de la ley. En efecto, la divulgación de la referidos datos, sin el beneplácito de sus titulares, implicaría una afectación presente o probable y con suficiente especificidad a la esfera de la vida privada y protección de datos personales de los mismos, derechos contemplados en el artículo 19 N°4 de la Constitución Política de la República, configurándose a su respecto, la causal de reserva del artículo 21 N°2 de la Ley de Transparencia, en relación a lo dispuesto en el artículo 33 letra j) de la misma ley. Por lo anterior, se rechazará el amparo en relación a este punto, en la medida que el actuar del organismo se aviene a lo dispuesto en la Ley sobre Protección de la Vida Privada", "pagina": 4, "offset": 9253, "id": "CPLT-C7949-21#5", "materias": {"Protección de datos personales": {"peso": 8, "por": ["frase: Protección de datos personales", "frase: datos personales", "frase: protección de datos", "frase: vida privada"]}, "Transparencia y acceso a la información": {"peso": 3, "por": ["frase: causal de reserva", "término: amparo"]}}, "normas": ["Constitución", "Ley 19.628"], "refs": [], "principal": false}, {"doc": "CPLT-C7949-21", "orden": 6, "etiqueta": "a", "texto": "Remita nuevamente los documentos entregados, otorgando acceso a los nombres de las personas jurídicas que figuren en los mismos, manteniendo la reserva en relación a los datos personales de contexto de las personas naturales que constan en ellos, tales como nombres, cédula de identidad, domicilio, entre otros que pudieren estar contenidos en los documentos pedidos, en conformidad a lo razonado en el considerando 3° del presente acuerdo", "pagina": 5, "offset": 13071, "id": "CPLT-C7949-21#6", "materias": {"Protección de datos personales": {"peso": 2, "por": ["frase: datos personales"]}, "Transparencia y acceso a la información": {"peso": 2, "por": ["frase: personas jurídicas"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "CPLT-C7949-21", "orden": 7, "etiqueta": "b", "texto": "Cumpla dicho requerimiento en un plazo que no supere los 5 días hábiles contados desde que la presente decisión quede ejecutoriada, bajo el apercibimiento de lo dispuesto en el artículo 46 de la Ley de Transparencia", "pagina": 5, "offset": 13597, "id": "CPLT-C7949-21#7", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "CPLT-C7949-21", "orden": 8, "etiqueta": "cita", "texto": "4) Que, no obstante lo anterior, en relación a los nombres de las personas jurídicas que fueren tarjados, cabe tener en consideración que este Consejo ha resuelto reiteradamente, a partir de las decisiones recaídas en amparos Roles C461-09, C184-10 y C734-10, que en el caso de las personas jurídicas no resulta aplicable la ley N° 19.628, por cuanto los datos personales debe ser referidos a una persona natural identificada o identificable, de acuerdo con la definición prevista en el artículo 2 letra f) de dicho cuerpo legal.", "pagina": 1, "offset": 260, "id": "CPLT-C7949-21#8", "materias": {"Protección de datos personales": {"peso": 3, "por": ["frase: datos personales", "término: tarjado"]}, "Transparencia y acceso a la información": {"peso": 3, "por": ["frase: personas jurídicas", "término: amparo"]}}, "normas": ["Ley 19.628"], "refs": [], "principal": true}, {"doc": "MM-3320-2026", "orden": 1, "etiqueta": "1", "texto": "Principio de Permanencia de las Obligaciones Ambientales. Las obligaciones de reforestación contenidas en los Permisos Ambientales Sectoriales (PAS) evaluados por CONAF en el marco del Sistema de Evaluación de Impacto Ambiental (SEIA) conforme al D.S. N° 40 de 2012 del Ministerio del Medio Ambiente, revisten una naturaleza jurídica que trasciende el ámbito sectorial. Estos compromisos son de responsabilidad exclusiva del titular y se mantienen vigentes durante toda la vida útil del proyecto", "pagina": 1, "offset": 1505, "id": "MM-3320-2026#1", "materias": {"Reforestación y compensación": {"peso": 3, "por": ["frase: vida útil", "término: reforestación"]}, "SEIA / RCA / PAS": {"peso": 6, "por": ["frase: permisos ambientales sectoriales", "frase: evaluación de impacto ambiental", "término: seia", "término: pas"]}}, "normas": ["DS 40"], "refs": [], "principal": true}, {"doc": "MM-3320-2026", "orden": 2, "etiqueta": "2", "texto": "El Precedente Administrativo sobre Medidas de Compensación. La jurisprudencia administrativa en la materia ha fijado un criterio claro respecto a las actividades de reforestación que actúan como medidas de compensación ambiental, diferenciándolas de los simples cumplimientos normativos forestales: Inaplicabilidad de la liberación temporal: El artículo 14 de la Ley N° 20.283 indica que la obligación de sobrevivencia (igual o superior al 75% de los individuos) debe determinarse no antes de que cumplan dos años de vida. Esto constituye un hito de verificación inicial (prendimiento), pero de ninguna manera significa que el titular quede liberado de sus obligaciones ambientales al tercer año. Sustentabilidad en el tiempo: Por definición, según el artículo 100° del D.S. N° 40 de 2012 (Reglamento del Sistema de Evaluación de Impacto Ambiental), las medidas de compensación tienen por finalidad generar un efecto positivo alternativo y equivalente al impacto adverso identificado que no se pudo mitigar o reparar. Por lo tanto, para cumplir su esencia, la medida debe ser capaz de sustentarse en el tiempo. Criterio de fiscalización por vida útil: Si una Resolución de Calificación Ambiental (RCA) no contempla un plazo de seguimiento expreso o acotado para dar por cumplida la medida, esta se entiende potencialmente fiscalizable durante todo el ciclo de vida del proyecto. Concluir lo contrario privaría a la medida de su estándar de equivalencia ambiental", "pagina": 1, "offset": 2014, "id": "MM-3320-2026#2", "materias": {"Reforestación y compensación": {"peso": 12, "por": ["frase: medidas de compensación", "frase: compensación ambiental", "frase: vida útil", "frase: efecto positivo alternativo", "término: reforestación", "término: prendimiento", "término: sobrevivencia", "término: equivalencia"]}, "SEIA / RCA / PAS": {"peso": 5, "por": ["frase: resolución de calificación ambiental", "frase: evaluación de impacto ambiental", "término: rca"]}}, "normas": ["DS 40", "Ley 20.283"], "refs": [], "principal": false}, {"doc": "MM-3400-2022", "orden": 1, "etiqueta": "1", "texto": "La reforestación, que en concreto constituye una medida de compensación, debe tener por finalidad producir o generar un efecto positivo alternativo y equivalente a un efecto adverso identificado, es decir la corta y extracción de la vegetación y flora a realizar (Artículo 100, D. S. N° 40/2012), lo que implica una pérdida neta cero en biodiversidad. Por lo tanto, la reforestación de los recursos naturales afectados se debe realizar en terrenos de similares características, clase, naturaleza, calidad y función, los que son requisitos de equivalencia. Para ello, se debe solicitar al titular, en la evaluación ambiental, la descripción detallada del sitio de corta y el compromiso de realizar la reforestación en un sitio similar", "pagina": 2, "offset": 4022, "id": "MM-3400-2022#1", "materias": {"Reforestación y compensación": {"peso": 8, "por": ["frase: medida de compensación", "frase: pérdida neta cero", "frase: efecto positivo alternativo", "término: reforestación", "término: equivalencia"]}}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-3400-2022", "orden": 2, "etiqueta": "2", "texto": "Adicionalmente, el titular debe establecer la composición, distribución, diversidad y abundancia de los individuos que serán afectados, con el fin de recrear un ecosistema de similares características. Por lo tanto, se debe considerar el número de individuos por especies afectadas (arbóreas, arbustivas, suculentas, herbáceas y epífitas), su superficie y características ecológicas, así como las singularidades ambientales asociadas. Para lo anterior, el titular debe presentar durante la evaluación ambiental, una cronología donde se establezcan para cada objetivo propuesto (establecimiento de plantas, calidad y función ecosistémica, entre otras) el tiempo (años) en que se pretende cumplir", "pagina": 2, "offset": 4821, "id": "MM-3400-2022#2", "materias": {}, "normas": [], "refs": [], "principal": false}, {"doc": "MM-3400-2022", "orden": 3, "etiqueta": "cita", "texto": "la SMA señala que la vida útil del proyecto podría no ser una variable idónea para determinar la vigencia de dicha obligación.", "pagina": 1, "offset": 561, "id": "MM-3400-2022#3", "materias": {"Reforestación y compensación": {"peso": 2, "por": ["frase: vida útil"]}}, "normas": [], "refs": [], "principal": true}], "citas": [{"clave": "CGR-12528", "etiqueta": "Dictamen CGR 12.528/1996", "en_corpus": false, "destino": null, "citado_por": ["MM-862-2021"], "clase": "doctrina externa", "doctrina": "Las tareas inherentes a la función pública no se encomiendan a terceros.", "variantes": ["12528", "12.528"], "critico": false}, {"clave": "CGR-443357", "etiqueta": "Dictamen CGR 443357/2024", "en_corpus": false, "destino": null, "citado_por": ["OF-440-2026"], "clase": "doctrina externa", "doctrina": "Exige al menos tres jornadas diarias presenciales dentro de la jornada semanal.", "variantes": ["443357"], "critico": true}, {"clave": "CGR-9527", "etiqueta": "Dictamen CGR 9.527/2013", "en_corpus": false, "destino": null, "citado_por": ["MM-862-2021"], "clase": "doctrina externa", "doctrina": "Improcedente externalizar la función de inspección.", "variantes": ["9527", "9.527"], "critico": false}, {"clave": "CGR-263", "etiqueta": "Dictamen CGR D263/2026", "en_corpus": false, "destino": null, "citado_por": ["RES-884-2026"], "clase": "doctrina externa", "doctrina": "Reconsidera la jurisprudencia sobre viviendas fiscales; 60 días hábiles para dictar normativa interna.", "variantes": ["263", "D263"], "critico": true}, {"clave": "CGR-125384", "etiqueta": "Dictamen CGR E125384/2021", "en_corpus": false, "destino": null, "citado_por": ["CGR-E337332-2023"], "clase": "doctrina externa", "doctrina": "", "variantes": ["E125384"], "critico": false}, {"clave": "CGR-149544", "etiqueta": "Dictamen CGR E149544/2025", "en_corpus": false, "destino": null, "citado_por": ["MM-1683-2026"], "clase": "doctrina ext
